[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-mcp-studio"
version = "0.23.0"
description = "Local multi-client Skill/MCP compliance audit & repair tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "certifi>=2024.2.2",
]

# 测试一律使用标准库 unittest（见 CONTRIBUTING「运行测试」）。
# 这里刻意**不**声明 pytest / coverage 的依赖与配置：曾经声明过，但 CI 从不安装
# 它们、也从不产出覆盖率数据，导致「该装什么」在 README / CONTRIBUTING /
# pyproject 三者之间说法不一（评审 P1-10，方案 B：全项目统一 unittest）。
# 跑测试请用：
#   scripts/ci_parity.sh
#   python3 -m unittest discover -s tests -p 'test_*.py'

[project.scripts]
skill-mcp-studio = "scan:main"