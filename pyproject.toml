[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-mcp-studio"
version = "0.1.0"
description = "Local multi-client Skill/MCP compliance audit & repair tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
skill-mcp-studio = "scan:main"