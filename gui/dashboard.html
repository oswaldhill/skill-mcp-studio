async function openMergePreview() {
  showToast("info", "正在生成合并预览（dry-run）…", { loading: true });
  const preview = await runCli(["--fix-skills", "--dry-run", "--format", "json"]);
  if (!preview || preview.code !== 0) { showToast("err", (preview && preview.stderr) || "预览失败"); return; }
  let data;
  try { data = JSON.parse(preview.stdout || "{}"); }
  catch { showToast("err", "预览数据解析失败"); return; }
  if (data.kind !== "fix-skills-preview" || !data.scan) {
    showToast("err", data.error || "预览数据异常"); return;
  }
  renderMergePreview(data);
}

// 合并预览分页状态（临时，仅存于当前打开的预览框）
// 每页 8 行，避免弹窗默认出现垂直滚动条
const MERGE_PAGE_SIZE = 8;
let _mergePage = 1;

function renderMergePreview(data) {
  _mergePage = 1;
  const scan = data.scan || {};
  const changes = data.changes || {};
  const fix = data.fix || {};
  const rows = scan.results || [];

  // 从全量 results 自算汇总（覆盖 broken_link，保证与表格行数一致）
  const sum = { total: rows.length, correct: 0, real_dir: 0, missing: 0, wrong_link: 0, broken_link: 0, skipped: 0 };
  rows.forEach((r) => { if (sum[r.status] != null) sum[r.status]++; });
  const needAction = sum.real_dir + sum.wrong_link + sum.broken_link
    + rows.filter((r) => r.status === "missing" && (r.install_state || "none") !== "none").length;

  const statCards = [
    { n: sum.total, l: "总路径", c: "" },
    { n: sum.correct, l: "正确（symlink）", c: "ok" },
    { n: needAction, l: "待修复", c: "err" },
    { n: sum.missing, l: "缺失", c: "err" },
    { n: sum.wrong_link + sum.broken_link, l: "错误指向 / 断链", c: "warn" },
    { n: sum.skipped, l: "跳过（工具自有）", c: "" },
  ].map((s) => `<div class="stat-card ${s.c ? 'accent' : ''}" style="${s.c === 'err' ? '' : ''}">
      <div class="num ${s.c}">${s.n}</div><div class="lbl">${s.l}</div></div>`).join("");

  mountModal(`<div class="modal-backdrop"><div class="modal modal-form" style="width:min(920px,94vw)">
    <div class="form-title">一键合并预览</div>
    <div class="form-sub">以下为 dry-run 预览；确认后将真实写入（带备份回滚）。</div>

    <div class="merge-legend">
      <div class="skill-legend">
        <span class="legend-label">当前状态</span>
        <span class="legend-item"><span class="legend-swatch ok"></span>正确（已是 symlink）</span>
        <span class="legend-item"><span class="legend-swatch err"></span>缺失</span>
        <span class="legend-item"><span class="legend-swatch warn"></span>错误指向 / 断链</span>
        <span class="legend-item"><span class="legend-swatch err"></span>真实目录（独立目录）</span>
        <span class="legend-item"><span class="legend-swatch na"></span>跳过</span>
      </div>
      <div class="skill-legend">
        <span class="legend-label">合并后</span>
        <span class="legend-item"><span class="legend-swatch ok"></span>保持不动</span>
        <span class="legend-item"><span class="legend-swatch err"></span>创建 / 改为 symlink</span>
        <span class="legend-item"><span class="legend-swatch warn"></span>重建 symlink</span>
        <span class="legend-note">symlink = 软链接到统一技能仓库；未安装或工具自有目录不会改动</span>
      </div>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px">${statCards}</div>

    <div class="merge-sec-title">合并清单 <span class="merge-sec-n">${sum.total} 个客户端</span></div>
    <div class="table-scroll"><table class="merge-table">
      <thead><tr>
        <th>客户端</th><th>类型</th><th>Skills 路径</th><th>当前状态</th><th>合并后</th>
      </tr></thead>
      <tbody id="merge-tbody"></tbody>
    </table></div>
    <div id="merge-pager"></div>

    ${renderMergeChanges(data)}

    <div class="form-actions">
      <button class="btn-cancel" id="mg-cancel">取消</button>
      <button id="mg-apply" class="btn-save" ${needAction === 0 ? "disabled" : ""}>
        ${needAction === 0 ? "无需合并" : `确认实写（${needAction} 项）`}
      </button>
    </div>
  </div></div>`);

  $("mg-cancel").onclick = () => { closeModal(); showBanner("warn", "已取消合并。"); };
  $("mg-apply").onclick = async () => {
    closeModal();
    showBanner("warn", "正在执行合并（实写）…");
    const apply = await runCli(["--fix-skills"]);
    if (apply && apply.code === 0) { showBanner("ok", "合并完成：" + (apply.stdout || "").split("\n").slice(0, 2).join(" ")); loadInternal(); }
    else showBanner("err", (apply && apply.stderr) || "合并失败（已回滚）");
  };

  renderMergeRows(rows);
}

function renderMergeRows(rows) {
  const tbody = $("merge-tbody");
  const pager = $("merge-pager");
  if (!tbody) return;
  const pageCount = Math.max(1, Math.ceil(rows.length / MERGE_PAGE_SIZE));
  if (_mergePage > pageCount) _mergePage = pageCount;
  const start = (_mergePage - 1) * MERGE_PAGE_SIZE;
  const items = rows.slice(start, start + MERGE_PAGE_SIZE);

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-cell">没有扫描到的客户端</td></tr>';
  } else {
    tbody.innerHTML = items.map((r) => {
      const st = SKILL_STATUS[r.status] || { label: r.status || "未知", cls: "" };
      const act = mergeActionOf(r);
      return `<tr>
        <td>${escapeHtml(r.tool_name || "—")}</td>
        <td class="mono muted">${escapeHtml(r.type || "—")}</td>
        <td class="mono path-cell" title="${escapeHtml(r.path || "")}">${escapeHtml(r.path || "—")}</td>
        <td><span class="tag ${st.cls}">${escapeHtml(st.label)}</span></td>
        <td class="wrap-cell"><span class="tag ${act.cls}">${escapeHtml(act.label)}</span></td>
      </tr>`;
    }).join("");
  }

  if (pager) {
    if (pageCount <= 1) { pager.innerHTML = ""; return; }
    const prevD = _mergePage <= 1 ? "disabled" : "";
    const nextD = _mergePage >= pageCount ? "disabled" : "";
    pager.innerHTML = `<div class="skill-pager">
      <button type="button" class="pg-btn ${prevD}" data-mp-pg="prev" ${prevD}><span class="pg-arrow">‹</span> 上一页</button>
      <span class="pg-info">第 ${_mergePage} / ${pageCount} 页 · 共 ${rows.length} 个</span>
      <button type="button" class="pg-btn ${nextD}" data-mp-pg="next" ${nextD}>下一页 <span class="pg-arrow">›</span></button>
    </div>`;
    pager.querySelectorAll("[data-mp-pg]").forEach((b) => {
      b.onclick = () => {
        _mergePage = b.dataset.mpPg === "next" ? _mergePage + 1 : Math.max(1, _mergePage - 1);
        renderMergeRows(rows);
      };
    });
  }
}

function renderMergeChanges(data) {
  const changes = data.changes || {};
  const parts = [];
  const add = changes.tools_added || [];
  const rem = changes.tools_removed || [];
  const chg = changes.tools_status_changed || [];
  const sc = changes.summary_changes || {};

  if (add.length) {
    parts.push(`<table class="merge-table">
      <thead><tr><th colspan="3">🆕 新增工具（${add.length}）</th></tr>
      <tr><th>工具</th><th>Skills 路径</th><th>状态</th></tr></thead>
      <tbody>${add.map((t) => `<tr>
        <td>${escapeHtml(t.name || "—")}</td>
        <td class="mono path-cell" title="${escapeHtml(t.path || "")}">${escapeHtml(t.path || "—")}</td>
        <td>${statusTag(t.status)}</td></tr>`).join("")}</tbody></table>`);
  }
  if (rem.length) {
    parts.push(`<table class="merge-table">
      <thead><tr><th colspan="2">🗑 移除工具（${rem.length}）</th></tr>
      <tr><th>工具</th><th>Skills 路径</th></tr></thead>
      <tbody>${rem.map((t) => `<tr>
        <td>${escapeHtml(t.name || "—")}</td>
        <td class="mono path-cell" title="${escapeHtml(t.path || "")}">${escapeHtml(t.path || "—")}</td></tr>`).join("")}</tbody></table>`);
  }
  if (chg.length) {
    parts.push(`<table class="merge-table">
      <thead><tr><th colspan="4">🔄 状态变化（${chg.length}）</th></tr>
      <tr><th>工具</th><th>Skills 路径</th><th>之前</th><th>现在</th></tr></thead>
      <tbody>${chg.map((t) => `<tr>
        <td>${escapeHtml(t.name || "—")}</td>
        <td class="mono path-cell" title="${escapeHtml(t.path || "")}">${escapeHtml(t.path || "—")}</td>
        <td>${statusTag(t.from)}</td><td>${statusTag(t.to)}</td></tr>`).join("")}</tbody></table>`);
  }
  const scRows = [];
  Object.keys(sc).forEach((k) => {
    const v = sc[k];
    const sign = v.diff > 0 ? "+" : "";
    scRows.push(`<tr><td class="mono">${escapeHtml(k)}</td><td class="mono">${v.from}</td><td class="mono">${v.to}</td><td class="mono">${sign}${v.diff}</td></tr>`);
  });
  if (scRows.length) {
    parts.push(`<table class="merge-table">
      <thead><tr><th colspan="4">📊 统计变化</th></tr>
      <tr><th>指标</th><th>之前</th><th>现在</th><th>增减</th></tr></thead>
      <tbody>${scRows.join("")}</tbody></table>`);
  }

  if (!parts.length) return "";

  const last = changes.last_scan_time ? `上次扫描：${escapeHtml(changes.last_scan_time)}` : "首次扫描";
  return `<details class="merge-changes-fold">
    <summary><span class="fold-caret">›</span>变更报告${last ? `<span class="merge-sec-n" style="margin-left:2px">${last}</span>` : ""}</summary>
    <div class="merge-changes">${parts.join("")}</div>
  </details>`;
}

function statusTag(status) {
  const st = SKILL_STATUS[status] || { label: status || "未知", cls: "" };
  return `<span class="tag ${st.cls}">${escapeHtml(st.label)}</span>`;
}

// ---------------- 端点测试辅助 ----------------
async function testEndpointConnection(key, url, token, transport, command) {
  const panel = $("ep-test-panel") || $("ee-test-panel");
  if (!panel) return;
  panel.className = "test-panel show loading";
  panel.innerHTML = '<div class="tp-head">正在探测端点…</div>';
  try {
    // 探测「尚未入库」的新端点：内联传 url / transport / token，后端据此组装临时条目，
    // 不再要求 key 已存在于端点库（否则新增端点时测试会误报「端点不存在」）。
    const args = ["--test-endpoint", key, "--endpoint-transport", transport];
    const isStdio = transport === "stdio";
    if (isStdio) {
      const cmd = (command || "").trim();
      if (!cmd) { panel.className = "test-panel show err"; panel.innerHTML = '<div class="tp-head">探测失败</div><div class="tp-err">stdio 端点需要填写本地命令</div>'; return; }
      args.push("--endpoint-command", cmd);
    } else if (!url) {
      panel.className = "test-panel show err";
      panel.innerHTML = '<div class="tp-head">探测失败</div><div class="tp-err">请先填写 URL</div>';
      return;
    } else {
      args.push("--endpoint-url", url);
    }
    if (token) args.push("--endpoint-auth-token", token);
    const res = await runCli(args);
    if (!res || res.code === undefined) {
      panel.className = "test-panel show err";
      panel.innerHTML = '<div class="tp-head">探测失败</div><div class="tp-err">无法连接 CLI</div>';
      return;
    }
    const data = JSON.parse(res.stdout || "{}");
    if (data.ok) {
      const tools = (data.tool_names || []).map(t => `<span class="tp-tool">${escapeHtml(t)}</span>`).join("");
      panel.className = "test-panel show ok";
      panel.innerHTML = `<div class="tp-head">连接成功 - ${data.tool_names ? data.tool_names.length : 0} 个工具（${escapeHtml(data.transport || "streamable-http")}）</div>
        ${tools ? '<div class="tp-tools">'+tools+'</div>' : ''}`;
    } else {
      panel.className = "test-panel show err";
      panel.innerHTML = `<div class="tp-head">探测失败</div><div class="tp-err">${escapeHtml(data.error || "未知错误")}</div>`;
    }
  } catch (e) {
    panel.className = "test-panel show err";
    panel.innerHTML = `<div class="tp-head">探测异常</div><div class="tp-err">${escapeHtml(e.message || String(e))}</div>`;
  }
}

// 表内「测试」按钮：对已保存端点发起探测，结果用专门的对话框展示
async function testStoredEndpoint(key) {
  // 从快照取端点摘要（name / url / command / transport / auth_token）
  const mcp = (SNAP && SNAP.mcp) || {};
  const ep = (mcp.endpoints || []).find(e => e.key === key) || {};
  const isStdio = (ep.transport || "streamable-http") === "stdio";
  const address = isStdio ? (ep.command || "—") : (ep.url || "—");

  mountModal(`<div class="modal-backdrop"><div class="modal modal-form test-modal">
    <div class="form-title">测试连接 - ${escapeHtml(key)}</div>
    <div class="form-sub">正在探测 MCP 端点，请稍候…</div>
    <div class="ts-body" id="ts-body">
      <div class="ts-loading"><div class="ts-spinner"></div>正在初始化连接…</div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="ts-close">关闭</button>
    </div>
  </div></div>`);

  $("ts-close").onclick = closeModal;

  try {
    const res = await runCli(["--test-endpoint", key]);
    if (!res || res.code === undefined) throw new Error("无法连接 CLI");
    const data = JSON.parse(res.stdout || "{}");
    const body = $("ts-body");
    const summary = `<div class="ts-summary">
        <span class="k">端点</span><span class="v">${escapeHtml(key)}</span>
        <span class="k">名称</span><span class="v">${escapeHtml(ep.name || "—")}</span>
        <span class="k">传输</span><span class="v">${escapeHtml(data.transport || ep.transport || "streamable-http")}</span>
        <span class="k">地址</span><span class="v">${escapeHtml(address)}</span>
      </div>`;
    if (data.ok) {
      const tools = data.tool_names || [];
      body.innerHTML = `<div class="ts-result ok">
          <div class="ts-badge">连接成功</div>
          ${summary}
          <div class="ts-tools-label">发现 ${tools.length} 个工具</div>
          ${tools.length
            ? '<div class="ts-tools">' + tools.map(t => `<span class="ts-tool">${escapeHtml(t)}</span>`).join("") + '</div>'
            : '<div class="ts-empty">该端点未返回任何工具</div>'}
        </div>`;
    } else {
      body.innerHTML = `<div class="ts-result err">
          <div class="ts-badge">连接失败</div>
          ${summary}
          <div class="ts-error">${escapeHtml(data.error || "未知错误")}</div>
        </div>`;
    }
  } catch (e) {
    $("ts-body").innerHTML = `<div class="ts-result err">
        <div class="ts-badge">探测异常</div>
        <div class="ts-error">${escapeHtml(e.message || String(e))}</div>
      </div>`;
  }
}

document.addEventListener("click", (e) => {

    closeModal();

  }
  const homeLink = e.target.closest("[data-open-url]");
  if (homeLink) { openExternal(homeLink.dataset.openUrl); return; }

    const dir = pgBtn.dataset.pg;

    saveStore("skill-page", SKILL_PAGE);
    renderSkillList();

    toggleAgentMenu(kebab, kebab.dataset.name);

    const name = nestToggle.dataset.toggleNest;
    const targets = document.querySelectorAll(`[data-nest-of="${CSS.escape(name)}"]`);
    const opening = nestToggle.getAttribute("aria-expanded") !== "true";
    targets.forEach((t) => { t.hidden = !opening; });
    nestToggle.setAttribute("aria-expanded", opening ? "true" : "false");
    nestToggle.classList.toggle("open", opening);
    // 高亮所属的父行/父卡片，明确「展开的内容归这个目录」
    document.querySelectorAll(`[data-skill="${CSS.escape(name)}"]`).forEach((row) => {
      row.classList.toggle("nesting-open", opening);
    });
    return;
  }
  const ppCopy = e.target.closest(".path-pop [data-copy], .skill-card [data-copy]");
  if (ppCopy) { copyTextToClipboard(ppCopy.dataset.copy); return; }
  if (e.target.closest(".path-pop")) return;

  if (popItem) { runAgentMenu(popItem.dataset.pm, popItem.dataset.name); return; }
  const skPopItem = e.target.closest(".pop-menu [data-spm]");
  if (skPopItem) { runSkillMenu(skPopItem.dataset.spm, skPopItem.dataset.skill); return; }
  if (e.target.closest(".pop-menu") || e.target.closest(".palette")) return;
  const goto = e.target.closest("[data-goto]");
  if (goto) { switchPage(goto.dataset.goto); return; }
  const act = e.target.closest("[data-action]");
  if (act) {
    const a = act.dataset.action;
    if (a === "add-agent") renderAddPanel();
    else if (a === "refresh-audit") refreshWithBtn(act);
    else if (a === "rescan") doRescan(act);
    else if (a === "refresh") refreshWithBtn(act);
    else if (a === "fix-all") fixAllSkillsMcp();
    else if (a === "set-dir") openUnifiedDirModal();
    else if (a === "merge") openMergePreview();
    else if (a === "add-endpoint") openAddEndpointModal();
    else if (a === "edit-endpoint") openEditEndpoint(act.dataset);
    else if (a === "rm-endpoint") removeEndpoint(act.dataset.key);
    else if (a === "test-endpoint") testStoredEndpoint(act.dataset.key);
    else if (a === "agent-detail") showAgentDetail(act.dataset.name);
    else if (a === "fix-skills") fixSkillsFor(act.dataset.name);
    else if (a === "fix-mcp") fixMcpFor(act.dataset.name);
    else if (a === "cleanup-config") cleanupConfigFor(act.dataset.name);
    else if (a === "clean-legacy") cleanLegacyMcp(act.dataset.name);
    else if (a === "show-mcp-class") showMcpClass(act.dataset.name, act.dataset.class);
    else if (a === "remove-mcp-entry") removeMcpEntry(act.dataset.name, act.dataset.key, act.dataset.high === "1", act.dataset.reason);
    else if (a === "remove-mcp-class") removeMcpClassEntries(act.dataset.name, act.dataset.class);
    else if (a === "show-config-backups") showConfigBackups(act.dataset.name);
    else if (a === "restore-config-backup") restoreConfigBackup(act.dataset.name, act.dataset.path);
    else if (a === "skill-backup") backupSkill(act.dataset.skill);
    else if (a === "skill-export") exportSkill(act.dataset.skill);

  }
  const card = e.target.closest(".skill-card, .skill-row");
  if (card && card.dataset.skill) showSkillDetail(card.dataset.skill);
  // 点击任何非菜单区域（空白、卡片、其它控件后未 return 的路径）都收起弹出菜单。

// 链接形态的可读名称：root/per_skill 都表示「通过软链接/快捷方式链接到统一技能目录」。
function linkFormText(f) {
  return f === "root" ? "整目录链接" : (f === "per_skill" ? "逐技能链接" : (f === "mixed" ? "未链接（独立目录）" : "无数据"));
}

function needFixSkillsFor(a) {
  const fixable = !!(a && a.installed && a.fix_supported);
  if (!fixable) return false;
  const linked = a.skills_enabled_count || 0;
  const total = a.skills_total || 0;
  return (a.skills_dir_found && total > 0) ? linked !== total : true;
}

function needFixMcpFor(a) {
  const fixable = !!(a && a.installed && a.fix_supported);
  if (!fixable) return false;
  if (!a.mcp_config_path) return false;
  const eps = (SNAP && SNAP.mcp && SNAP.mcp.endpoint_status) || {};
  const attachKeys = (a.mcp_attach && a.mcp_attach.length) ? a.mcp_attach : [];
  if (!attachKeys.length) return false;
  let configured = 0;
  for (const key of attachKeys) {
    const s = eps[key];
    const rec = (s && s.records || []).find((r) => r.name === a.name) || null;
    if (rec && rec.mcp_configured) configured++;
  }
  return configured < attachKeys.length;
}

  const left = rect ? Math.max(12, rect.right - 176) : window.innerWidth - 200;
  const top = rect ? rect.bottom + 6 : 120;
  root.innerHTML = `<div class="pop-menu" style="left:${left}px;top:${top}px">
    <button class="pm-item" data-spm="detail" data-skill="${escapeHtml(skill)}">${ICONS.info}<span>查看详情</span></button>

function toggleAgentMenu(btnEl, name) {
  const root = $("pop-root");
  if (!root) return;
  if (root.innerHTML) { root.innerHTML = ""; return; }
  const rect = btnEl ? btnEl.getBoundingClientRect() : null;
  const left = rect ? Math.max(12, rect.right - 176) : window.innerWidth - 200;
  const top = rect ? rect.bottom + 6 : 120;
  const a = (SNAP && SNAP.agents || []).find((x) => x.name === name);
  const isConfigOnly = !!(a && a.install_state === "config_only");
  const needSkills = needFixSkillsFor(a);
  const needMcp = needFixMcpFor(a);
  const fixItems = (needSkills || needMcp)
    ? `<div class="pm-sep"></div>
       ${needSkills ? `<button class="pm-item" data-pm="fix-skills" data-name="${escapeHtml(name)}">${ICONS.check}<span>修复 Skills</span></button>` : ""}
       ${needMcp ? `<button class="pm-item" data-pm="fix-mcp" data-name="${escapeHtml(name)}">${ICONS.check}<span>修复 MCP</span></button>` : ""}`

    ? `<div class="pm-sep"></div>
       <button class="pm-item danger" data-pm="cleanup-config" data-name="${escapeHtml(name)}">${ICONS.cross}<span>删除（含残留配置）</span></button>`
    : "";
  root.innerHTML = `<div class="pop-menu" style="left:${left}px;top:${top}px">
    <button class="pm-item" data-pm="detail" data-name="${escapeHtml(name)}">${ICONS.info}<span>查看详情</span></button>
    <button class="pm-item" data-pm="rescan" data-name="${escapeHtml(name)}">${ICONS.search}<span>重新扫描</span></button>
    ${fixItems}${cleanupItem}

    <button class="pm-item danger" data-pm="remove" data-name="${escapeHtml(name)}">${ICONS.cross}<span>移出管理</span></button>
  </div>`;
}

    if (!res) return { ok: false, message: "工具未能执行", detail: "run_cli 无返回" };
    const out = res.stdout || "";
    if (out.includes("旧通道条目已移除")) {

    }
    return { ok: false, message: "清理未完成", detail: cliFailLines(res) || "未识别到清理结果标记" };
  }, undefined, ["备份原配置", "移除旧通道条目", "校验回写", "验证结果"]);

// ---------------- MCP 条目删除 / 批量清理 / 从备份恢复（阶段五） ----------------

/**
 * 把 `--format json` 的 MCP 结果转成 runTaskModal 契约。
 *
 * Task 6 已把 4 个新命令放进「阶段五早返回」组，带 `--format json` 时 stdout 是
 * 纯 JSON，故这里直接 JSON.parse，不再做 legacy 路径那种 stdout 字符串匹配。
 * status 取值：updated / unchanged / refused / missing / unsupported / error / dry-run。
 */
function mcpResultToTask(res, okMessage) {
  let payload = null;
  try { payload = JSON.parse(stripAnsi((res && res.stdout) || "")); } catch (e) { payload = null; }
  if (!payload || typeof payload !== "object" || !payload.status) {
    return { ok: false, message: "未识别到结构化结果", detail: cliFailLines(res) || cliErrDetail(res) };
  }
  const skippedList = payload.skipped_high_risk || [];
  const skippedText = skippedList.length
    ? `已跳过 ${skippedList.length} 条疑似客户端自带：${skippedList.map((s) => s.key).join("、")}` : "";
  const skippedDetail = skippedList.map((s) => `- ${s.key}：${s.reason || "疑似客户端自带"}`).join("\n");
  const attach = (payload.attach_updated || []).length
    ? `（已同步摘除挂载声明：${payload.attach_updated.join("、")}）` : "";
  switch (payload.status) {
    case "updated": {
      const count = (payload.removed || []).length;
      return { ok: true, message: okMessage + (count > 1 ? `（共 ${count} 条）` : "") + attach + (skippedText ? `（${skippedText}）` : "") };
    }
    case "unchanged":
      // 命中 0 条且确有被跳过高危的条目时，不能报「成功」——用户看到的应是「没清掉」。
      if (skippedDetail) {
        return { ok: false, message: "未清理任何条目（疑似客户端自带的条目默认不清理）", detail: skippedDetail };
      }
      return { ok: true, message: "没有匹配到要移除的条目" };
    case "dry-run":
      return { ok: true, message: "预演完成（未改动配置）", detail: payload.message || "" };
    case "refused":
      return {
        ok: false,
        message: "已拒绝" + (skippedText ? `（${skippedText}）` : ""),
        detail: [payload.message, ...(payload.high_risk || []).map((h) => `- ${h.key}：${h.risk_reason || ""}`)].join("\n"),
      };
    case "missing":
      return { ok: false, message: "配置文件缺失，未做改动", detail: payload.message };
    case "unsupported":
      return { ok: false, message: "该客户端不支持配置写入", detail: payload.message };
    case "error":
      return { ok: false, message: "操作未完成", detail: payload.message || cliErrDetail(res) };
    default: // 未知状态（CLI 新增 status 时兜底）
      return { ok: false, message: "操作未完成（" + payload.status + "）", detail: payload.message || cliErrDetail(res) };
  }
}

async function removeMcpEntry(name, key, high, reason) {
  const msg = high
    ? `「${key}」疑似客户端自带${reason ? `（${reason}）` : ""}，删除可能破坏该客户端的功能。\n原配置会先备份。确认继续？`
    : `将从 ${name} 的 MCP 配置中移除条目「${key}」。\n原配置会先备份，可用「从备份恢复」还原。继续？`;
  const ok = high
    ? await confirmTypedKeyModal("删除疑似客户端自带条目", msg, key)
    : await confirmModal("删除 MCP 条目", msg, true);
  if (!ok) return;
  await runTaskModal(`删除 ${name} 的 ${key}`, async () => {
    const args = ["--remove-mcp-entry", key, "--client", name, "--format", "json"];
    if (high) args.push("--force-high-risk");
    const res = await runCli(args);
    if (!res) return { ok: false, message: "工具未能执行", detail: "run_cli 无返回" };
    return mcpResultToTask(res, `已删除 ${key}`);
  }, undefined, ["读取 MCP 配置", "备份原配置", "移除条目", "校验回写"]);
}

    true,

    const args = ["--remove-mcp-class", cls, "--client", name, "--format", "json"];

}

  </div></div>`);
  $("cfgbak-close").onclick = closeModal;
}

  if (!ok) return;
  await runTaskModal(`删除 ${name}`, async () => {
    const res = await runCli(["--cleanup-config", "--client", name]);
    if (!res) return { ok: false, message: "工具未能执行", detail: "run_cli 无返回" };
    if (res.code === 0) {
      const out = stripAnsi(res.stdout || "");
      if (out.includes("已移除") || out.includes("已删除") || out.includes("已清理") || out.includes("已停用")) return { ok: true, message: `${name} 已删除` };
      if (out.includes("unchanged") || out.includes("未找到")) return { ok: true, message: `${name} 已无残留痕迹` };
      return { ok: true, message: `${name} 删除完成` };
    }
    return { ok: false, message: "删除失败", detail: cliErrDetail(res) };
  }, undefined, ["定位配置", "定位 skills 链接", "本机停用", "删除文件", "校验"]);
}

    const r1 = await runCli(["--fix-skills"]);

    const errs = [];

    if (errs.length) return { ok: false, message: "一键修复未全部完成", detail: errs.join("\n") };
    return { ok: true, message: "所有客户端的 Skills 与 MCP 已修复", detail: oks.join("\n") };
  }, undefined, ["修复 Skills 链接", "写入统一 MCP 配置", "重新扫描验证"]);
