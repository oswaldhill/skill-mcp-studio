  .skill-table td { padding: 6px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .skill-table tbody tr:last-child td { border-bottom: none; }
  .skill-table tbody tr { cursor: pointer; }
  .skill-table tbody tr:hover td { background: var(--bg-elev); }
  .skill-table .st-name { font-family: var(--mono); font-weight: 600; color: var(--text); overflow: hidden; }
  .skill-table .st-name .st-name-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .skill-table .st-name .nest-count { flex: none; }
  .skill-table .st-cat { overflow: hidden; text-overflow: ellipsis; }
  .skill-table .st-usage { color: var(--muted); font-size: var(--fs-xs); overflow: hidden; min-width: 0; }
  .skill-table .st-usage.has-home { white-space: nowrap; text-overflow: ellipsis; }
  .skill-table .st-usage .st-usage-text { display: inline; }
  .skill-table .st-usage.wrap { white-space: normal; line-height: 1.5; }
  .skill-table .st-usage.wrap .st-usage-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .skill-table .st-usage .st-home-link { display: inline-flex; align-items: center; gap: 4px; margin-right: 9px; border: none; background: transparent; box-shadow: none; padding: 0; color: var(--accent); font-family: var(--mono); font-size: var(--fs-2xs); cursor: pointer; vertical-align: middle; }
  .skill-table .st-usage .st-home-link svg { width: 11px; height: 11px; flex: none; }
  .skill-table .st-usage .st-home-link:hover { color: var(--accent-strong); text-decoration: underline; }
  .skill-table .st-status { text-align: right; white-space: nowrap; }
  .skill-table .st-ops { text-align: right; white-space: nowrap; }
  .skill-table .sk-cat { display: inline-block; vertical-align: middle; font-size: var(--fs-2xs); line-height: 1.5; font-weight: 600; letter-spacing: .03em; color: var(--accent); background: var(--accent-bg); padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .skill-table .st-count {
    display: inline-block; vertical-align: middle; font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.5; padding: 1px 8px;
    border-radius: var(--r-pill); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap;
  }
  .skill-table .st-count.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
  .skill-table .st-count.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
  .skill-table .st-count.err { color: var(--err); background: var(--err-bg); border-color: var(--err-border); }

  /* 可折叠侧栏分组 */
  .nav-group-label { display: flex; align-items: center; gap: 8px; border: none; background: none; box-shadow: none; text-align: left; width: 100%; cursor: pointer; }
  .nav-group-label .chev { margin-left: auto; width: 12px; height: 12px; stroke: var(--faint); transition: transform .18s var(--ease); }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const escapeHtml = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

let SNAP = null;

// ---------------- theme（Light / Dark / System，参考 skills-manager 设置页） ----------------
const THEME_KEY = "sms-theme";
function currentThemeMode() {
  try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return "system"; }
}
function applyTheme(mode, persist) {
  try { if (persist) localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 隐私模式忽略 */ }
  const dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0C0C0F" : "#FAFAFA");
  document.querySelectorAll("[data-theme-btn]").forEach((b) => b.classList.toggle("active", b.dataset.themeBtn === mode));
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (currentThemeMode() === "system") applyTheme("system", false);
});
applyTheme(currentThemeMode(), false);

// ---------------- 界面缩放（scale）----------------
const SCALE_KEY = "sms-scale";
const SCALE_OPTIONS = [0.9, 1, 1.1, 1.25];
function currentScale() {
  try {
    const v = parseFloat(localStorage.getItem(SCALE_KEY));
    return SCALE_OPTIONS.includes(v) ? v : 1;
  } catch (e) { return 1; }
}
function applyScale(scale, persist) {
  try { if (persist) localStorage.setItem(SCALE_KEY, String(scale)); } catch (e) { /* 隐私模式忽略 */ }
  document.documentElement.style.zoom = String(scale);
  document.querySelectorAll("[data-scale-btn]").forEach((b) => b.classList.toggle("active", parseFloat(b.dataset.scaleBtn) === scale));
}
applyScale(currentScale(), false);

function showBanner(kind, text) {
  const b = $("banner");
  b.className = "banner " + kind;
  b.textContent = text;
}
function clearBanner() { const b = $("banner"); b.className = ""; b.textContent = ""; }

function mountModal(html) {
  const modal = $("modal-root");
  modal.innerHTML = html;
  const focusEl = modal.querySelector("input, select, textarea, button");
  if (focusEl) focusEl.focus();
}
function closeModal() { $("modal-root").innerHTML = ""; }

/**
 * Custom confirmation dialog — replaces browser window.confirm().
 * Returns a Promise<boolean>. In browser preview mode, falls back to window.confirm().
 */
function confirmModal(title, message, danger) {
  return new Promise((resolve) => {
    const iconHtml = danger
      ? '<div class="cfm-icon">!</div>'
      : '';
    $("modal-root").innerHTML = `<div class="modal-backdrop"><div class="modal cfm-card">
      ${iconHtml}
      <div class="cfm-title">${escapeHtml(title)}</div>
      <div class="cfm-msg">${escapeHtml(message)}</div>
      <div class="actions">
        <button class="cfm-btn-cancel" id="cfm-no">取消</button>
        <button class="cfm-btn-danger" id="cfm-yes">${danger ? '确认删除' : '确认'}</button>
      </div>
    </div></div>`;
    $("cfm-no").onclick = () => { closeModal(); resolve(false); };
    $("cfm-yes").onclick = () => { closeModal(); resolve(true); };
  });
}

/**
 * 高风险条目强确认：必须逐字手输条目 key 才解锁删除按钮。
 * 复用 confirmModal 的样式类与 mountModal 挂载方式，不新造视觉与挂载机制。
 */
function confirmTypedKeyModal(title, message, keyName) {
  return new Promise((resolve) => {
    mountModal(`<div class="modal-backdrop"><div class="modal cfm-card">
      <div class="cfm-icon">!</div>
      <div class="cfm-title">${escapeHtml(title)}</div>
      <div class="cfm-msg">${escapeHtml(message)}</div>
      <div class="cfm-typed"><input id="cfm-typed-input" type="text" autocomplete="off" spellcheck="false"
        placeholder="输入 ${escapeHtml(keyName)} 以确认" aria-label="输入条目名以确认" /></div>
      <div class="actions">
        <button class="cfm-btn-cancel" id="cfm-no">取消</button>
        <button class="cfm-btn-danger" id="cfm-yes" disabled>确认删除</button>
      </div>
    </div></div>`);
    const input = $("cfm-typed-input");
    const yes = $("cfm-yes");
    input.oninput = () => { yes.disabled = input.value.trim() !== keyName; };
    $("cfm-no").onclick = () => { closeModal(); resolve(false); };
    yes.onclick = () => { if (yes.disabled) return; closeModal(); resolve(true); };
  });
}

/**
 * 执行任务并用对话框展示「进度 → 结果」。
 * run: async () => ({ ok, message, detail })  其中 detail 可选，展示为等宽详情块。
 * 结束后调用 refresh（默认 loadInternal(false)）刷新快照。
 */
function stripAnsi(s) {
  if (s == null) return "";
  return String(s)
    .replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "")
    .replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, "")
    .replace(/\r/g, "");
}

function cliErrDetail(res) {
  if (!res) return "run_cli 无返回";
  const err = stripAnsi(res.stderr || "").trim();
  if (err) return err;
  const out = stripAnsi(res.stdout || "").trim();
  return out ? out.slice(0, 1600) : `退出码 ${res.code}`;
}

function cliFailLines(res) {
  // 从 stdout 里挑出仅有的失败/拒绝行，去掉符号噪音，供失败态精简展示。
  if (!res) return "";
  const out = stripAnsi(res.stdout || "");
  if (!out.trim()) return stripAnsi(res.stderr || "").trim();
  const lines = out.split("\n")
    .map((l) => l.trim())
    .filter((l) => l && /❌|Refused|failed|error|失败|拒绝/i.test(l))
    .map((l) => l.replace(/[\u2600-\u27BF\uFE0F\uD83C-\uDBFF\uDC00-\uDFFF]/g, "").trim());
  return lines.join("\n").slice(0, 1600) || stripAnsi(res.stderr || "").trim().slice(0, 1600);
}

async function runTaskModal(title, run, refresh, stages) {
  // 分步阶段（可选）：真实命令是一次性返回，这里用阶段列表给出过程反馈，
  // 每个阶段按时间依次点亮，最后停在实际完成前的状态上等待真实结果。
  const stageList = (Array.isArray(stages) && stages.length) ? stages : null;
  let stageTimer = null;
  let stageIndex = -1;
  mountModal(`<div class="modal-backdrop"><div class="modal cfm-card task-card">
    <div class="task-spinner"></div>
    <div class="cfm-title">${escapeHtml(title)}</div>
    ${stageList
      ? `<div class="task-stages">${stageList.map((s, i) => `<div class="task-stage" data-si="${i}"><span class="ts-dot"></span><span class="ts-label">${escapeHtml(s)}</span></div>`).join("")}</div>`
      : `<div class="cfm-msg">正在执行…</div>`}
  </div></div>`);
  if (stageList) {
    stageIndex = 0;
    paintStage(0, stageList.length);
    stageTimer = setInterval(() => {
      stageIndex = Math.min(stageIndex + 1, stageList.length - 1);
      paintStage(stageIndex, stageList.length);
    }, 800);
  }
  let ok = false, message = "", detail = "";
  try {
    const r = (await run()) || {};
    ok = !!r.ok;
    message = r.message || (ok ? "完成" : "失败");
    detail = stripAnsi(r.detail || "");
  } catch (err) {
    ok = false;
    message = "工具运行失败";
    detail = stripAnsi(String((err && err.message) || err));
  }
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  const icon = ok ? ICONS.check : ICONS.cross;
  const resCls = ok ? "ok" : "err";
  const statusWord = ok ? "成功" : "失败";
  const detailHtml = detail
    ? `<details class="task-fold" ${ok ? "" : "open"}><summary>查看详情</summary><div class="task-detail">${escapeHtml(detail)}</div></details>`
    : "";
  mountModal(`<div class="modal-backdrop"><div class="modal cfm-card task-card">
    <div class="task-result ${resCls}">${icon}</div>
    <div class="task-status ${resCls}">${statusWord}</div>
    <div class="cfm-msg">${escapeHtml(message)}</div>
    ${detailHtml}
    <div class="actions">
      <button class="primary" id="task-close">完成</button>
    </div>
  </div></div>`);
  $("task-close").onclick = closeModal;
  const doRefresh = (typeof refresh === "function") ? refresh : () => loadInternal(false);
  doRefresh();
}

function paintStage(idx, total) {
  document.querySelectorAll(".task-stage").forEach((el) => {
    const i = parseInt(el.dataset.si, 10);
    el.classList.toggle("done", i < idx);
    el.classList.toggle("active", i === idx && idx < total);
  });
}

const CLASS_TRANSLATE = { attached: "已挂载", legacy: "旧通道", unmanaged: "未纳管" };
const CLASS_COLOR = { attached: "ok", legacy: "err", unmanaged: "" };

// Skills 目录扫描状态：中文标签 + 色彩 class（correct=绿 / 需修复=红 / 指向异常=黄 / 跳过=灰）
const SKILL_STATUS = {
  correct:     { label: "正确",        cls: "ok" },
  real_dir:    { label: "真实目录",    cls: "err" },
  missing:     { label: "缺失",        cls: "err" },
  wrong_link:  { label: "错误指向",    cls: "warn" },
  broken_link: { label: "断链",        cls: "warn" },
  skipped:     { label: "跳过",        cls: "" },
};

// 每个 status 对应的「合并动作」说明（表格「合并后」列使用）
function mergeActionOf(row) {
  const s = row.status;
  const present = (row.install_state || "none") !== "none";
  if (s === "correct") return { label: "保持不动", cls: "ok" };
  if (s === "real_dir") return { label: "备份原目录 → 改为 symlink", cls: "err" };
  if (s === "wrong_link" || s === "broken_link") return { label: "重建 symlink", cls: "warn" };
  if (s === "missing") return present
    ? { label: "创建 symlink", cls: "err" }
    : { label: "跳过（未安装）", cls: "" };
  return { label: "跳过（工具自有目录）", cls: "" };
}

// ---------------- 图标库（内联 SVG，禁用 emoji 图标） ----------------
const ICONS = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',

  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4"/></svg>',
  kebab: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',

// ---------------- 本地存储辅助 ----------------
function loadStore(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : v; } catch (e) { return def; } }
function saveStore(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* 隐私模式忽略 */ } }

// ---------------- Toast 栈（参考 InstallToast：进度 → 完成） ----------------
function showToast(kind, text, opts = {}) {
  const root = $("toast-root");
  if (!root) return;
  const el = document.createElement("div");
  el.className = "toast " + kind;
  const ico = opts.loading
    ? '<span class="t-ico t-spin">' + ICONS.info + '</span>'
    : '<span class="t-ico">' + (ICONS[kind] || ICONS.info) + '</span>';
  el.innerHTML = ico + '<span class="t-msg"></span>';
  el.querySelector(".t-msg").textContent = text;
  root.appendChild(el);
  if (!opts.persist) {
    const ttl = kind === "err" ? 6000 : 3200;
    setTimeout(() => {
      el.style.transition = "opacity .2s var(--ease), transform .2s var(--ease)";
      el.style.opacity = "0"; el.style.transform = "translateY(6px)";
      setTimeout(() => el.remove(), 200);
    }, ttl);
  }
  return el;
}

// ---------------- ⌘K 命令面板（参考 CommandPalette：↑↓ Enter + 分组） ----------------
const KIND_RANK = { "页面": 0, "操作": 1, "技能": 2, "主题": 3 };
let PALETTE = { open: false, q: "", active: 0, items: [] };
function paletteItems() {
  const skills = (SNAP && SNAP.skills && SNAP.skills.list) || [];

    { kind: "操作", label: "添加 IDE / API", sub: "纳入新客户端", run: () => renderAddPanel() },
    { kind: "操作", label: "管理 MCP 端点", sub: "打开设置页端点库", run: () => switchPage("settings") },
    { kind: "操作", label: "修改统一技能目录", sub: "--set-unified-dir", run: () => openUnifiedDirModal() },
    { kind: "主题", label: "浅色", sub: "light", run: () => applyTheme("light", true) },
    { kind: "主题", label: "深色", sub: "dark", run: () => applyTheme("dark", true) },
    { kind: "主题", label: "跟随系统", sub: "system", run: () => applyTheme("system", true) },
  ].concat(skills.map((s) => ({ kind: "技能", label: s, sub: "查看详情", run: () => showSkillDetail(s) })));
}
function paletteFiltered() {
  const q = PALETTE.q.trim().toLowerCase();
  return paletteItems()
    .filter((it) => !q || it.label.toLowerCase().includes(q) || (it.sub || "").toLowerCase().includes(q))
    .sort((a, b) => (KIND_RANK[a.kind] ?? 9) - (KIND_RANK[b.kind] ?? 9));
}
function openPalette() {
  PALETTE = { open: true, q: "", active: 0, items: [] };
  const root = $("pop-root");
  root.innerHTML = '<div class="palette">' +
    '<div class="pal-input-wrap">' + ICONS.search + '<input class="pal-input" id="pal-input" placeholder="搜索页面、操作或技能…" aria-label="命令搜索" /></div>' +
    '<div class="pal-list" id="pal-list"></div></div>';
  const inp = $("pal-input");
  inp.addEventListener("input", () => { PALETTE.q = inp.value; PALETTE.active = 0; renderPaletteList(); });
  setTimeout(() => inp.focus(), 0);
  renderPaletteList();
}
function renderPaletteList() {
  const list = $("pal-list");
  if (!list) return;
  const flat = paletteFiltered();
  PALETTE.items = flat;
  let html = "", lastKind = null;
  flat.forEach((it, idx) => {
    if (it.kind !== lastKind) { html += '<div class="pal-group-label">' + escapeHtml(it.kind) + '</div>'; lastKind = it.kind; }
    html += '<button class="pal-item' + (idx === PALETTE.active ? " active" : "") + '" data-pi="' + idx + '">' +
      iconForKind(it.kind) + '<span class="pi-label">' + escapeHtml(it.label) + '</span>' +
      (it.sub ? '<span class="pi-sub">' + escapeHtml(it.sub) + '</span>' : '') + '</button>';
  });
  if (!flat.length) html = '<div class="empty" style="margin:10px">无匹配结果</div>';
  list.innerHTML = html;
  list.querySelectorAll(".pal-item").forEach((b) => {
    b.addEventListener("click", () => runPaletteItem(parseInt(b.dataset.pi, 10)));
    b.addEventListener("mousemove", () => { const i = parseInt(b.dataset.pi, 10); if (i !== PALETTE.active) { PALETTE.active = i; renderPaletteList(); } });
  });
  const act = list.querySelector(".pal-item.active");
  if (act) act.scrollIntoView({ block: "nearest" });
}
function runPaletteItem(i) {
  const it = PALETTE.items[i];
  if (!it) return;
  closePop();
  it.run();
}
function closePop() { PALETTE.open = false; $("pop-root").innerHTML = ""; }

// 全局键盘：⌘K 开关面板、Esc 逐级关闭、面板内 ↑↓/Enter
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") {
    e.preventDefault();
    PALETTE.open ? closePop() : openPalette();
    return;
  }
  if (e.key === "Escape") {
    if (PALETTE.open || ($("pop-root") && $("pop-root").innerHTML)) { closePop(); return; }
    closeModal();
    return;
  }
  if (PALETTE.open) {
    if (e.key === "ArrowDown") { e.preventDefault(); PALETTE.active = Math.min(PALETTE.active + 1, PALETTE.items.length - 1); renderPaletteList(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); PALETTE.active = Math.max(PALETTE.active - 1, 0); renderPaletteList(); }
    else if (e.key === "Enter") { e.preventDefault(); runPaletteItem(PALETTE.active); }
  }
});

// 弹出菜单为 position:fixed（视口定位），不随卡片滚动；滚动时立即收起，

function applyNavGroup(g, collapsed) {
  const lbl = document.querySelector('.nav-group-label[data-group="' + g + '"]');
  if (!lbl) return;
  lbl.classList.toggle("collapsed", collapsed);
  lbl.setAttribute("aria-expanded", String(!collapsed));
  let n = lbl.nextElementSibling;
  while (n && !n.classList.contains("nav-group-label")) {
    if (n.classList.contains("nav-item")) n.classList.toggle("hidden-by-group", collapsed);
    n = n.nextElementSibling;
  }
}
function initNavGroups() {
  document.querySelectorAll(".nav-group-label").forEach((lbl) => {
    const g = lbl.dataset.group;
    applyNavGroup(g, loadStore("navgroup-" + g, "0") === "1");
    lbl.addEventListener("click", () => {
      const cur = loadStore("navgroup-" + g, "0") === "1";
      saveStore("navgroup-" + g, cur ? "0" : "1");
      applyNavGroup(g, !cur);
    });
  });
}

  const el = $("overview-body");

  const uncovered = agents.filter((a) => a.install_state === "none").length;
  const endpoints = (mcp.endpoints || []);
  // 「探活」= 端点 probe 成功（initialize + tools-list 均通过），而非「全合规」。
  // result_ok() 是审计结论（还要求每个客户端 hooks 全配齐），与「探活」是不同语义，

  const probeOk = endpoints.filter((e) => {

    card(installed, "已安装", "", true) +
    card(configOnly, "仅发现配置", "warn", false) +
    card(uncovered, "未安装", "err", false) +
    card(skills.skill_count || 0, "统一技能", "", false) +
    card(`${probeOk}/${endpoints.length}`, "MCP 探活正常", probeOk === endpoints.length && endpoints.length ? "ok" : "warn", false) +
    card(`${registered}/${mainstream.length}`, "主流已纳入", "", false) +

    '<div class="quickbox"><span class="quickbox-label">快捷操作</span>' +
    '<button class="btn-soft" data-action="add-agent">添加 IDE / API</button>' +

function homeView() { return loadStore("home-agent-view", "cards"); }
function setHomeView(v) { saveStore("home-agent-view", v); }

    // 主页卡片视图：按分类分组（与设置页同序同配色、组标题可折叠）
function renderHomeCardsView(q) {
  const agents = (SNAP && SNAP.agents) || [];
  let list = agents.filter((a) => a.install_state !== "none");
  const _hOrder = ["AI Agent", "AI IDE", "IDE Plugin", "其他"];
  list.sort((a, b) => {
    const ka = a.type && _hOrder.indexOf(a.type) !== -1 ? a.type : "其他";
    const kb = b.type && _hOrder.indexOf(b.type) !== -1 ? b.type : "其他";
    const d = _hOrder.indexOf(ka) - _hOrder.indexOf(kb);
    if (d !== 0) return d;
    return (a.name || "").localeCompare(b.name || "");
  });
  if (q) list = list.filter((a) =>
    [a.name, a.type, ...(a.app_paths||[]), ...(a.cli_paths||[]), ...(a.config_paths||[])]
      .join(" ").toLowerCase().includes(q));
  if (homeType() !== "all") list = list.filter((a) => (a.type || "其他") === homeType());
  const body = $("agent-home-body");

  const evRow = (kind, arr, versions) => {
    const paths = arr && arr.length ? arr : [];
    const vers = versions || [];
    const label = { app: "APP", cli: "CLI", config: "CONFIG" }[kind] || kind.toUpperCase();
    const dk = kind === "config" ? "cfg" : kind;
    const rowCls = paths.length ? "" : " is-empty";
    let content;
    if (!paths.length) {
      content = `<span class="ac-path-none">未检测到</span>`;

      const all = paths.join(", ");

      const verBadge = (i) => (vers[i] ? `<span class="ac-path-ver" title="版本">${escapeHtml(vers[i])}</span>` : "");
      const pathVal = (p) => `<span class="ac-path-val" title="${escapeHtml(all)}（点击复制）">${escapeHtml(p)}</span>`;
      const collapsed = `<div class="ac-path-collapsed"><div class="ac-path-item">${pathVal(paths[0])}<span class="ac-path-badges">${verBadge(0)}${multi ? `<button type="button" class="ac-path-more" data-toggle aria-label="展开全部路径">+${paths.length - 1}</button>` : ""}</span></div></div>`;
      const expanded = multi
        ? `<div class="ac-path-expanded">${paths.map((p, i) => `<div class="ac-path-item">${pathVal(p)}<span class="ac-path-badges">${verBadge(i)}</span></div>`).join("")}<button type="button" class="ac-path-collapse" data-toggle>收起</button></div>`
        : "";

    }
    return `<div class="ac-path-row${rowCls}"><span class="ac-path-label" data-k="${dk}">${label}</span>${content}</div>`;
  };

  const cardFor = (a, i) => {
    const isConfigOnly = a.install_state === "config_only";
    // --- Skills 行：目录 + 统一目录接入（颜色由实际接入数量驱动）---

    if (!a.installed) {

    } else {
      const sp = [];
      sp.push(a.skills_dir_found

      const linked = a.skills_enabled_count || 0;

      if (!a.skills_dir_found || total === 0) {
        sp.push('<span class="tag err" title="未接入统一仓库">未接入统一目录</span>');

        sp.push(`<span class="tag" title="未链接到统一仓库的独立技能">${total - linked} 独立</span>`);

    // --- MCP 行：端点数量/状态（颜色由已设置占比驱动）+ 每端点配置情况 ---
    const eps = (SNAP && SNAP.mcp && SNAP.mcp.endpoint_status) || {};
    // 从端点审计记录里取当前客户端的 record（record 名与 agent 名一致）
    const recordFor = (key, name) => {
      const s = eps[key];
      if (!s) return null;
      return (s.records || []).find((r) => r.name === name) || null;
    };
    const attachKeys = (a.mcp_config_path && a.mcp_attach && a.mcp_attach.length) ? a.mcp_attach : [];
    let mcpHtml;

    } else if (!attachKeys.length) {

      });
      mcpConfiguredCount = states.filter((s) => s.configured).length;
      mcpTotal = attachKeys.length;
      const total = mcpTotal;
      const configuredCount = mcpConfiguredCount;
      const modeTitle = a.has_explicit_attach ? "手动指定端点" : "自动挂载全部可用端点";
      let countTag;
      if (configuredCount === total) {
        countTag = `<span class="tag ok" title="${modeTitle}，全部端点已在设置中正确配置">${configuredCount}/${total} 端点已设置</span>`;

        countTag = `<span class="tag warn" title="${modeTitle}，部分端点已在设置中配置">${configuredCount}/${total} 端点已设置</span>`;
      } else {
        countTag = `<span class="tag err" title="${modeTitle}，端点未在设置中正确配置">${configuredCount}/${total} 端点已设置</span>`;
      }
      const keyTags = states.map(({ key, configured, rec }) => {

    const hay = [a.name, a.type, ...(a.app_paths||[]), ...(a.cli_paths||[]), ...(a.config_paths||[])].join(" ").toLowerCase();
    return `<article class="agent-card home-card" data-search="${escapeHtml(hay)}"

// 主页卡片：路径复制（kebab 菜单由全局委托 toggleAgentMenu 统一处理）
// 共享剪贴板复制：优先 async clipboard，失败回退 textarea+execCommand。
function copyTextToClipboard(text) {
  const done = (ok) => showBanner(ok ? "ok" : "err", ok ? `已复制：${text}` : "复制失败，请检查剪贴板权限");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); done(true);
      } catch (_) { done(false); }
    });
  } else done(false);
}

function bindHomeCardEvents() {
  const body = $("agent-home-body");
  body.querySelectorAll(".ac-path-val").forEach((p) => {
    p.addEventListener("click", () => copyTextToClipboard(p.textContent));

  body.querySelectorAll("[data-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest(".ac-path-row");
      if (row) row.classList.toggle("is-expanded");
    });
  });
}

// ---------------- Skills ----------------
function skillStateFor(skill, cs) {
  const on = [], off = [];
  cs.forEach((c) => {
    const st = (c.states || {})[skill];
    if (st === "enabled") on.push(c.name);
    else if (st === "disabled") off.push(c.name);
  });
  return { on, off };
}

// 技能分类：按目录名前缀确定性映射到大类（无分类字段，前缀是唯一可靠信号）。
// 未命中任何前缀的归入「通用」，不靠描述关键字硬猜。
const SKILL_CATEGORIES = [
  { re: /^(lark|feishu|wecom|wecomcli|weixin|tencent|ima|qw|tencent-docs)/, label: "办公协同" },
  { re: /^(grafana|prometheus|docker|k8s|kubernetes|safeline|trim-cli|verify-dns)/, label: "可观测运维" },
  { re: /^(apple|macos|findmy|imessage|imsg|homebrew|terminal)/, label: "macOS" },
  { re: /^(agent-browser|xbrowser|playwright|browser)/, label: "浏览器自动化" },
  { re: /^(api|code|codebase|codeql|code-intelligence|code-simplifier|python|maven|gradle|database|test-driven|systematic|sensteed|understand|subagent|executing-plans|writing-plans|finishing-a|receiving-code|requesting-code|claude-code|tdd)/, label: "开发代码" },
  { re: /^(email|imap|himalaya|agent-email)/, label: "邮件" },
  { re: /^(docx|pptx|xlsx|pdf|notion|aippt|ardot|doc-coauthoring|documentation)/, label: "文档办公" },
  { re: /^(frontend|design-taste|ui-ux|v0|figma|web-design|web-artifacts|vercel|prd)/, label: "前端设计" },
  { re: /^(memory|hermes|ai-memory|qclaw|llm-wiki|native-mcp|brainstorming|using-superpowers|find-skills|create-skill|plugin-|skill-vetter|skills-|graphify|writing-skills|skill-)/, label: "AI 记忆" },
];
function skillCategory(name) {
  const key = String(name || "").toLowerCase();
  const pfx = key.split(/[-_]/)[0];
  for (const c of SKILL_CATEGORIES) if (c.re.test(key)) return c.label;
  if (pfx.length) return "通用";
  return "通用";
}
// 提取「一句话用途」：去掉触发词尾巴与标题前缀，清洗 em-dash/en-dash 为 hyphen。
function skillUsage(desc) {
  if (!desc) return "";
  let s = String(desc).replace(/[—–]/g, "-");
  s = s.split(/当用户|当用户.*?时|Use\s+when|use\s+when|Triggers|Trigger|when\s+the\s+user|触发/)[0];
  s = s.trim();
  const idx = s.indexOf("-");
  if (idx > 0 && idx < 24) s = s.slice(idx + 1).trim();
  s = s.replace(/^[：:，,。.、\s]+/, "");
  if (s.length > 96) s = s.slice(0, 96).replace(/\s+\S*$/, "") + "…";
  return s;
}

// 从 SKILL.md 描述中提取「触发关键词」（引号/书名号内的短语）。仅用于详情页展示。
function skillTriggers(desc) {
  if (!desc) return [];
  const s = String(desc);
  // 只提取「当用户/触发/Trigger/Use when」等引导语之后的内容，避免误抓正文引号。
  const parts = s.split(/当用户|Trigger|Triggers|use\s+when|Use\s+when|触发/);
  if (parts.length < 2) return [];
  const tail = parts.slice(1).join(" ");
  const words = [];
  const re = /['"「『`]([^'"」』`]{1,24})['"」』`]/g;
  let m;
  while ((m = re.exec(tail)) && words.length < 8) {
    const w = m[1].trim();
    if (w && !words.includes(w)) words.push(w);
  }
  return words;
}

// 打开官网链接：桌面 App 走 open_url 命令，浏览器预览回退 window.open。
async function openExternal(url) {
  if (!url) return;
  if (tauriInvoke) {
    try { await tauriInvoke("open_url", { url }); return; }
    catch (err) { console.error("open_url error:", err); }

  window.open(url, "_blank", "noopener");
}

function renderSkillList() {
  const skills = (SNAP && SNAP.skills) || {};
  const list = skills.skills || [];
  const cs = skills.clients_states || [];
  const meta = skills.skill_meta || {};
  const nesting = skills.skill_nesting || {};
  const nestedMeta = skills.nested_meta || {};
  const clientNames = cs.map((c) => c.name);
  const total = clientNames.length;
  const lel = $("skills-list");
  const legendEl = $("skill-legend");
  if (legendEl) {
    const hasData = total > 0 && list.length > 0;
    legendEl.classList.toggle("hidden", !hasData);
    const note = legendEl.querySelector(".legend-note");
    if (note) {
      note.textContent = hasData
        ? `N / M = 已挂载该技能的客户端数 / 客户端总数（共 ${total} 个 IDE 与 Agent）`
        : "";
    }
  }
  const q = ($("skill-filter") && $("skill-filter").value || "").trim().toLowerCase();
  const seg = skillSeg();
  const cat = skillCat();

  const matchSeg = (s) => {
    const { on } = skillStateFor(s, cs);
    const enabled = on.length;
    if (seg === "on") return enabled === total && total > 0;
    if (seg === "partial") return enabled > 0 && enabled < total;
    if (seg === "off") return enabled === 0;
    return true;
  };
  const matchCat = (s) => cat === "all" || skillCategory(s) === cat;

  const shown = list.filter((s) => (!q || String(s).toLowerCase().includes(q)) && matchSeg(s) && matchCat(s));
  const fcount = $("skill-filter-count");
  if (fcount) fcount.textContent = q ? `匹配 ${shown.length} / ${list.length}` : `${shown.length} / ${list.length}`;

  // 渲染分类筛选 chips（数据变化时刷新计数）
  renderSkillCatChips(list);

  // 分页：筛选条件变化时回到第 1 页，否则若超出页数则收敛。
  const filterSig = `${q}|${seg}|${cat}`;
  if (_skillFilterSig !== undefined && _skillFilterSig !== filterSig) SKILL_PAGE = 1;
  _skillFilterSig = filterSig;
  const pageCount = Math.max(1, Math.ceil(shown.length / SKILL_PAGE_SIZE));
  if (skillPage() > pageCount) SKILL_PAGE = pageCount;
  const pageStart = (skillPage() - 1) * SKILL_PAGE_SIZE;
  const pageItems = shown.slice(pageStart, pageStart + SKILL_PAGE_SIZE);

  if (!shown.length) {
    lel.innerHTML = '<div class="empty">无匹配技能<div class="empty-cta"><button class="primary sm" data-action="merge">一键合并技能</button></div></div>';
    renderSkillPager(0, 0, 0);
    return;
  }

  // 官网链接（统一：蓝色域名 + 外链图标，放描述前面，可点击）。
  const homeLink = (r) => r.home
    ? `<button type="button" class="st-home-link" data-open-url="${escapeHtml(r.home)}" title="打开官网 ${escapeHtml(r.home)}">${ICONS.external}<span>${escapeHtml(r.homeHost || r.home)}</span></button>`
    : "";
  // 用途列内容：官网在前，描述在后；无官网时描述允许两行换行。
  const usageCell = (s, r) => {
    const desc = `<span class="st-usage-text">${escapeHtml(r.usage) || "（无描述）"}</span>`;
    return (r.home ? homeLink(r) + " " : "") + desc;
  };

  const renderRow = (s) => {
    const { on } = skillStateFor(s, cs);
    const enabled = on.length;
    const countCls = enabled === total && total ? "ok" : (enabled > 0 ? "warn" : "err");
    const md = meta[s] || {};
    const usage = skillUsage(md.description || "");
    const c = skillCategory(s);
    const home = (md.homepage || "").trim();
    const homeHost = (() => { try { return new URL(home).host.replace(/^www\./, ""); } catch (e) { return home; } })();
    const children = nesting[s] || [];
    return { s, enabled, total, countCls, usage, cat: c, home, homeHost, isContainer: children.length > 0, children };
  };

  // 子 skill 折叠内容：隶属头 + 子技能条目（只读，未纳入启用管理）
  const nestHtml = (s) => {
    const children = nesting[s] || [];
    const items = children.map((rel) => {
      const nm = nestedSkillName(rel);
      const nd = nestedMeta[rel] || {};
      const desc = skillUsage(nd.description || "");
      const fullDesc = (nd.description || "").trim();
      return `<div class="nest-item" title="${escapeHtml(rel)}">
        <span class="nest-item-name" title="${escapeHtml(nd.name || nm)}">${escapeHtml(nd.name || nm)}</span>
        <span class="nest-item-cat"></span>
        <span class="nest-item-desc" title="${escapeHtml(fullDesc)}">${escapeHtml(desc) || "（无描述）"}</span>
        <span class="nest-item-state"></span>
        <span class="nest-item-ops"></span>
      </div>`;
    }).join("");
    const hint = `<div class="nest-hint">嵌套内容的子技能，未纳入启用管理</div>`;
    return items + hint;
  };
  const nestToggle = (s) => `<button type="button" class="nest-toggle" data-toggle-nest="${escapeHtml(s)}" aria-label="展开子技能" aria-expanded="false">${ICONS.chev}</button>`;
  // 非容器行也用等宽占位，保证名称列与容器行严格对齐
  const nestSlot = '<span class="nest-toggle nest-slot" aria-hidden="true"></span>';
  const skillKebab = (s) => `<button type="button" class="kebab skill-kebab" data-skill="${escapeHtml(s)}" aria-label="技能操作">${ICONS.kebab}</button>`;
  const nestCountBadge = (n) => `<span class="nest-count" title="${n} 个子技能">${n}</span>`;

  if (skillView() === "list") {
    lel.className = "skill-list";
    lel.innerHTML = `<div class="table-scroll"><table class="skill-table">
        <thead><tr>
          <th class="st-name">名称</th>
          <th class="st-cat">分类</th>
          <th class="st-usage">用途</th>
          <th class="st-status">启用</th>
          <th class="st-ops">操作</th>
        </tr></thead>
        <tbody>` + pageItems.map((s) => {
      const r = renderRow(s);
      const nameCell = (r.isContainer ? nestToggle(s) : nestSlot)
        + `<span class="st-name-text" title="${escapeHtml(s)}">${escapeHtml(skillDisplayName(s))}</span>`
        + (r.isContainer ? nestCountBadge(r.children.length) : "");
      const nestRow = r.isContainer
        ? `<tr class="nest-tr" data-nest-of="${escapeHtml(s)}" hidden><td colspan="5"><div class="nest-list">${nestHtml(s)}</div></td></tr>`
        : "";
      return `<tr class="skill-row" data-skill="${escapeHtml(s)}" role="button" tabindex="0" title="查看详情">
        <td class="st-name"><div class="st-name-cell">${nameCell}</div></td>
        <td class="st-cat"><span class="sk-cat">${escapeHtml(r.cat)}</span></td>
        <td class="st-usage ${r.home ? "has-home" : "wrap"}" title="${escapeHtml((meta[s] && meta[s].description) || "")}">${usageCell(s, r)}</td>
        <td class="st-status"><span class="st-count ${r.countCls}" title="${r.enabled} / ${r.total} 个客户端已启用">${r.enabled}/${r.total} 启用</span></td>
        <td class="st-ops">${skillKebab(s)}</td>
      </tr>${nestRow}`;
    }).join("") + `</tbody></table></div>`;
  } else {
    lel.className = "skill-cards";
    lel.innerHTML = pageItems.map((s) => {
      const r = renderRow(s);
      const homeBtn = r.home
        ? `<button type="button" class="sk-home" data-open-url="${escapeHtml(r.home)}" title="打开官网 ${escapeHtml(r.home)}">${ICONS.external}<span>${escapeHtml(r.homeHost || r.home)}</span></button>`
        : "";
      const nameLine = `<span class="sk-name-text" title="${escapeHtml(s)}">${escapeHtml(skillDisplayName(s))}</span>` + (r.isContainer ? nestCountBadge(r.children.length) : "");
      return `<div class="skill-card" data-skill="${escapeHtml(s)}" role="button" tabindex="0" title="查看详情">
        <div class="sk-top"><span class="sk-cat">${escapeHtml(r.cat)}</span><span class="sk-top-right"><span class="sk-count ${r.countCls}" title="${r.enabled} / ${r.total} 个客户端已启用">${r.enabled}/${r.total} 启用</span>${skillKebab(s)}</span></div>
        <div class="sk-name">${nameLine}</div>
        ${homeBtn}
        <div class="sk-usage">${escapeHtml(r.usage) || "（无描述）"}</div>
      </div>`;
    }).join("");
  }
  renderSkillPager(shown.length, pageCount, skillPage());
}

function renderSkillPager(totalCount, pageCount, page) {
  const el = $("skill-pager");
  if (!el) return;
  if (pageCount <= 1) { el.innerHTML = ""; el.classList.add("hidden"); return; }
  const prevDisabled = page <= 1 ? "disabled" : "";
  const nextDisabled = page >= pageCount ? "disabled" : "";
  el.innerHTML = `<div class="skill-pager">
    <button type="button" class="pg-btn ${prevDisabled}" data-pg="prev" ${prevDisabled} aria-label="上一页"><span class="pg-arrow">‹</span> 上一页</button>
    <span class="pg-info">第 ${page} / ${pageCount} 页 · 共 ${totalCount} 个</span>
    <button type="button" class="pg-btn ${nextDisabled}" data-pg="next" ${nextDisabled} aria-label="下一页">下一页 <span class="pg-arrow">›</span></button>
  </div>`;
  el.classList.remove("hidden");
}

function renderSkillCatChips(list) {
  const el = $("skill-cat-chips");
  if (!el) return;
  const cats = deriveSkillCategories(list);
  const cur = skillCat();
  el.innerHTML = `<button type="button" class="cat-chip ${cur === "all" ? "active" : ""}" data-cat="all">全部<span class="cat-n">${list.length}</span></button>` +
    cats.map((c) => `<button type="button" class="cat-chip ${cur === c.value ? "active" : ""}" data-cat="${escapeHtml(c.value)}">${escapeHtml(c.label)}<span class="cat-n">${c.count}</span></button>`).join("");
  el.querySelectorAll("[data-cat]").forEach((b) => {
    b.addEventListener("click", () => {
      SKILL_CAT = b.dataset.cat; saveStore("skill-cat", SKILL_CAT);
      el.querySelectorAll("[data-cat]").forEach((x) => x.classList.toggle("active", x.dataset.cat === SKILL_CAT));
      renderSkillList();
    });
  });
}

function initSkillToolbar() {
  const seg = $("skill-seg");
  if (seg) {
    seg.querySelectorAll("[data-seg]").forEach((b) => {
      b.classList.toggle("active", b.dataset.seg === skillSeg());
      b.addEventListener("click", () => {
        SKILL_SEG = b.dataset.seg; saveStore("skill-seg", SKILL_SEG);
        seg.querySelectorAll("[data-seg]").forEach((x) => x.classList.toggle("active", x.dataset.seg === SKILL_SEG));
        renderSkillList();
      });
    });
  }
  const sc = document.querySelector(".view-toggle");
  if (sc) {
    sc.querySelectorAll("[data-view]").forEach((b) => {
      b.classList.toggle("active", b.dataset.view === skillView());
      b.addEventListener("click", () => {
        SKILL_VIEW = b.dataset.view; saveStore("skill-view", SKILL_VIEW);
        sc.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("active", x.dataset.view === SKILL_VIEW));
        renderSkillList();
      });
    });
  }
}

function showSkillDetail(skill) {
  const skills = (SNAP && SNAP.skills) || {};
  const cs = skills.clients_states || [];
  const meta = skills.skill_meta || {};
  const nesting = skills.skill_nesting || {};
  const d = meta[skill] || {};
  const desc = d.description || "（无描述）";
  const dispName = (d.name || "").trim() || skill;
  const srcPath = (skills.unified_dir || "无") + "/" + skill;
  const triggers = skillTriggers(d.description || "");
  const triggerChips = triggers.length
    ? `<div class="sh-triggers">${triggers.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>`
    : "";
  const homeLink = (d.homepage || "").trim()
    ? `<button type="button" class="sh-home" data-open-url="${escapeHtml(d.homepage)}">${ICONS.external}<span>${escapeHtml(d.homepage)}</span></button>`
    : "";
  const children = nesting[skill] || [];
  const nestHtml = children.length
    ? `<h4 class="sheet-section-title">子技能（${children.length}）</h4>
       <div class="sheet-nest">` + children.map((rel) => {
         const nm = nestedSkillName(rel);
         return `<div class="sheet-nest-item" title="${escapeHtml(rel)}"><span class="sn-name">${escapeHtml(nm)}</span><span class="sn-path">${escapeHtml(rel)}</span></div>`;
       }).join("") + `</div>`
    : "";
  const rows = cs.length
    ? cs.map((c) => {
        const st = (c.states || {})[skill];
        const isOn = st === "enabled";
        const label = st === "enabled" ? "已启用" : (st === "disabled" ? "已禁用" : "未挂载");
        const labelCls = st === "enabled" ? "ok-true" : (st === "disabled" ? "ok-false" : "ok-na");
        return `<div class="client-state-row" data-skill="${escapeHtml(skill)}" data-client="${escapeHtml(c.name)}">
          <span class="cr-name" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</span>
          <span class="cr-state" style="${st === "disabled" ? "color:var(--warn)" : ""}">${escapeHtml(label)}</span>
          <button type="button" class="switch" role="switch" aria-checked="${isOn ? "true" : "false"}" aria-label="切换 ${escapeHtml(skill)} 在 ${escapeHtml(c.name)} 的启用状态">
            <span class="sw-track"></span><span class="sw-knob"></span>
          </button>
        </div>`;
      }).join("")
    : '<div class="empty" style="margin:0">无客户端状态数据</div>';
  mountModal(`<div class="sheet-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="技能详情 ${escapeHtml(skill)}">
    <div class="sheet-head">
      <div class="sh-wrap"><h3>${escapeHtml(dispName)}</h3><div class="sh-mono mono">${escapeHtml(skill)}</div><div class="sh-desc">${escapeHtml(desc)}</div>${triggerChips}${homeLink}</div>
      <button class="sheet-close" id="sk-close" aria-label="关闭">${ICONS.cross}</button>
    </div>
    <div class="sheet-body">
      <div class="sheet-actions">
        <button type="button" class="btn-soft sm" data-action="skill-backup" data-skill="${escapeHtml(skill)}">${ICONS.box}<span>备份</span></button>
        <button type="button" class="btn-soft sm" data-action="skill-export" data-skill="${escapeHtml(skill)}">${ICONS.download}<span>导出</span></button>
        <button type="button" class="btn-soft sm" data-action="skill-rename" data-skill="${escapeHtml(skill)}">${ICONS.edit}<span>编辑名称</span></button>
        <button type="button" class="btn-soft sm danger" data-action="skill-delete" data-skill="${escapeHtml(skill)}">${ICONS.cross}<span>删除</span></button>
      </div>
      <div class="sheet-meta">
        <div class="row"><span class="k">源路径</span><span class="v mono" title="${escapeHtml(srcPath)}">${escapeHtml(srcPath)}</span></div>
      </div>
      ${nestHtml}
      <h4 class="sheet-section-title">每客户端启用状态</h4>
      <div id="sk-clients">${rows}</div>
    </div>
  </div></div>`);
  $("sk-close").onclick = closeModal;
  document.querySelectorAll("#sk-clients .switch").forEach((sw) => {
    sw.addEventListener("click", () => {
      const row = sw.closest(".client-state-row");
      if (!row) return;
      setSkillState(row.dataset.skill, row.dataset.client, sw.getAttribute("aria-checked") !== "true");
    });
  });
}

async function setSkillState(skill, client, enable) {
  if (!tauriInvoke) { showToast("warn", "浏览器预览模式：写入需在桌面 App 内执行"); return; }
  showToast("info", `${enable ? "启用" : "禁用"} ${skill} @ ${client}…`, { loading: true });
  const res = await runCli([enable ? "--enable-skill" : "--disable-skill", skill, "--client", client]);
  if (res && res.code === 0) {
    showToast("ok", `${enable ? "已启用" : "已禁用"} ${skill} @ ${client}`);
    await loadInternal(false);
    showSkillDetail(skill);
  } else {
    showToast("err", (res && res.stderr) || "操作失败");
  }
}

function skillDisplayName(skill) {
  const meta = (SNAP && SNAP.skills && SNAP.skills.skill_meta) || {};
  const nm = (meta[skill] && meta[skill].name || "").trim();
  return nm || skill;
}

async function backupSkill(skill) {
  if (!tauriInvoke) { showToast("warn", "浏览器预览模式：写入需在桌面 App 内执行"); return; }

  else showToast("err", cliErrDetail(res));
}

async function exportSkill(skill) {

  const res = await runCli(["--export-skill", skill]);

}

function openRenameSkillModal(skill) {
  const meta = (SNAP && SNAP.skills && SNAP.skills.skill_meta) || {};
  const d = meta[skill] || {};
  const curName = (d.name || "").trim() || skill;
  const curDesc = d.description || "";
  mountModal(`<div class="modal-backdrop"><div class="modal cfm-card">
    <div class="cfm-title">编辑 ${escapeHtml(skill)} 的名称与描述</div>
    <div class="cfm-msg" style="white-space:normal">仅改写 SKILL.md 里的显示名与用途描述，不动目录名与挂载。</div>
    <div class="form-field" style="margin-top:14px">
      <label class="ff-label" for="sk-rename-name">显示名</label>
      <input id="sk-rename-name" class="input" value="${escapeHtml(curName)}" placeholder="显示名">
    </div>
    <div class="form-field">
      <label class="ff-label" for="sk-rename-desc">用途描述</label>
      <textarea id="sk-rename-desc" class="input" rows="4" placeholder="一句话说明这个 skill 干什么">${escapeHtml(curDesc)}</textarea>
    </div>
    <div class="actions">
      <button class="cfm-btn-cancel" id="sk-rn-cancel">取消</button>
      <button class="cfm-btn-danger" id="sk-rn-ok" style="background:var(--accent);border-color:var(--accent)">保存</button>
    </div>
  </div></div>`);
  $("sk-rn-cancel").onclick = closeModal;
  $("sk-rn-ok").onclick = async () => {
    if (!tauriInvoke) { showToast("warn", "浏览器预览模式：写入需在桌面 App 内执行"); closeModal(); return; }
    const newName = $("sk-rename-name").value.trim();
    const newDesc = $("sk-rename-desc").value.trim();
    if (!newName && !newDesc) { showToast("warn", "名称与描述至少填一项"); return; }
    closeModal();
    showToast("info", `保存 ${skill} 元数据…`, { loading: true });
    const args = ["--rename-skill", skill];
    if (newName) args.push("--new-name", newName);
    if (newDesc) args.push("--new-description", newDesc);
    const res = await runCli(args);
    if (res && res.code === 0) {
      showToast("ok", `${skill} 元数据已保存`);
      await loadInternal(false);
      showSkillDetail(skill);
    } else showToast("err", cliErrDetail(res));
  };
}

async function confirmDeleteSkill(skill) {
  const ok = await confirmModal("删除技能", `将把 ${skill} 移到统一目录的 _trash/ 回收目录（删除前自动备份到 _backup/，可恢复）。确定继续？`, true);
  if (!ok) return;
  if (!tauriInvoke) { showToast("warn", "浏览器预览模式：写入需在桌面 App 内执行"); return; }
  await runTaskModal(`删除 ${skill}`, async () => {
    const res = await runCli(["--delete-skill", skill]);
    if (!res) return { ok: false, message: "工具未能执行", detail: "run_cli 无返回" };
    if (res.code === 0) return { ok: true, message: `${skill} 已移入 _trash/（备份在 _backup/）` };
    return { ok: false, message: "删除失败", detail: cliErrDetail(res) };
  }, () => loadInternal(false), ["备份到 _backup/", "移入 _trash/ 回收目录", "刷新技能清单"]);
}

}

// ---------------- MCP（业务视图） ----------------
function renderMcp() {
  const mcp = (SNAP && SNAP.mcp) || {};
  const endpoints = mcp.endpoints || [];
  $("count-mcp").textContent = endpoints.length;
  renderMcpClients(mcp, endpoints);
}

function renderMcpClients(mcp, endpoints) {
  const el = $("mcp-clients");
  if (!el) return;
  const clients = mcp.clients || [];
  if (!clients.length) { el.innerHTML = '<div class="empty">无客户端</div>'; return; }
  el.innerHTML = '<div class="table-scroll"><table><thead><tr><th>客户端</th><th>已配置 MCP 端点</th><th>MCP 条目（分类）</th></tr></thead><tbody>' +
    clients.map((c) => {
      const attach = (c.mcp_attach || []).map((k) => `<span class="tag ok">${escapeHtml(k)}</span>`).join(" ") || '<span class="ok-na">无</span>';
      const inv = (c.inventory || []).map((e) => {
        const cls = e.classification || "unmanaged";
        const label = CLASS_TRANSLATE[cls] || cls;
        const color = CLASS_COLOR[cls] || "";
        const risk = e.high_risk ? " ⚠" : "";
        const tip = e.high_risk ? (e.risk_reason || "疑似客户端自带") : (e.url || e.command || "");
        return `<button type="button" class="tag tag-btn ${color}" data-action="show-mcp-class" data-name="${escapeHtml(c.name)}" data-class="${escapeHtml(cls)}" title="${escapeHtml(tip)}">${escapeHtml(e.key)} · ${escapeHtml(label)}${risk}</button>`;
      }).join(" ") || '<span class="ok-na">无</span>';
      return `<tr><td>${escapeHtml(c.name)}</td><td>${attach}</td><td class="mono">${inv}</td></tr>`;
    }).join("") + "</tbody></table></div>";

  const epKeys = endpoints.map((e) => e.key);
  if (epKeys.length && clients.length) {
    el.innerHTML += '<h3 class="subhead">端点 × 客户端 覆盖矩阵</h3>' +
      '<div class="table-scroll"><table class="mcp-matrix"><thead><tr>' +

      epKeys.map((k) => `<th class="mono">${escapeHtml(k)}</th>`).join("") +
      '</tr></thead><tbody>' + clients.map((c) => {
        const att = new Set(c.mcp_attach || []);
        const invByEp = {};
        (c.inventory || []).forEach((e) => { if (e.endpoint_key) invByEp[e.endpoint_key] = e.classification; });
        const cells = epKeys.map((k) => {
          if (att.has(k)) return '<td><span class="ok-true">已配置</span></td>';

          return '<td><span class="ok-false">未配置</span></td>';
        }).join("");
        return `<tr><td class="mono mcp-matrix-client">${escapeHtml(c.name)}</td>${cells}</tr>`;
      }).join("") + "</tbody></table></div>";
  }
}

// 分页组件：页码数字（带省略）+ 上一页/下一页 + 跳转输入框
function _paginationBar(page, pages) {
  if (pages <= 1) return '<div class="pagination"></div>';
  const btns = [];
  btns.push(`<button class="ghost sm" data-sp="${page-1}" ${page===0?'disabled':''}>上一页</button>`);
  // 页码窗口：当前页前后各 2 个，两端保留，中间用省略号
  const win = 2;
  const nums = [];
  for (let i = 0; i < pages; i++) {
    if (i === 0 || i === pages - 1 || (i >= page - win && i <= page + win)) nums.push(i);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  nums.forEach((n) => {
    if (n === "…") btns.push('<span class="pg-ellipsis">…</span>');
    else btns.push(`<button class="ghost sm ${n===page?'current':''}" data-sp="${n}">${n+1}</button>`);
  });
  btns.push(`<button class="ghost sm" data-sp="${page+1}" ${page>=pages-1?'disabled':''}>下一页</button>`);
  btns.push(`<span class="pg-jump">跳至 <input type="number" class="pg-input" id="pg-jump-input" min="1" max="${pages}" value="${page+1}" aria-label="跳转页码" /> 页</span>`);
  return `<div class="pagination">${btns.join("")}</div>`;
}

function _paginatedTable(rows, page, perPage) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / perPage));
  if (page >= pages) page = pages - 1;
  if (page < 0) page = 0;
  const start = page * perPage;
  const slice = rows.slice(start, start + perPage);
  return { slice, pagination: _paginationBar(page, pages), total, pages };
}

const TYPE_COLORS = {
  "AI IDE": "#2563EB",
  "IDE Plugin": "#7C3AED",
  "AI Agent": "#059669",
};
function _typeColor(type) {
  for (const [k, v] of Object.entries(TYPE_COLORS)) if ((type||"").includes(k)) return v;
  return "var(--muted)";
}

// "#RRGGBB" / "#RGB" -> "rgba(r,g,b,alpha)"；非 hex 返回 null（回退到默认软色）。
function _hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== "#") return null;
  let h = hex.slice(1);
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  const n = parseInt(h, 16);
  if (Number.isNaN(n) || h.length !== 6) return null;
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

// 完整列出某类默认路径（不截断）；空数组显示占位（表示注册表未收录该默认项，而非检测本机）。
function _acPathVals(arr) {
  if (!arr || !arr.length) return '<span class="ac-path-none" title="注册表未收录该默认项">未收录</span>';
  return arr.map((p) => `<span class="ac-path-val" title="${escapeHtml(p)}（点击复制）">${escapeHtml(p)}</span>`).join("");
}

function _groupBy(list, fn) {
  const m = new Map();
  list.forEach(item => { const k = fn(item); if (!m.has(k)) m.set(k, []); m.get(k).push(item); });
  return [...m.entries()];
}

    const sections = grouped.map(([type, items]) => {
      const color = _typeColor(type);

        const cli = t.commands || [];

          <div class="ac-head">
            <span class="ac-name">${escapeHtml(t.name)}</span>
            <span class="ac-type">${escapeHtml(t.type || "Other")}</span>
          </div>
          <div class="ac-paths">
            <div class="ac-path-row"><span class="ac-path-label" data-k="app">APP</span><div class="ac-path-list">${_acPathVals(app)}</div></div>
            <div class="ac-path-row"><span class="ac-path-label" data-k="cli">CLI</span><div class="ac-path-list">${_acPathVals(cli)}</div></div>

        </tr>${rows}`;
    }).join("");

    body.innerHTML = `<div class="agent-list-wrap">
        <div class="agent-chips" id="agent-chips">${chips}</div>
        <div class="agent-list-count">共 ${list.length} 个 Agent/IDE（分 ${groupedList.length} 类）${q ? `，匹配「${escapeHtml(q)}」` : ""}</div>
        <div class="table-scroll"><table class="agent-list-table">
          <thead><tr><th>名称</th><th>类型</th><th>路径指标</th><th style="text-align:right">操作</th></tr></thead>
          <tbody>${groupRows || '<tr><td colspan="4" class="path-none">无匹配结果</td></tr>'}</tbody>
        </table></div>
      </div>`;

    bindChips();
    bindGroupCollapse();
    bindDetail();
  }

  function bindChips() {
    body.querySelectorAll("[data-type-filter]").forEach((b) => {
      b.addEventListener("click", () => {
        _agentsTypeFilter = b.dataset.typeFilter;
        saveStore("agent-type-filter", _agentsTypeFilter);
        renderAgentsTable(0);

  function bindGroupCollapse() {
    body.querySelectorAll("tr.al-group-head").forEach((g) => {
      g.addEventListener("click", () => {
        g.classList.toggle("collapsed");
        let sib = g.nextElementSibling;
        while (sib && sib.classList.contains("al-row")) {
          sib.classList.toggle("collapsed", g.classList.contains("collapsed"));
          sib = sib.nextElementSibling;
        }
      });
    });
  }

  function bindCopy() {
    body.querySelectorAll(".ac-path-val").forEach((p) => {
      p.addEventListener("click", () => {
        const text = p.textContent;
        const done = (ok) => showBanner(ok ? "ok" : "err", ok ? `已复制：${text}` : "复制失败，请检查剪贴板权限");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => done(true)).catch(() => {
            try {
              const ta = document.createElement("textarea");
              ta.value = text; document.body.appendChild(ta); ta.select();
              document.execCommand("copy"); document.body.removeChild(ta); done(true);
            } catch (_) { done(false); }
          });
        } else done(false);
      });
    });
  }

  function bindDetail() {
    body.querySelectorAll(".btn-agent-detail").forEach((b) => {
      b.addEventListener("click", () => openAgentSettings(b.dataset.name));
    });
  }
}

function openAgentSettings(name) {
  const tools = (SNAP && SNAP.mainstream_tools) || [];
  const t = tools.find((x) => x.name === name);
  if (!t) { showBanner("err", "未找到 Agent: " + name); return; }

  const appBundles = [...(t.app_bundles || [])];
  const commands = [...(t.commands || [])];
  const configPaths = [...(t.config_paths || [])];
  const skillsPath = (t.skills_paths || [])[0] || "";
  const mcpConfigPath = t.config_path || "";
  const scanDir = t.scan_dir || "";

  function renderPathFields(id, arr, placeholder) {
    return arr.map((v, i) => `<div class="path-field-row" data-idx="${i}">
      <input type="text" class="pf-${id}" value="${escapeHtml(v)}" placeholder="${placeholder}" />
      <button class="ghost sm pf-rm" data-idx="${i}">×</button>
    </div>`).join("") + `<button class="ghost sm pf-add" data-pf="${id}" data-placeholder="${placeholder}">+ 添加路径</button>`;
  }

  mountModal(`<div class="modal-backdrop"><div class="modal modal-form" style="width:min(640px,92vw)">
    <div class="form-title">${escapeHtml(name)} · 设置</div>
    <div class="form-sub">类型：${escapeHtml(t.type || "")}</div>

    <div class="agent-settings-section">
      <h4>App Bundle 路径</h4>
      <div id="as-app">${renderPathFields("app", appBundles, "/Applications/App.app")}</div>
    </div>

    <div class="agent-settings-section">
      <h4>CLI 命令</h4>
      <div id="as-cli">${renderPathFields("cli", commands, "command-name")}</div>
    </div>

    <div class="agent-settings-section">
      <h4>Config 路径</h4>
      <div id="as-cfg">${renderPathFields("cfg", configPaths, "~/.app/mcp.json")}</div>
    </div>

    <div class="agent-settings-section">
      <h4>目录设置</h4>
      <div class="form-field"><label>Skills 路径</label><input type="text" id="as-skills" value="${escapeHtml(skillsPath)}" placeholder="~/.app/skills" /></div>
      <div class="form-field"><label>MCP 配置文件</label><input type="text" id="as-mcp-cfg" value="${escapeHtml(mcpConfigPath)}" placeholder="~/.app/mcp.json" /></div>
      <div class="form-field"><label>默认扫描目录</label><input type="text" id="as-scan" value="${escapeHtml(scanDir)}" placeholder="~/.config/app/skills" /></div>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" id="as-cancel">取消</button>
      <button class="btn-save" id="as-save">保存</button>
    </div>
  </div></div>`);

  const bindPf = (pfId) => {
    const container = document.getElementById("as-" + pfId);
    if (!container) return;
    container.querySelectorAll(".pf-rm").forEach(btn => {
      btn.onclick = () => btn.closest(".path-field-row").remove();
    });
    container.querySelectorAll(".pf-add").forEach(btn => {
      btn.onclick = () => {
        const pf = btn.dataset.pf;
        const ph = btn.dataset.placeholder;
        const row = document.createElement("div");
        row.className = "path-field-row";
        row.innerHTML = `<input type="text" class="pf-${pf}" placeholder="${ph}" /><button class="ghost sm pf-rm">×</button>`;
        row.querySelector(".pf-rm").onclick = () => row.remove();
        btn.before(row);
      };
    });
  };
  bindPf("app");
  bindPf("cli");
  bindPf("cfg");

  $("as-cancel").onclick = closeModal;
  $("as-save").onclick = async () => {
    const collect = (pfId) => {
      const inputs = document.querySelectorAll(".pf-" + pfId);
      return Array.from(inputs).map(el => el.value.trim()).filter(Boolean);
    };
    const newApp = collect("app");
    const newCli = collect("cli");
    const newCfg = collect("cfg");
    const newSkills = $("as-skills").value.trim();
    const newMcpCfg = $("as-mcp-cfg").value.trim();
    const newScan = $("as-scan").value.trim();

    const args = ["--update-client", name];
    if (newApp.length) args.push("--app-bundles", newApp.join(","));
    if (newCli.length) args.push("--commands", newCli.join(","));
    if (newCfg.length) args.push("--config-paths", newCfg.join(","));
    if (newSkills) args.push("--skills-path", newSkills);
    if (newMcpCfg) args.push("--mcp-config-path", newMcpCfg);
    if (newScan) args.push("--scan-dir", newScan);

    const res = await runCli(args);
    closeModal();
    if (res && res.code === 0) { showBanner("ok", name + " 配置已更新"); loadInternal(); }
    else showBanner("err", (res && res.stderr) || "更新失败");
  };
}

let _settingsTab = "appearance";

  if (tabs) {

// ---------------- Tauri bridge ----------------
const tauriInvoke = window.__TAURI__ && (
  (window.__TAURI__.core && window.__TAURI__.core.invoke) || window.__TAURI__.invoke
);
async function runCli(args) {
  if (!tauriInvoke) { showBanner("warn", "当前为浏览器预览模式：写操作不会执行（需在桌面 App 中运行）。"); return null; }
  try {
    const res = await tauriInvoke("run_cli", { args });
    return JSON.parse(res);
  } catch (err) {
    console.error("runCli error:", err);
    return null;
  }
}

function showSkeleton() {
  const sk = (n) => Array.from({ length: n }, () => '<div class="card card-skeleton"><div class="sk-line" style="width:45%"></div><div class="sk-line" style="width:65%"></div><div class="sk-line"></div><div class="sk-line" style="width:80%"></div></div>').join("");
  $("agents-list").innerHTML = '<div class="cards">' + sk(6) + "</div>";
}

async function loadManagement() {
  if (!tauriInvoke) { render(SAMPLE_MGMT); return true; }
  showSkeleton();
  try {
    const mgmt = await runCli(["--management", "--format", "json"]);
    if (mgmt && mgmt.code === 0) {
      render(JSON.parse(mgmt.stdout));
      clearBanner();
      return true;
    }
    showBanner("err", "管理快照失败：" + (mgmt ? mgmt.stderr : "无法执行"));
    return false;
  } catch (err) {
    showBanner("err", "工具运行失败（非审计结论）：" + err);
    return false;
  }
}

function render(data) {
  SNAP = data;
  renderAll();
}

// ---------------- write actions ----------------
let LOADING = false;
async function doRescan(btnEl) {
  if (LOADING) return;
  LOADING = true;
  const btn = btnEl || $("nav-agents");
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "扫描中…"; }
  showToast("info", "正在重新扫描（含自动发现）…", { loading: true });
  try {
    await loadInternal(true);
    showToast("ok", "扫描完成");
  } catch (err) {
    showToast("err", "扫描失败：" + err);
  } finally {
    LOADING = false;
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}
function loadInternal(discover) {
  return (async () => {
    const args = ["--management", "--format", "json"];
    if (discover) args.push("--discover");
    const mgmt = await runCli(args);
    if (mgmt && mgmt.code === 0) { render(JSON.parse(mgmt.stdout)); clearBanner(); }
    else showBanner("err", (mgmt && mgmt.stderr) || "扫描失败");
  })();
}

// 刷新审计：按钮进入 loading 态 + 防重复点击，重新拉取管理快照
async function refreshWithBtn(btnEl) {
  if (LOADING) return;
  LOADING = true;
  const btn = btnEl;
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "刷新中…"; }
  showToast("info", "正在刷新审计…", { loading: true });
  let ok = false;
  try {
    ok = await loadManagement();
  } finally {
    LOADING = false;
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
  showToast(ok ? "ok" : "err", ok ? "刷新完成" : "刷新失败");
}

// ---------------- MCP 条目分类详情（旧通道 / 未纳管 / 已挂载） ----------------
function showMcpClass(name, cls) {
  const mcpCl = (SNAP && SNAP.mcp && SNAP.mcp.clients || []).find((c) => c.name === name);
  const inv = (mcpCl && mcpCl.inventory) || [];
  const items = inv.filter((e) => (e.classification || "unmanaged") === cls);
  const titleMap = { legacy: "旧通道（已失效）", unmanaged: "未纳管条目", attached: "已挂载端点" };
  const title = titleMap[cls] || "MCP 条目";
  const a = (SNAP && SNAP.agents || []).find((x) => x.name === name);
  const fixable = !!(a && a.fix_supported);
  const highCount = items.filter((e) => e.high_risk).length;

  const rows = items.map((e) => {
    const locType = e.url ? "URL" : (e.command ? "命令" : "");
    const locDetail = e.url ? escapeHtml(e.url) : (e.command ? escapeHtml(e.command) : "");
    const risk = e.high_risk
      ? `<span class="tag warn" title="${escapeHtml(e.risk_reason || "")}">疑似客户端自带</span>` : "";
    const del = fixable
      ? `<button class="ad-clean" type="button" data-action="remove-mcp-entry"
           data-name="${escapeHtml(name)}" data-key="${escapeHtml(e.key)}"
           data-high="${e.high_risk ? "1" : "0"}"
           data-reason="${escapeHtml(e.risk_reason || "")}">删除</button>`
      : "";
    return `<div class="ad-entry mcp-entry">
      <span class="ad-e-key">${escapeHtml(e.key)}</span>
      <span class="tag ${cls === "legacy" ? "warn" : ""}">${escapeHtml(CLASS_TRANSLATE[cls] || title)}</span>
      ${risk}
      <span class="ad-e-loc" title="${locDetail}">${locType ? `<span class="mcp-loc-type">${locType}</span> ${locDetail}` : `<span class="ad-none">无地址</span>`}</span>
      ${del}
    </div>`;
  }).join("");

  // 批量清理：默认跳过高风险条目，勾选后才纳入（checkbox 只在确有条目可勾时出现）
  const bulk = (fixable && items.length)
    ? `<div class="ad-cleanbar">
         <span class="ad-clean-note">共 ${items.length} 条${highCount ? `，其中 ${highCount} 条疑似客户端自带` : ""}</span>
         ${highCount ? `<label class="note" style="display:inline-flex;align-items:center;gap:6px">
           <input type="checkbox" id="mcpcls-include-high" />
           包含疑似客户端自带（${highCount}）
         </label>` : ""}
         <button class="ad-clean-btn" type="button" data-action="remove-mcp-class"
           data-name="${escapeHtml(name)}" data-class="${escapeHtml(cls)}">清理全部${escapeHtml(title)}</button>
       </div>`
    : "";

  const footNote = fixable
    ? "删除前会自动备份到 <配置文件名>.bak-<时间戳>；需要时可用「从备份恢复」还原（还原为整文件覆盖）。"
    : "该客户端不支持配置写入（fix_supported=false），因此不提供删除。";

  mountModal(`<div class="modal-backdrop"><div class="modal ad-modal">
    <div class="ad-head">
      <div class="ad-head-top"><span class="ad-type">${escapeHtml(name)}</span><span class="tag ${cls === "legacy" ? "warn" : ""}">${escapeHtml(title)}</span></div>
      <div class="ad-name">${escapeHtml(title)}</div>
    </div>
    <div class="ad-body">
      <div class="ad-section">
        <div class="ad-entries">${rows || '<div class="ad-none">无条目</div>'}</div>
        ${bulk}
      </div>
    </div>
    <div class="ad-foot">
      ${fixable ? `<button class="btn-soft" type="button" data-action="show-config-backups" data-name="${escapeHtml(name)}">从备份恢复</button>` : ""}
      <button class="btn-cancel close-push" id="mcpcls-close">关闭</button>
    </div>
    <div class="ad-foot-note">${escapeHtml(footNote)}</div>
  </div></div>`);
  $("mcpcls-close").onclick = closeModal;
}

          ${eps.length ? eps.map((e) => `<label class="attach-opt"><input type="checkbox" data-ep="${escapeHtml(e.key)}" /><span class="mono">${escapeHtml(e.key)}</span></label>`).join("")
            : '<span class="muted" style="font-size:var(--fs-xs)">（无可用端点）</span>'}
          <div style="margin-top:4px"><button type="button" class="ghost sm" data-attach-all>全选</button>
          <button type="button" class="ghost sm" data-attach-none>清空</button>
          <span class="muted" style="font-size:var(--fs-2xs)">留空 = 挂载全部端点</span></div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" id="ac-cancel">取消</button>
        <button id="ac-save" class="btn-save">添加</button>
      </div>
    </div>
  </div></div>`);

  $("mt-filter").addEventListener("input", (e) => {
    const qq = e.target.value;
    const all = (SNAP && SNAP.mainstream_tools) || [];
    const shown2 = qq.trim() ? all.filter((t) => (t.name || "").toLowerCase().includes(qq.trim().toLowerCase()) || (t.aliases || []).some((a) => String(a).toLowerCase().includes(qq.trim().toLowerCase()))) : all;
    $("mt-list").innerHTML = shown2.map(item).join("");
    bindMtHandlers();
  });

  bindMtHandlers();

  // 主流列表汇总 + 全选 / 清空（只作用于「已安装」的项；未安装项禁选）。
  function mtAddArgs(mt) {
    const args = ["--add-client", mt.name];
    if (mt.type) args.push("--client-type", mt.type);
    const skills = (mt.skills_paths || [])[0];
    if (skills) args.push("--client-skills-path", skills);
    if (mt.config_path) args.push("--client-config-path", mt.config_path);
    if (mt.format && mt.format !== "json") args.push("--client-mcp-format", mt.format);
    if (mt.mcp_key_path && mt.mcp_key_path.length && mt.mcp_key_path.join(",") !== "mcpServers") args.push("--client-mcp-key-path", mt.mcp_key_path.join(","));
    const apps = (mt.app_bundles || []).join(",");
    const cmds = (mt.commands || []).join(",");
    const cfgs = (mt.config_paths || []).join(",");
    if (apps) args.push("--client-app-bundle", apps);
    if (cmds) args.push("--client-command", cmds);
    if (cfgs) args.push("--client-config-paths", cfgs);
    return args;
  }
  function updateMtSum(list) {
    const p = list.filter((t) => present(t));
    const managed = p.filter((t) => t.registered).length;
    const installable = p.filter((t) => !t.registered).length;
    $("mt-sum").textContent = `已纳入 ${managed} · 未纳入 ${installable} · 未安装 ${list.length - p.length}`;
  }
  updateMtSum(tools);
  async function batchToggleMts(checked) {
    const boxes = Array.from(document.querySelectorAll(".mainstream-item input[type=checkbox]")).filter((cb) => !cb.disabled && cb.checked !== checked);
    if (!boxes.length) { showToast("info", checked ? "没有可纳入的已安装客户端" : "没有已勾选的项目"); return; }
    let ok = 0, fail = 0;
    for (const cb of boxes) {
      const name = cb.dataset.name;
      const mt = tools.find((t) => t.name === name) || {};
      const args = checked ? mtAddArgs(mt) : ["--remove-client", name];
      const res = await runCli(args);
      if (res && res.code === 0) {
        ok++;
        cb.checked = checked;
        cb.parentElement.classList.toggle("on", checked);
        const lbl = cb.parentElement.querySelector(".chk-label");
        if (lbl) { lbl.textContent = checked ? "已纳入" : "未纳入"; lbl.className = "chk-label" + (checked ? "" : " off"); }
      } else fail++;
    }
    showToast(fail ? "warn" : "ok", checked ? `已纳入 ${ok} 个${fail ? `，失败 ${fail} 个` : ""}` : `已移出 ${ok} 个${fail ? `，失败 ${fail} 个` : ""}`);
    await loadInternal();
    updateMtSum((SNAP && SNAP.mainstream_tools) || []);
  }
  $("mt-all").onclick = () => batchToggleMts(true);
  $("mt-none").onclick = () => batchToggleMts(false);

  const moreBtn = $("mt-more");
  if (moreBtn) moreBtn.addEventListener("click", () => {
    MT_EXPANDED = true;
    $("mt-list").innerHTML = renderMtList(tools, true);
    bindMtHandlers();
  });

  function bindMtHandlers() {
    document.querySelectorAll(".mainstream-item input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const name = cb.dataset.name;
        const willRegister = cb.checked;
        cb.disabled = true;
        const mt = tools.find((t) => t.name === name) || {};
        const args = willRegister ? mtAddArgs(mt) : ["--remove-client", name];
        const res = await runCli(args);
        if (res && res.code === 0) {
          cb.parentElement.classList.toggle("on", willRegister);
          const lbl = cb.parentElement.querySelector(".chk-label");
          if (lbl) { lbl.textContent = willRegister ? "已纳入" : "未纳入"; lbl.className = "chk-label" + (willRegister ? "" : " off"); }
          showToast("ok", willRegister ? `${name} 已纳入管理` : `${name} 已移出管理`);
          await loadInternal();
          updateMtSum((SNAP && SNAP.mainstream_tools) || []);
        } else {
          showToast("err", (res && res.stderr) || "操作失败");
          cb.disabled = false;
          cb.checked = !willRegister;
        }
      });
    });
    document.querySelectorAll(".btn-mt-settings").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        const mt = tools.find((t) => t.name === name) || {};
        const existing = document.getElementById("mt-editor-" + name.replace(/[^a-zA-Z0-9_-]/g, "_"));
        if (existing) { existing.remove(); return; }
        const row = btn.closest(".mainstream-item");
        const editor = document.createElement("div");
        editor.className = "mt-editor";
        editor.id = "mt-editor-" + name.replace(/[^a-zA-Z0-9_-]/g, "_");
        const apps = (mt.app_bundles || []).join(", ");
        const cmds = (mt.commands || []).join(", ");
        const cfgs = (mt.config_paths || []).join(", ");
        const skills = (mt.skills_paths || []).join(", ");
        editor.innerHTML = `<div class="row"><span class="k">App Bundle</span><input type="text" data-f="app" value="${escapeHtml(apps)}" placeholder="/Applications/App.app" style="flex:1" /></div>
          <div class="row"><span class="k">CLI 命令</span><input type="text" data-f="cli" value="${escapeHtml(cmds)}" placeholder="cli" style="flex:1" /></div>
          <div class="row"><span class="k">Config 路径</span><input type="text" data-f="cfg" value="${escapeHtml(cfgs)}" placeholder="~/.x/mcp.json" style="flex:1" /></div>
          <div class="row"><span class="k">skills 目录</span><input type="text" data-f="skills" value="${escapeHtml(skills)}" placeholder="~/.x/skills" style="flex:1" /></div>
          <div class="row"><span class="k">MCP 配置路径</span><input type="text" data-f="mcpcfg" value="${escapeHtml(mt.config_path || "")}" placeholder="~/.x/mcp.json" style="flex:1" /></div>
          <div class="actions" style="margin-top:8px">
            <button class="ghost" data-role="cancel">取消</button>
            <button class="primary" data-role="save">保存并纳入</button>
          </div>`;
        row.insertAdjacentElement("afterend", editor);
        editor.querySelector('[data-role="cancel"]').onclick = () => editor.remove();
        editor.querySelector('[data-role="save"]').onclick = async () => {
          const v = (f) => editor.querySelector(`[data-f="${f}"]`).value.trim();
          const args = ["--add-client", name];
          if (mt.type) args.push("--client-type", mt.type);
          const sk = v("skills"); if (sk) args.push("--client-skills-path", sk);
          const mcfg = v("mcpcfg"); if (mcfg) args.push("--client-config-path", mcfg);
          if (mt.format && mt.format !== "json") args.push("--client-mcp-format", mt.format);
          const app = v("app"); if (app) args.push("--client-app-bundle", app);
          const cli = v("cli"); if (cli) args.push("--client-command", cli);
          const cfg = v("cfg"); if (cfg) args.push("--client-config-paths", cfg);
          const res = await runCli(args);
          if (res && res.code === 0) { showBanner("ok", `${name} 设置已保存并纳入`); closeModal(); loadInternal(); }
          else showBanner("err", (res && res.stderr) || "保存失败");
        };
      });
    });
  }

  $("ac-cancel").onclick = closeModal;
  // 挂载端点：全选 / 清空快捷操作
  $("ac-attach").querySelectorAll("[data-attach-all], [data-attach-none]").forEach((b) => {
    b.addEventListener("click", () => {
      const want = b.dataset.attachAll !== undefined ? true : false;
      $("ac-attach").querySelectorAll("input[data-ep]").forEach((c) => { c.checked = want; });
    });
  });
  $("ac-save").onclick = async () => {
    const name = $("ac-name").value.trim();
    if (!name) { $("ac-name").focus(); showToast("err", "请填写名称（必填）"); return; }
    const btn = $("ac-save");
    btn.disabled = true;
    btn.textContent = "添加中…";
    const path = $("ac-path").value.trim();
    const type = $("ac-type").value;
    const cfg = $("ac-cfg").value.trim();
    const fmt = $("ac-fmt").value;
    const key = $("ac-key").value;
    const attach = Array.from($("ac-attach").querySelectorAll("input[data-ep]:checked")).map((c) => c.dataset.ep).join(",");
    const app = $("ac-app").value.trim();
    const cli = $("ac-cli").value.trim();
    const configs = $("ac-configs").value.trim();
    const args = ["--add-client", name];
    if (path) args.push("--client-skills-path", path);
    if (type) args.push("--client-type", type);
    if (cfg) args.push("--client-config-path", cfg);
    if (fmt && fmt !== "json") args.push("--client-mcp-format", fmt);
    if (key && key !== "mcpServers") args.push("--client-mcp-key-path", key);
    if (attach) args.push("--client-mcp-attach", attach);
    if (app) args.push("--client-app-bundle", app);
    if (cli) args.push("--client-command", cli);
    if (configs) args.push("--client-config-paths", configs);
    const res = await runCli(args);
    if (res && res.code === 0) {
      closeModal();
      showToast("ok", `已添加客户端「${name}」`);
      loadInternal();
    } else {
      btn.disabled = false;
      btn.textContent = "添加";
      showToast("err", (res && res.stderr) || "添加失败");
    }
  };
}
