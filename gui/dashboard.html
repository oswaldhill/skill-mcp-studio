<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FAFAFA" />
<title>Skill MCP Studio 管理台</title>
<style>
  /* ============ 自托管字体（OFL，离线可用） ============
     UI 正文 = 系统栈（SF Pro Text / PingFang SC，对齐 skills-manager 参考设计）
     IBM Plex Mono = 路径 / ID / 小数据（mono） */
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/fonts/ibmplexmono-latin-400.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/fonts/ibmplexmono-latin-500.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/fonts/ibmplexmono-latin-600.woff2') format('woff2'); }

  /* ============ tokens（浅色优先，参考 xingkongliang/skills-manager） ============
     Zinc 中性色阶 + Emerald 交互色；accent 只用于焦点/链接/激活/主按钮，
     ok/warn/err 只表达语义状态。暗色经 html.dark 覆盖（Light/Dark/System）。 */
  :root {
    /* surfaces */
    --bg: #FAFAFA;
    --bg-elev: #F4F4F5;
    --panel: #FFFFFF;
    --panel-2: #F4F4F5;
    --line: #E4E4E7;
    --line-strong: #D4D4D8;

    /* text 3-level */
    --text: #18181B;
    --muted: #52525B;
    --faint: #8B8B94;

    /* interaction accent（品牌蓝，即 Skill/MCP Studio 自有身份，非参照色） */
    --accent: #2563EB;
    --accent-strong: #1D4ED8;
    --on-accent: #FFFFFF;
    --accent-bg: rgba(37,99,235,.08);
    --accent-border: rgba(37,99,235,.28);

    /* status (semantic only) */
    --ok: #047857;
    --warn: #B45309;
    --err: #DC2626;
    --ok-bg: rgba(5,150,105,.08);
    --warn-bg: rgba(180,83,9,.07);
    --err-bg: rgba(220,38,38,.07);
    --ok-border: rgba(5,150,105,.25);
    --warn-border: rgba(180,83,9,.25);
    --err-border: rgba(220,38,38,.25);

    /* elevation（参考：极轻卡片阴影） */
    --shadow-card: 0 1px 2px rgba(24,24,27,.04);
    --shadow-card-hover: 0 4px 12px rgba(24,24,27,.07);
    --shadow-modal: 0 24px 64px -16px rgba(24,24,27,.28);
    --backdrop: rgba(24,24,27,.45);

    /* type scale */
    --fs-2xs: 11px;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-base: 14px;
    --fs-md: 16px;
    --fs-lg: 22px;
    --fs-xl: 30px;

    /* radius tiers: control / card / pill */
    --r-control: 8px;
    --r-card: 12px;
    --r-pill: 999px;

    --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    --display: var(--sans);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  html.dark {
    --bg: #0C0C0F;
    --bg-elev: #0F0F13;
    --panel: #131317;
    --panel-2: #17171E;
    --line: #1C1C22;
    --line-strong: #26262E;

    --text: #F4F4F5;
    --muted: #A1A1AA;
    --faint: #71717A;

    --accent: #60A5FA;
    --accent-strong: #3B82F6;
    --on-accent: #0A1220;
    --accent-bg: rgba(96,165,250,.12);
    --accent-border: rgba(96,165,250,.30);

    --ok: #34D399;
    --warn: #FBBF24;
    --err: #F87171;
    --ok-bg: rgba(16,185,129,.08);
    --warn-bg: rgba(251,191,36,.07);
    --err-bg: rgba(248,113,113,.07);
    --ok-border: rgba(16,185,129,.25);
    --warn-border: rgba(251,191,36,.25);
    --err-border: rgba(248,113,113,.25);

    --shadow-card: 0 1px 2px rgba(0,0,0,.3);
    --shadow-card-hover: 0 4px 14px rgba(0,0,0,.45);
    --shadow-modal: 0 24px 64px -16px rgba(0,0,0,.7);
    --backdrop: rgba(0,0,0,.6);
  }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: var(--fs-base)/1.6 var(--sans);
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .hidden { display: none !important; }

  /* ============ z-index 尺度（全页仅允许以下层级，勿新增散值）============
     1   shell/main 内容层
     50  弹层遮罩（modal/sheet backdrop）
     51  抽屉 sheet 本体
     60  命令面板 palette / 溢出菜单 pop-menu
     70  底部 toast 栈 */
  /* ============ shell ============ */
  .shell { position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }
  aside {
    background: var(--bg-elev); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--accent-strong), var(--accent));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-card); }
  .brand-mark svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .brand-name { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: -.01em; line-height: 1.15; color: var(--text); }
  .brand-sub { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .16em; margin-top: 3px; }

  .nav { flex: 1; padding: 6px 0; display: flex; flex-direction: column; }
  .nav-group-label { padding: 16px 20px 6px; font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .nav-group-label.push { margin-top: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; height: 36px; margin: 1px 10px; padding: 0 10px; cursor: pointer;
    border: none; background: none; color: var(--muted); text-align: left; font-size: var(--fs-sm); font-weight: 500;
    border-radius: var(--r-control); white-space: nowrap;
    transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-card); font-weight: 600; }
  .nav-item .nv-ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; opacity: .75; }
  .nav-item.active .nv-ico { opacity: 1; stroke: var(--accent); }
  .nav-item .count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); background: rgba(113,113,122,.12); padding: 0 8px; border-radius: var(--r-pill); }
  .nav-item.active .count { color: var(--accent); background: var(--accent-bg); }
  aside .foot { padding: 14px 22px; color: var(--faint); font-size: var(--fs-2xs); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .foot-row { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }

  /* ============ layout primitives ============ */
  main { position: relative; z-index: 1; padding: 24px 28px 64px; min-width: 0; overflow-y: auto; }
  main > * { max-width: 1200px; margin-left: auto; margin-right: auto; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px;
  }
  .page-head .hd { min-width: 0; }
  .page-head h2 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
  .page-head .hint { color: var(--muted); font-size: var(--fs-sm); margin-top: 4px; max-width: 60ch; }
  .page-actions { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; align-self: flex-start; }
  .subhead { font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .subline { color: var(--muted); font-size: var(--fs-xs); margin: 2px 0 12px; }
  .hint { color: var(--muted); font-size: var(--fs-sm); }
  .note { color: var(--muted); font-size: var(--fs-xs); }
  .nav-link { color: var(--accent); cursor: pointer; text-decoration: none; }
  .nav-link:hover { text-decoration: underline; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ============ controls ============ */
  button, input, select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-control); padding: 7px 12px; font-size: var(--fs-sm); font-family: var(--sans);
  }
  button { cursor: pointer; transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease); white-space: nowrap; font-weight: 500; box-shadow: var(--shadow-card); }
  button:hover { border-color: var(--line-strong); background: var(--panel-2); }
  button.primary { background: var(--accent); border-color: var(--accent-border); color: var(--on-accent); font-weight: 600; box-shadow: var(--shadow-card); }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-border); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
  button.ghost:hover { background: var(--panel-2); color: var(--text); }
  button.danger { background: var(--err-bg); border-color: var(--err-border); color: var(--err); }
  button.danger:hover { background: var(--err-bg); border-color: var(--err); }
  button.sm { padding: 3px 10px; font-size: var(--fs-2xs); height: 26px; }
  /* 次级动作按钮：介于 ghost（纯文字）与默认卡面按钮之间，给页面级动作入口可见的边界 */
  button.btn-soft { background: var(--panel-2); border-color: var(--line-strong); color: var(--text); box-shadow: none; }
  button.btn-soft:hover { background: var(--panel); border-color: var(--line-strong); color: var(--text); }
  button:disabled { opacity: .55; cursor: progress; }
  /* 触觉反馈：按压时轻微下沉，模拟物理按键（transform/opacity 仅触发合成层） */
  button:active:not(:disabled) { transform: translateY(1px) scale(.985); }
  .seg-btn:active, .pal-item:active, .pm-item:active, .switch:active { transform: scale(.94); }
  .skill-card:active, .skill-row:active, .card:active { transform: scale(.985); }
  input[type="text"], input[type="url"] { flex: 1; min-width: 160px; box-shadow: var(--shadow-card); }
  input::placeholder { color: var(--faint); }
  input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 分段控件（参考 skills-manager：布尔/枚举选择用 segmented，不用下拉） */
  .segmented { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elev); }
  .seg-btn { border: none; background: transparent; color: var(--muted); border-radius: 7px; padding: 4px 14px; font-size: var(--fs-sm); font-weight: 500; box-shadow: none; }
  .seg-btn:hover { background: transparent; color: var(--text); }
  .seg-btn.active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow-card); }

  /* ============ banner ============ */
  .banner { border-radius: var(--r-card); padding: 10px 14px; margin: 0 0 14px; font-size: var(--fs-sm); }
  .banner.err { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err); }
  .banner.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); }

  /* ============ stat / quick ============ */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; box-shadow: var(--shadow-card); }
  .stat-card .num { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat-card .num.ok { color: var(--ok); }
  .stat-card .num.warn { color: var(--warn); }
  .stat-card .num.err { color: var(--err); }
  .stat-card.accent .num { color: var(--accent); }
  .stat-card .lbl { color: var(--muted); font-size: var(--fs-xs); margin-top: 5px; }
  .quickbox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r-card); }
  .quickbox-label { color: var(--faint); font-size: var(--fs-xs); margin-right: 2px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .kpi-num { font-family: var(--display); font-weight: 600; font-size: var(--fs-md); font-variant-numeric: tabular-nums; }

  /* ============ cards / rows ============ */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; box-shadow: var(--shadow-card); transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card-hover); }
  .card .title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .card .type { color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
  .card .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; font-size: var(--fs-sm); }
  .card .rows .row .k { flex: 0 0 74px; }
  .card.card-dim { opacity: .62; }
  .card.card-dim .title { color: var(--muted); }
  .card.card-confirm { border-color: var(--warn-border); background: var(--warn-bg); }
  .card.card-confirm .title { color: var(--warn); }

  .row { display: flex; align-items: center; gap: 8px; }
  .row .k { color: var(--muted); flex: 0 0 96px; }
  .row .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row.row-block { align-items: flex-start; }
  .row.row-block .k { padding-top: 2px; }
  .row.row-block .v { white-space: normal; overflow: visible; text-overflow: clip; }
  .pill-list { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ============ status bits ============ */
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--err-bg); }
  .dot.faint { background: transparent; box-shadow: inset 0 0 0 2px var(--line-strong); }
  .ok-true { color: var(--ok); }
  .ok-false { color: var(--err); }
  .ok-na { color: var(--faint); }

  .tag { display: inline-block; font-size: var(--fs-2xs); border-radius: var(--r-pill); padding: 1px 9px; border: 1px solid var(--line); color: var(--muted); background: rgba(113,113,122,.07); font-family: var(--mono); font-weight: 500; letter-spacing: .02em; }
  .tag.ok { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .tag.warn { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  .tag.err { color: var(--err); border-color: var(--err-border); background: var(--err-bg); }
  .tag.info { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
  .tag-blue { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
  .tag-btn { cursor: pointer; transition: border-color .14s var(--ease), background .14s var(--ease), transform .1s var(--ease); }
  .tag-btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .tag-btn:active { transform: scale(.96); }
  /* 主页卡片（home-card）:设置页 agent-card 同构，但带业务 meta 区与「有/无」状态 */
  .agent-card.home-card .ac-paths { padding-bottom: 4px; }
  .agent-card.home-card.card-dim { opacity: .62; }
  .agent-card.home-card.card-dim .ac-name { color: var(--muted); }
  
  .agent-card .ac-meta { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--line); margin-top: 2px; font-size: var(--fs-sm); }
  .agent-card .ac-meta-row { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .agent-card .ac-meta-row .k { flex: none; width: 74px; color: var(--muted); padding-top: 1px; border-right: 1px solid var(--line); margin-right: 2px; }
  .agent-card .ac-meta-row .v { min-width: 0; flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  /* 卡片底部直接可见的修复动作条：按需出现，带蓝色可点边界 */
  .agent-card .ac-fixbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); margin-top: 2px; }
  .agent-card .ac-fixbar .ac-fix {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--accent-border); background: var(--accent-bg); color: var(--accent);
    border-radius: var(--r-pill); padding: 3px 12px; height: 26px;
    font-size: var(--fs-2xs); font-family: var(--mono); font-weight: 600; letter-spacing: .01em;
    cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .agent-card .ac-fixbar .ac-fix:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .agent-card .ac-fixbar .ac-fix:active { transform: translateY(1px) scale(.985); }
  .agent-card .ac-fixbar .ac-fix svg { width: 12px; height: 12px; }
  .agent-card .ac-fixbar .ac-fix.danger { border-color: var(--err-border); background: var(--err-bg); color: var(--err); }
  .agent-card .ac-fixbar .ac-fix.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
  /* 主页列表视图：详情链接 */
  .al-ops { display: flex; justify-content: flex-end; align-items: center; gap: 6px; white-space: nowrap; }
  .al-detail {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; flex: none;
    padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel); color: var(--accent); box-shadow: none;
    font-size: var(--fs-xs); font-weight: 500; font-family: inherit; cursor: pointer;
    transition: background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease), transform .1s var(--ease);
  }
  .al-detail:hover { background: var(--accent-bg); border-color: var(--accent-border); }
  .al-detail:active { transform: scale(.96); }
  .al-detail svg { width: 14px; height: 14px; }
  .al-ops .kebab { margin-left: 0; flex: none; }
  .agent-list-table td .dot { margin-right: 6px; vertical-align: -1px; }

  /* ============ table ============ */
  .table-scroll { overflow-x: auto; border-radius: var(--r-card); border: 1px solid var(--line); background: var(--panel); margin-top: 12px; box-shadow: var(--shadow-card); }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { background: var(--panel); color: var(--faint); font-weight: 600; position: sticky; top: 0; font-family: var(--sans); font-size: var(--fs-2xs); letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: var(--bg-elev); }
  tbody tr:last-child td { border-bottom: none; }
  /* 覆盖矩阵：固定布局 + 端点列居中，与表头严格对齐 */
  .mcp-matrix { table-layout: fixed; }
  .mcp-matrix .mcp-matrix-client { width: 220px; text-align: left; }
  .mcp-matrix thead th:not(.mcp-matrix-client) { text-align: center; }
  .mcp-matrix td { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 一键合并预览：分节标题 + 对比表格 */
  .merge-sec-title { margin: 20px 0 8px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .merge-sec-n { font-weight: 500; color: var(--faint); text-transform: none; letter-spacing: 0; font-size: var(--fs-xs); font-family: var(--mono); }
  .merge-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .merge-table th { text-align: left; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: 7px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .merge-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .merge-table tbody tr:last-child td { border-bottom: none; }
  .merge-changes { display: flex; flex-direction: column; gap: 12px; }
  .merge-changes .merge-table { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .merge-legend { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 0; }
  .merge-legend .skill-legend { margin-bottom: 0; }
  .merge-changes-fold { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--panel); }
  .merge-changes-fold > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px;
    margin: 0 !important; padding: 10px 14px;
    font-size: var(--fs-xs); font-weight: 600; color: var(--muted);
  }
  .merge-changes-fold > summary::-webkit-details-marker { display: none; }
  .merge-changes-fold > summary .fold-caret { display: inline-block; transition: transform .18s var(--ease); color: var(--faint); }
  .merge-changes-fold[open] > summary .fold-caret { transform: rotate(90deg); }
  .merge-changes-fold .merge-changes { padding: 0 14px 14px; }
  .muted { color: var(--muted); }
  .path-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrap-cell { white-space: normal !important; line-height: 1.6; }
  .empty-cell { text-align: center; color: var(--faint); padding: 18px 10px !important; }
  .btn-save:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }

  /* 自定义添加：挂载端点多选 + select 高度统一 */
  .attach-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .attach-opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-pill); padding: 4px 10px; cursor: pointer; font-size: var(--fs-xs); transition: border-color .14s var(--ease), background .14s var(--ease); }
  .attach-opt:hover { border-color: var(--accent-border); }
  .attach-opt input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  .attach-opt:has(input:checked) { border-color: var(--accent-border); background: var(--accent-bg); }
  .modal-form .row select { height: 34px; }
  .mono { font-family: var(--mono); font-size: var(--fs-xs); }

  /* ============ skill cards ============ */
  .skill-search { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .skill-search input { flex: 1; min-width: 200px; }
  .skill-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: stretch; }
  .skill-pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .skill-pager .pg-info { color: var(--faint); font-family: var(--mono); font-size: var(--fs-xs); }
  .skill-pager .pg-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); box-shadow: none; color: var(--muted); font-size: var(--fs-xs); padding: 4px 12px; border-radius: var(--r-control); cursor: pointer; transition: border-color .14s var(--ease), color .14s var(--ease), background .14s var(--ease); }
  .skill-pager .pg-btn:hover:not(:disabled) { border-color: var(--accent-border); color: var(--accent); background: var(--accent-bg); }
  .skill-pager .pg-btn:disabled { opacity: .45; cursor: default; }
  .skill-pager .pg-arrow { font-family: var(--mono); font-size: 15px; line-height: 1; }
  .skill-card { height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; box-shadow: var(--shadow-card); transition: border-color .18s var(--ease), box-shadow .18s var(--ease); box-sizing: border-box; }
  .skill-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card-hover); }
  .skill-card .sk-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .skill-card .sk-cat { font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .03em; color: var(--accent); background: var(--accent-bg); padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; }
  .skill-card .sk-name { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0; }
  .skill-card .sk-usage { color: var(--muted); font-size: var(--fs-xs); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.1em; }
  .skill-card .sk-count { flex: none; font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; }
  .skill-card .sk-count.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
  .skill-card .sk-count.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
  .skill-card .sk-count.err { color: var(--err); background: var(--err-bg); border-color: var(--err-border); }
  .skill-card .sk-home { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; border: none; background: transparent; box-shadow: none; color: var(--accent); font-family: var(--mono); font-size: var(--fs-2xs); padding: 0; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; align-self: flex-start; }
  .skill-card .sk-home svg { width: 11px; height: 11px; flex: none; }
  .skill-card .sk-home:hover { color: var(--accent-strong); text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-2xs); padding: 2px 8px; border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .chip.on { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .chip.off { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  .chip.na { color: var(--faint); }
  .chip.more { color: var(--faint); border-style: dashed; background: transparent; }

  /* ============ mainstream (add panel) ============ */
  .mainstream-list { display: flex; flex-direction: column; gap: 6px; max-height: min(46vh, 400px); overflow-y: auto; margin: 8px 0 4px; }
  .mainstream-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-card); padding: 8px 11px; background: var(--panel); }
  .mainstream-item .mt-title { font-weight: 600; font-size: var(--fs-sm); }
  .mainstream-item .mt-type { color: var(--muted); font-size: var(--fs-2xs); margin-left: 6px; }
  .mainstream-item .mt-info { flex: 1; min-width: 0; }
  .mainstream-item .mt-path { color: var(--faint); font-size: var(--fs-2xs); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
  .mainstream-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent-strong); flex: none; cursor: pointer; }
  .mainstream-item input[type="checkbox"]:disabled { cursor: not-allowed; opacity: .4; }
  .mainstream-item .chk-label { font-size: var(--fs-2xs); color: var(--ok); font-weight: 500; }
  .mainstream-item .chk-label.off { color: var(--muted); }
  .mainstream-item .chk-label.ghost { color: var(--faint); }
  .mainstream-item.on { border-color: var(--accent-border); background: var(--accent-bg); }
  .mainstream-item.dim { opacity: .55; }
  .mt-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mt-toolbar .mt-search { flex: 1; min-width: 160px; margin-bottom: 0; }
  .mt-toolbar .mt-sum { color: var(--muted); font-size: var(--fs-2xs); white-space: nowrap; }
  .mt-toolbar .mt-spacer { flex: 1; }
  .mt-editor { border: 1px dashed var(--line-strong); border-radius: var(--r-card); padding: 10px; margin: 4px 0 8px 26px; background: var(--bg-elev); display: flex; flex-direction: column; gap: 6px; }
  .mt-editor .row .k { flex: 0 0 96px; }

  /* ============ modal ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: modalBgIn .18s ease-out;
  }
  @keyframes modalBgIn { from { opacity: 0; } }
  @keyframes modalCardIn { from { opacity: 0; transform: scale(.95) translateY(8px); } }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    width: min(560px, 92vw);
    max-height: 92vh;
    overflow-y: auto;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.03),
      0 2px 6px rgba(0,0,0,.06),
      0 12px 40px rgba(0,0,0,.14);
    animation: modalCardIn .22s cubic-bezier(.16,1,.3,1);
  }
  .modal h3 { margin: 0 0 12px; font-family: var(--display); font-size: 1rem; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .modal .rows { display: flex; flex-direction: column; gap: 10px; }
  .modal .rows .k { flex: 0 0 110px; }
  .modal .row + .row { margin-top: 0; }
  .modal-xl { width: min(760px, 94vw) !important; }
  .modal-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .modal-section h4 { margin: 0 0 8px; font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .endpoint-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* 确认对话框 */
  .cfm-card { text-align: center; width: min(400px, 94vw) !important; padding: 32px 28px 24px; }
  .cfm-icon {
    width: 48px; height: 48px; border-radius: 50%;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; font-family: var(--mono);
    background: var(--err-bg); color: var(--err);
    border: 1px solid var(--err-border);
  }
  .cfm-card .cfm-title { font-size: var(--fs-md); font-weight: 600; color: var(--text); margin: 0 0 6px; }
  .cfm-card .cfm-msg { font-size: var(--fs-sm); color: var(--muted); margin: 0 0 24px; line-height: 1.55; white-space: pre-line; }
  .cfm-card .actions { justify-content: center; gap: 12px; margin-top: 0; }
  .cfm-card .actions button {
    padding: 8px 22px; border-radius: 8px; font-size: var(--fs-sm); font-weight: 500;
    transition: all .15s var(--ease);
  }
  .cfm-btn-cancel {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  }
  .cfm-btn-cancel:hover { background: var(--line); }
  .cfm-btn-cancel:active { transform: scale(.97); }
  .cfm-btn-danger {
    background: var(--err); color: #fff; border: none;
    box-shadow: 0 2px 8px rgba(220,38,38,.32);
  }
  .cfm-btn-danger:hover { background: #b91c1c; box-shadow: 0 4px 14px rgba(220,38,38,.40); }
  .cfm-btn-danger:active { transform: scale(.97); }
  .cfm-btn-danger:disabled { cursor: not-allowed; box-shadow: none; }
  /* 强确认（手输条目名）：输入框撑满卡片、等宽字体便于逐字对照 */
  .cfm-typed { margin: 0 0 22px; }
  .cfm-typed input { width: 100%; text-align: center; font-family: var(--mono); letter-spacing: .04em; }

  /* 进度 / 结果对话框 */
  .task-card { width: min(420px, 94vw) !important; }
  .task-spinner {
    width: 34px; height: 34px; border-radius: 50%;
    margin: 0 auto 16px; flex: none;
    border: 3px solid var(--accent-bg); border-top-color: var(--accent);
    animation: ts-spin .7s linear infinite;
  }
  .task-result {
    width: 52px; height: 52px; border-radius: 50%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    animation: taskpop .28s var(--ease);
  }
  @keyframes taskpop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .task-result svg { width: 26px; height: 26px; }
  .task-result.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
  .task-result.err { background: var(--err-bg); color: var(--err); border: 1px solid var(--err-border); }
  .task-result.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
  .task-status {
    font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em;
    margin: 0 0 4px;
  }
  .task-status.ok { color: var(--ok); }
  .task-status.err { color: var(--err); }
  .task-status.warn { color: var(--warn); }
  .task-stages {
    display: flex; flex-direction: column; gap: 8px;
    text-align: left; margin: 4px 0 10px; width: 100%;
  }
  .task-stage {
    display: flex; align-items: center; gap: 9px;
    font-size: var(--fs-sm); color: var(--faint);
    transition: color .2s var(--ease);
  }
  .task-stage .ts-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--line-strong); transition: background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .task-stage.active { color: var(--text); }
  .task-stage.active .ts-dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }
  .task-stage.done { color: var(--muted); }
  .task-stage.done .ts-dot { background: var(--ok); }
  .task-fold { width: 100%; text-align: left; margin: 4px 0 18px; }
  .task-fold summary {
    cursor: pointer; user-select: none;
    font-size: var(--fs-2xs); font-weight: 500; color: var(--muted);
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 0; list-style: none;
  }
  .task-fold summary::-webkit-details-marker { display: none; }
  .task-fold summary:hover { color: var(--text); }
  .task-fold summary::before { content: "›"; transition: transform .18s var(--ease); font-size: 14px; line-height: 1; }
  .task-fold[open] summary::before { transform: rotate(90deg); }
  .task-detail {
    font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-top: 8px; text-align: left; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }

  /* 统一表单模态框 */
  .modal-form { padding: 28px; }
  .modal-form .form-title { font-size: 1rem; font-weight: 600; color: var(--text); margin: 0 0 4px; letter-spacing: -.01em; }
  .modal-form .form-sub { font-size: var(--fs-xs); color: var(--muted); margin: 0 0 18px; line-height: 1.4; }
  .modal-form .form-field { margin-bottom: 12px; }
  .modal-form .form-field label { display: block; font-size: var(--fs-xs); font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .modal-form .form-field input,
  .modal-form .form-field textarea,
  .modal-form .form-field select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: var(--fs-sm); font-family: var(--mono); color: var(--text);
    background: var(--panel); transition: border-color .15s var(--ease);
    box-sizing: border-box;
  }
  .modal-form .form-field input:focus,
  .modal-form .form-field textarea:focus,
  .modal-form .form-field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .modal-form .form-field textarea { resize: vertical; min-height: 80px; }
  .modal-form .form-row { display: flex; gap: 10px; align-items: center; }
  .modal-form .form-row .form-field { flex: 1; margin-bottom: 0; }
  .modal-form .form-row button { flex: 0 0 auto; }
  .modal-form .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal-form .form-actions button {
    padding: 8px 20px; border-radius: 8px; font-size: var(--fs-sm); font-weight: 500;
    transition: all .15s var(--ease); cursor: pointer;
  }
  .modal-form .btn-cancel {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  }
  .modal-form .btn-cancel:hover { background: var(--line); }
  .modal-form .btn-cancel:active { transform: scale(.97); }
  .modal-form .btn-save {
    background: var(--accent); color: var(--on-accent); border: none;
    box-shadow: 0 2px 8px rgba(37,99,235,.28);
  }
  .modal-form .btn-save:hover { background: var(--accent-strong); box-shadow: 0 4px 14px rgba(37,99,235,.36); }
  .modal-form .btn-save:active { transform: scale(.97); }
  .modal-form .btn-danger {
    background: var(--err); color: #fff; border: none;
    box-shadow: 0 2px 8px rgba(220,38,38,.32);
  }
  .modal-form .btn-danger:hover { background: #b91c1c; box-shadow: 0 4px 14px rgba(220,38,38,.40); }
  .modal-form .btn-danger:active { transform: scale(.97); }
  .modal-form .form-pre {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; font-size: var(--fs-xs); font-family: var(--mono);
    white-space: pre-wrap; max-height: 300px; overflow: auto; color: var(--text);
  }
  .modal-form .form-hint {
    font-size: var(--fs-xs); color: var(--muted); margin: 0 0 14px; line-height: 1.4;
  }
  /* 详情弹窗（agent detail） */
  .ad-modal { width: min(680px, 94vw); padding: 0; overflow: hidden; }
  .ad-head { padding: 24px 28px 20px; border-bottom: 1px solid var(--line); }
  .ad-head-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ad-type {
    font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
    background: var(--accent-bg); border: 1px solid var(--accent-border);
    border-radius: var(--r-pill); padding: 2px 9px;
  }
  .ad-name { font-family: var(--display); font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; color: var(--text); line-height: 1.15; }
  .ad-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ad-body { padding: 6px 28px 20px; max-height: calc(92vh - 150px); overflow-y: auto; }
  .ad-section { padding-top: 16px; margin-top: 2px; }
  .ad-section + .ad-section { border-top: 1px solid var(--line); margin-top: 14px; }
  .ad-sec-label {
    font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px;
  }
  .ad-kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: start; padding: 7px 0; }
  .ad-k { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); line-height: 1.6; padding-top: 2px; }
  .ad-pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .ad-pill {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%; min-width: 0;
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; line-height: 1.5;
  }
  .ad-pill .ad-pill-path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto;
  }
  .ad-pill .ad-pill-ver {
    flex: none; font-family: var(--mono); font-size: 10px; font-weight: 500; line-height: 1.4;
    color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap;
  }
  .ad-none { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); font-style: italic; line-height: 1.7; }
  .ad-v { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text); line-height: 1.7; word-break: break-all; }
  .ad-entries { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ad-entry {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  .ad-entry .ad-e-key { font-family: var(--mono); font-size: var(--fs-xs); font-weight: 600; color: var(--text); flex: 0 1 auto; white-space: nowrap; }
  .ad-entry .ad-e-loc {
    font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right;
  }
  .ad-entry .ad-clean {
    flex: none; border: 1px solid var(--err-border); background: var(--err-bg); color: var(--err);
    border-radius: var(--r-pill); padding: 2px 10px; height: 22px;
    font-size: var(--fs-2xs); font-family: var(--mono); font-weight: 600; line-height: 1;
    cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .ad-entry .ad-clean:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .ad-entry .ad-clean:active { transform: scale(.96); }
  .ad-cleanbar { display: flex; align-items: center; gap: 10px; padding: 8px 0 2px; }
  .ad-clean-note { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); }
  .ad-clean-btn {
    border: 1px solid var(--err-border); background: var(--err-bg); color: var(--err);
    border-radius: 8px; padding: 6px 14px; font-size: var(--fs-sm); font-weight: 600;
    cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .ad-clean-btn:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .ad-clean-btn:active { transform: scale(.97); }
  .ad-foot-note { padding: 10px 28px 18px; font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted); border-top: 1px solid var(--line); margin-top: -1px; line-height: 1.6; }
  .ad-entry.mcp-entry { align-items: center; gap: 10px; }
  .mcp-loc-type { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 2px; }
  .ad-foot { display: flex; align-items: center; gap: 10px; padding: 14px 28px 20px; border-top: 1px solid var(--line); }
  .ad-foot .close-push { margin-left: auto; }
  .ad-foot .btn-soft.danger { background: var(--err-bg); border-color: var(--err-border); color: var(--err); }
  .ad-foot .btn-soft.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .ad-foot .btn-cancel {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 20px; border-radius: 8px; font-size: var(--fs-sm); font-weight: 500;
    cursor: pointer; transition: all .15s var(--ease);
  }
  .ad-foot .btn-cancel:hover { background: var(--line); }
  .ad-foot .btn-cancel:active { transform: scale(.97); }
  /* Token 输入行 */
  .token-row { display: flex; gap: 0; align-items: stretch; }
  .token-row input { flex: 1; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .token-toggle {
    flex: 0 0 auto; padding: 0 12px; border: 1px solid var(--line); border-left: none;
    border-radius: 0 8px 8px 0; background: var(--panel-2); color: var(--muted);
    font-size: var(--fs-2xs); cursor: pointer; white-space: nowrap;
  }
  .token-toggle:hover { background: var(--line); color: var(--text); }
  /* 测试结果面板 */
  .test-panel { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: var(--fs-xs); display: none; }
  .test-panel.show { display: block; }
  .test-panel.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok); }
  .test-panel.err { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err); }
  .test-panel.loading { background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent); }
  .test-panel .tp-head { font-weight: 600; margin-bottom: 6px; }
  .test-panel .tp-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .test-panel .tp-tool { padding: 2px 8px; border-radius: 4px; font-family: var(--mono); font-size: var(--fs-2xs); background: var(--panel); border: 1px solid var(--line); }
  .test-panel .tp-err { font-family: var(--mono); word-break: break-all; }
  /* 测试按钮 */
  .btn-test { padding: 8px 16px; border-radius: 8px; font-size: var(--fs-sm); font-weight: 500; cursor: pointer; transition: all .15s var(--ease); background: var(--panel-2); color: var(--accent); border: 1px solid var(--accent-border); }
  .btn-test:hover { background: var(--accent-bg); }
  .btn-test:active { transform: scale(.97); }
  .btn-test:disabled { opacity: .5; cursor: not-allowed; }
  /* 测试结果对话框 */
  .test-modal { max-width: 520px; }
  .ts-body { min-height: 120px; }
  .ts-loading { display: flex; align-items: center; gap: 10px; padding: 18px 4px; color: var(--muted); font-size: var(--fs-sm); }
  .ts-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent-bg); border-top-color: var(--accent); animation: ts-spin .7s linear infinite; flex-shrink: 0; }
  @keyframes ts-spin { to { transform: rotate(360deg); } }
  .ts-result { padding: 14px; border-radius: 10px; border: 1px solid var(--line); }
  .ts-result.ok { background: var(--ok-bg); border-color: var(--ok-border); }
  .ts-result.err { background: var(--err-bg); border-color: var(--err-border); }
  .ts-result .ts-badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm); margin-bottom: 10px; }
  .ts-result.ok .ts-badge { color: var(--ok); }
  .ts-result.err .ts-badge { color: var(--err); }
  .ts-result .ts-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .ts-summary { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: var(--fs-xs); margin-bottom: 12px; }
  .ts-summary .k { color: var(--faint); white-space: nowrap; }
  .ts-summary .v { color: var(--text); font-family: var(--mono); word-break: break-all; }
  .ts-tools-label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 2px 0 6px; font-weight: 500; }
  .ts-tools { display: flex; flex-wrap: wrap; gap: 5px; max-height: 180px; overflow: auto; padding-right: 2px; }
  .ts-tool { padding: 3px 10px; border-radius: 6px; font-family: var(--mono); font-size: var(--fs-2xs); background: var(--panel); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
  .ts-error { font-family: var(--mono); font-size: var(--fs-xs); color: var(--err); word-break: break-all; white-space: pre-wrap; line-height: 1.5; }
  .ts-empty { color: var(--faint); font-size: var(--fs-xs); font-style: italic; }
  /* 传输类型选择 */
  .transport-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .transport-opt {
    flex: 1 1 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; font-size: var(--fs-sm); color: var(--muted); background: var(--panel);
    transition: all .15s var(--ease);
  }
  .transport-opt:hover { border-color: var(--accent-border); }
  .transport-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .transport-opt input { accent-color: var(--accent); }

  .pagination { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .pagination button { padding: 4px 9px; font-size: var(--fs-xs); }
  .pagination .current { font-weight: 600; color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
  .pagination .pg-ellipsis { color: var(--faint); font-size: var(--fs-xs); padding: 0 2px; }
  .pagination .pg-jump { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--muted); margin-left: 6px; }
  .pagination .pg-input { width: 52px; padding: 3px 6px; font-size: var(--fs-xs); font-family: var(--mono); border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  .pagination .pg-input:focus { outline: none; border-color: var(--accent); }

  /* 表格内路径分行 */
  .path-lines { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-2xs); }
  .path-lines .pl { padding: 1px 0; line-height: 1.35; }
  .path-lines .pl-more { color: var(--accent); cursor: pointer; font-weight: 500; }
  .path-lines .pl-more:hover { text-decoration: underline; }
  .path-none { color: var(--faint); font-style: italic; }

  /* ============ IDE/Agent 卡片（重新设计：分类 + 完整路径 + 状态） ============ */
  .agent-grid { display: flex; flex-direction: column; gap: 26px; margin-top: 14px; }

  /* 分组标题：类型色节点 + 大写标签 + 数量徽章 + 发丝线 */
  .agent-group-title {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  .agent-group-title .agt-dot {
    width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--tc-soft, var(--accent-bg));
  }
  .agent-group-title .agt-label {
    font-family: var(--mono); font-size: var(--fs-xs); font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--text);
  }
  .agent-group-title .agt-count {
    font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 500;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    padding: 1px 9px; border-radius: var(--r-pill); line-height: 1.6;
  }
  .agent-group-title .agt-rule { flex: 1; height: 1px; background: var(--line); }

  /* 卡片网格：宽屏 2 列宽卡，中屏 1 列（保证路径完整可读） */
  .agent-group-title { cursor: pointer; user-select: none; }
  .agent-group-title:hover { opacity: .85; }
  .agent-group-title .agt-caret {
    width: 0; height: 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent;
    border-bottom: 4px solid transparent; transition: transform .15s var(--ease); flex-shrink: 0;
  }
  .agent-group.collapsed .agt-caret { transform: rotate(90deg); }
  .agent-group.collapsed .agent-cards { display: none; }
  .agent-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .agent-toolbar .agent-search { flex: 1; min-width: 0; margin-bottom: 0; }
  .agent-toolbar .view-toggle { margin-left: auto; }
  /* 列表视图：表格全量清单 */
  .agent-list-wrap { margin-top: 14px; }
  .agent-list-count { font-size: var(--fs-xs); color: var(--muted); margin-bottom: 8px; }
  .agent-list-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .agent-list-table th {
    text-align: left; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); font-weight: 600; padding: 7px 10px; border-bottom: 1px solid var(--line-strong);
  }
  .agent-list-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .agent-list-table tr:hover td { background: var(--bg-elev); }
  .al-name { font-weight: 600; color: var(--text); }
  .al-type { font-size: var(--fs-2xs); color: var(--muted); font-family: var(--mono); }
  .al-metrics { display: flex; gap: 4px; flex-wrap: wrap; }
  .al-metric { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-2xs); color: var(--muted); font-family: var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--panel); }
  .al-metric b { color: var(--text); font-weight: 600; }
  .al-metric.hit { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent); }
  .al-metric.hit b { color: var(--accent); }
  .al-metric-btn { cursor: pointer; box-shadow: none; font: inherit; line-height: 1.6; }
  .al-metric-btn:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent); }
  .al-metric-btn:active { transform: scale(.94); }
  .al-metric-btn.mcp { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .al-metric-btn.mcp:hover { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  /* 分类筛选 chips */
  .agent-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .agent-chip {
    padding: 3px 11px; border-radius: var(--r-pill); border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: var(--fs-xs); cursor: pointer;
    transition: all .15s var(--ease); font-weight: 500;
  }
  .agent-chip:hover { border-color: var(--accent-border); color: var(--text); }
  .agent-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .agent-chip .chip-count { font-family: var(--mono); font-size: var(--fs-2xs); opacity: .75; margin-left: 4px; }
  /* 列表分组表头行 */
  .agent-list-table tr.al-group-head td {
    background: var(--bg-elev); padding: 6px 10px; border-top: 1px solid var(--line-strong); cursor: pointer; user-select: none;
  }
  .agent-list-table tr.al-group-head:first-child td { border-top: none; }
  .agent-list-table .al-group-label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text); font-size: var(--fs-xs); }
  .agent-list-table .al-group-label .agt-caret { transform: rotate(90deg); }
  .agent-list-table tr.al-group-head.collapsed .al-group-label .agt-caret { transform: rotate(0deg); }
  .agent-list-table tr.al-row.collapsed { display: none; }
  .agent-list-table .al-group-count { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); padding: 0 8px; border-radius: var(--r-pill); line-height: 1.6; }
  .agent-list-table .al-group-metric { font-size: var(--fs-2xs); color: var(--faint); }
  .agent-list-empty { padding: 18px; text-align: center; color: var(--faint); font-size: var(--fs-sm); }
  .agent-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 1240px) { .agent-cards { grid-template-columns: 1fr; } }

  .agent-card {
    --tc: var(--accent);
    --tc-soft: var(--accent-bg);
    --tc-border: var(--accent-border);
    position: relative; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    animation: agreveal .45s var(--ease) backwards;
  }
  .agent-card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-1px);
  }

  /* 头部：名称 + 类型徽章 + 登记状态 */
  .agent-card .ac-head { display: flex; align-items: center; gap: 9px; padding: 15px 16px 2px; }
  .agent-card .ac-name {
    font-family: var(--mono); font-weight: 600; font-size: var(--fs-base);
    color: var(--text); letter-spacing: -.01em; min-width: 0;
  }
  .agent-card .ac-type {
    margin-left: auto; font-size: var(--fs-2xs); font-weight: 500; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; line-height: 1.6;
  }
  .agent-card .status {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: var(--fs-2xs); font-weight: 500; line-height: 1.6; white-space: nowrap;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r-pill); padding: 1px 9px;
  }
  .agent-card .status .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .agent-card .status.ok { color: var(--ok); border-color: var(--ok-border); background: var(--ok-bg); }
  .agent-card .status.ok .sdot { background: var(--ok); }
  .agent-card .status.warn { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  .agent-card .status.warn .sdot { background: var(--warn); }
  .agent-card .status.err { color: var(--err); border-color: var(--err-border); background: var(--err-bg); }
  .agent-card .status.err .sdot { background: var(--err); }

  /* 路径区：每类一行，完整列出全部路径 */
  .agent-card .ac-paths { display: flex; flex-direction: column; gap: 7px; padding: 12px 16px; }
  .agent-card .ac-path-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: start; }
  .agent-card .ac-path-label {
    font-family: var(--mono); font-size: var(--fs-2xs); font-weight: 600;
    letter-spacing: .07em; color: var(--faint); line-height: 1.9;
    display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .agent-card .ac-path-label::before { content: ""; width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; background: var(--line-strong); }
  .agent-card .ac-path-row.is-empty .ac-path-label::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .agent-card .ac-path-list { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .agent-card .ac-path-item { display: flex; align-items: center; min-width: 0; gap: 8px; }
  .agent-card .ac-path-badges { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .agent-card .ac-path-val {
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted);
    line-height: 1.5;
    flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 2px 8px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid transparent;
    transition: background .12s var(--ease), color .12s var(--ease), border-color .12s var(--ease);
  }
  .agent-card .ac-path-val:hover { background: var(--bg-elev); color: var(--text); border-color: var(--line-strong); }
  .ac-path-ver {
    font-family: var(--mono); font-size: 10px; font-weight: 500; line-height: 1.4;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap;
  }
  .ac-path-more {
    font-family: var(--mono); font-size: 10px; font-weight: 500; line-height: 1.4;
    color: var(--muted); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 6px; white-space: nowrap; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    transition: color .12s var(--ease), background .12s var(--ease), border-color .12s var(--ease);
  }
  .ac-path-more:hover { color: var(--text); background: var(--bg-elev); border-color: var(--line-strong); }
  .ac-path-more:active { transform: scale(.96); }
  .agent-card .ac-path-ver, .agent-card .ac-path-more { flex: none; }
  .agent-card .ac-path-none { color: var(--faint); font-style: italic; font-size: var(--fs-2xs); line-height: 1.5; padding: 2px 8px; }
  .agent-card .ac-path-collapsed { min-width: 0; display: block; }
  .agent-card .ac-path-expanded { display: none; flex-direction: column; gap: 3px; min-width: 0; }
  .agent-card .ac-path-row.is-expanded .ac-path-collapsed { display: none; }
  .agent-card .ac-path-row.is-expanded .ac-path-expanded { display: flex; }
  .agent-card .ac-path-collapse {
    align-self: flex-start; font-family: var(--mono); font-size: 10px; font-weight: 500;
    line-height: 1.4; color: var(--faint); background: transparent; border: none;
    padding: 1px 2px; cursor: pointer; appearance: none; -webkit-appearance: none;
  }
  .agent-card .ac-path-collapse:hover { color: var(--text); }

  /* 底部：路径计数 + 详情入口 */
  .agent-card .ac-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: auto; padding: 9px 16px 11px; border-top: 1px solid var(--line); background: var(--bg-elev);
  }
  .agent-card .ac-foot .ac-count { font-size: var(--fs-2xs); color: var(--faint); font-family: var(--mono); }

  .agent-search {
    width: 100%; margin-bottom: 14px; padding: 9px 14px;
    border: 1px solid var(--line); border-radius: var(--r-control);
    font-size: var(--fs-sm); font-family: var(--mono); color: var(--text);
    background: var(--panel); box-shadow: var(--shadow-card);
  }
  .agent-search:hover { border-color: var(--line-strong); }
  .agent-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

  @keyframes agreveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Agent 设置子页面 */
  .agent-settings-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .agent-settings-section h4 { margin: 0 0 8px; font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .path-field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .path-field-row input { flex: 1; }
  .path-field-row button { flex: 0 0 auto; font-size: var(--fs-2xs); padding: 4px 8px; }

  /* ============ settings（参考：label 左 + 控件右的表单行，hairline 分隔） ============ */
  .settings-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .settings-card h4 { margin: 0 0 12px; font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .settings-card .rows .row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .settings-card .rows .row:last-child { border-bottom: none; }
  .settings-card .row .k { flex: 0 0 150px; font-weight: 500; color: var(--text); }
  .settings-card .row .v { color: var(--muted); }
  .card-link { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .card-link .grow { flex: 1; }
  .about-card { background: var(--bg-elev); }
  .about-head { font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* 设置页子导航 tabs */
  .settings-tabs {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 4px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  }
  .settings-tab {
    border: none; background: transparent; box-shadow: none; cursor: pointer;
    padding: 6px 15px; border-radius: 7px;
    font-size: var(--fs-sm); font-weight: 500; color: var(--muted);
    transition: background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .settings-tab:hover { color: var(--text); }
  .settings-tab.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-card); }
  .settings-tab .st-count { font-family: var(--mono); font-size: var(--fs-2xs); color: var(--faint); margin-left: 5px; }
  .settings-tab.active .st-count { color: var(--accent); }
  .settings-tab-panel { display: flex; flex-direction: column; }
  .settings-tab-panel .settings-card:last-child { margin-bottom: 0; }

  /* ============ skeleton / empty ============ */
  .empty { margin: 24px 0; padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r-card); }
  .card-skeleton { min-height: 88px; }
  .sk-line { height: 12px; border-radius: var(--r-control); background: var(--panel-2); margin: 6px 0; animation: skpulse 1.4s ease-in-out infinite; }
  @keyframes skpulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  /* ============ 交互组件（结构参照 skills-manager，颜色走品牌蓝） ============ */
  /* toggle switch：34×20 药丸，role=switch */
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex: 0 0 auto; cursor: pointer; border: none; background: transparent; padding: 0; box-shadow: none; }
  .switch .sw-track { position: absolute; inset: 0; border-radius: var(--r-pill); background: var(--line-strong); transition: background .18s var(--ease); }
  .switch .sw-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.28); transition: transform .18s var(--ease); }
  .switch[aria-checked="true"] .sw-track { background: var(--accent-strong); }
  .switch[aria-checked="true"] .sw-knob { transform: translateX(14px); }
  .switch.sw-loading .sw-knob { background: transparent; border: 2px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: swspin .6s linear infinite; }
  .switch[aria-checked="true"].sw-loading .sw-knob { border-top-color: #fff; border-right-color: #fff; animation-name: swspin-checked; }
  @keyframes swspin { to { transform: rotate(360deg); } }
  @keyframes swspin-checked { to { transform: translateX(14px) rotate(360deg); } }

  /* 右侧详情 Sheet */
  .sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 50; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow-modal); z-index: 51; display: flex; flex-direction: column; animation: sheetin .22s var(--ease); }
  @keyframes sheetin { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .sheet-head .sh-wrap { min-width: 0; flex: 1; }
  .sheet-head h3 { margin: 0; font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: 0; word-break: break-all; }
  .sheet-head .sh-mono { color: var(--faint); font-family: var(--mono); font-size: var(--fs-xs); margin-top: 2px; }
  .sheet-head .sh-desc { color: var(--muted); font-size: var(--fs-sm); margin-top: 4px; line-height: 1.5; }
  .sheet-head .sh-triggers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sheet-head .sh-home { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; border: 1px solid var(--line); background: transparent; box-shadow: none; padding: 4px 10px; border-radius: var(--r-control); color: var(--accent); font-family: var(--mono); font-size: var(--fs-2xs); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-head .sh-home svg { width: 12px; height: 12px; flex: none; }
  .sheet-head .sh-home:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--accent-strong); }
  .sheet-close { margin-left: auto; flex: 0 0 auto; border: none; background: transparent; color: var(--muted); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; box-shadow: none; padding: 0; }
  .sheet-close:hover { background: var(--panel-2); color: var(--text); }
  .sheet-close svg { width: 16px; height: 16px; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 18px 22px 24px; }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .sheet-actions .btn-soft { display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .sheet-actions .btn-soft svg { width: 14px; height: 14px; flex: none; }
  .sheet-actions .btn-soft.danger { background: var(--err-bg); border-color: var(--err-border); color: var(--err); }
  .sheet-actions .btn-soft.danger:hover { background: var(--err); border-color: var(--err); color: #fff; }
  .sheet-meta { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .sheet-section-title { font-family: var(--display); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .sheet-nest { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: var(--r-control); padding: 6px 10px; max-height: 220px; overflow-y: auto; }
  .sheet-nest-item { display: flex; align-items: center; gap: 10px; font-size: var(--fs-xs); padding: 4px 0; }
  .sheet-nest-item .sn-name { font-family: var(--mono); font-weight: 600; color: var(--text); white-space: nowrap; }
  .sheet-nest-item .sn-path { font-family: var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .client-state-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .client-state-row:last-child { border-bottom: none; }
  .client-state-row .cr-name { font-weight: 500; font-size: var(--fs-sm); color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .client-state-row .cr-state { font-size: var(--fs-2xs); color: var(--faint); font-family: var(--mono); }

  /* ⌘K 命令面板 */
  .palette { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-modal); z-index: 60; display: flex; flex-direction: column; overflow: hidden; animation: palin .16s var(--ease); }
  @keyframes palin { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .pal-input-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .pal-input-wrap svg { width: 16px; height: 16px; stroke: var(--faint); flex: none; }
  .pal-input { border: none; background: transparent; font-size: var(--fs-md); color: var(--text); flex: 1; box-shadow: none; min-width: 0; padding: 0; }
  .pal-input:focus { box-shadow: none; }
  .pal-list { max-height: min(52vh, 420px); overflow-y: auto; padding: 6px; }
  .pal-group-label { padding: 8px 10px 4px; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .pal-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; box-shadow: none; border-radius: 8px; cursor: pointer; text-align: left; color: var(--text); }
  .pal-item.active { background: var(--accent-bg); }
  .pal-item .pi-ico { width: 16px; height: 16px; stroke: var(--muted); flex: none; }
  .pal-item.active .pi-ico { stroke: var(--accent); }
  .pal-item .pi-label { flex: 1; font-size: var(--fs-sm); font-weight: 500; }
  .pal-item .pi-sub { font-size: var(--fs-2xs); color: var(--faint); font-family: var(--mono); }

  /* kebab 溢出菜单 */
  .kebab { border: none; background: transparent; color: var(--muted); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; box-shadow: none; padding: 0; margin-left: auto; flex: none; }
  .kebab:hover { background: var(--panel-2); color: var(--text); }
  .kebab svg { width: 16px; height: 16px; }
  .kebab.skill-kebab { margin-left: 0; }
  .skill-card .sk-top-right { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .skill-table .st-ops .kebab { width: 22px; height: 22px; }
  .pop-menu { position: fixed; z-index: 60; min-width: 176px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-modal); padding: 4px; animation: palin .14s var(--ease); }
  .pop-menu .pm-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border: none; background: transparent; box-shadow: none; border-radius: 7px; cursor: pointer; text-align: left; color: var(--text); font-size: var(--fs-sm); font-weight: 500; }
  .pop-menu .pm-item:hover { background: var(--panel-2); }
  .pop-menu .pm-item svg { width: 15px; height: 15px; flex: none; }
  .pop-menu .pm-item.danger { color: var(--err); }
  .pop-menu .pm-sep { height: 1px; background: var(--line); margin: 4px 6px; }

  /* 路径明细气泡：列表视图数字徽章点开后展示 APP/CLI/CONFIG/MCP 路径或端点 */
  .path-pop { position: fixed; z-index: 61; width: 320px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-modal); animation: palin .14s var(--ease); overflow: hidden; }
  .path-pop .pp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .path-pop .pp-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
  .path-pop .pp-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .path-pop .pp-body { max-height: 300px; overflow-y: auto; padding: 6px; }
  .path-pop .pp-item { display: flex; width: 100%; align-items: flex-start; gap: 8px; padding: 7px 9px; border: none; background: transparent; box-shadow: none; border-radius: 7px; cursor: pointer; text-align: left; color: var(--text); font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.5; word-break: break-all; }
  .path-pop .pp-item:hover { background: var(--panel-2); }
  .path-pop .pp-item svg { width: 13px; height: 13px; flex: none; margin-top: 2px; color: var(--muted); }
  .path-pop .pp-empty { padding: 14px 12px; color: var(--faint); font-size: var(--fs-sm); text-align: center; }
  .path-pop .pp-hint { padding: 6px 12px 9px; border-top: 1px solid var(--line); color: var(--faint); font-size: 10px; }

  /* 底部 toast 栈 */
  .toast-root { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 70; align-items: flex-end; }
  .toast { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; box-shadow: var(--shadow-modal); font-size: var(--fs-sm); max-width: 380px; animation: toastin .2s var(--ease); }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .toast .t-ico { width: 16px; height: 16px; flex: none; }
  .toast.ok .t-ico { stroke: var(--ok); }
  .toast.err .t-ico { stroke: var(--err); }
  .toast.warn .t-ico { stroke: var(--warn); }
  .toast.info .t-ico { stroke: var(--accent); }
  .toast .t-ico.t-spin { animation: swspin .7s linear infinite; }
  .toast .t-msg { flex: 1; min-width: 0; color: var(--text); }

  /* 技能页工具栏：分段筛选 + 网格/列表切换 */
  .skill-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .skill-legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 7px 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--bg-elev); font-size: var(--fs-xs); color: var(--muted); }
  .skill-legend .legend-label { font-weight: 600; color: var(--text); }
  .skill-legend .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .skill-legend .legend-swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .skill-legend .legend-swatch.ok { background: var(--ok); }
  .skill-legend .legend-swatch.warn { background: var(--warn); }
  .skill-legend .legend-swatch.err { background: var(--err); }
  .skill-legend .legend-swatch.na { background: var(--faint); }
  .skill-legend .legend-note { color: var(--faint); font-family: var(--mono); font-size: var(--fs-2xs); margin-left: auto; }
  .skill-cat-chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .cat-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: var(--r-pill); padding: 2px 10px; font-size: var(--fs-xs); font-weight: 500; cursor: pointer; box-shadow: none; }
  .cat-chip:hover { border-color: var(--accent-border); color: var(--text); }
  .cat-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .cat-chip .cat-n { font-family: var(--mono); font-size: var(--fs-2xs); opacity: .75; }
  .nest-toggle { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex: none; border: none; background: transparent; box-shadow: none; padding: 0; color: var(--faint); cursor: pointer; border-radius: 5px; }
  .nest-toggle.nest-slot { cursor: default; pointer-events: none; }
  .nest-toggle:hover { background: var(--panel-2); color: var(--text); }
  .nest-toggle svg { width: 13px; height: 13px; transform: rotate(0deg); transition: transform .16s var(--ease); }
  .nest-toggle.open svg { transform: rotate(90deg); }
  .nest-count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; font-family: var(--mono); font-size: var(--fs-2xs); color: var(--faint); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-pill); }
  .skill-table td.st-name { padding: 0; overflow: hidden; }
  .skill-table .st-name-cell { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 6px 12px; }
  .skill-table tbody tr.nest-tr td { background: var(--bg-elev); padding: 0 0 12px; }
  .nest-list { display: flex; flex-direction: column; gap: 0; padding: 6px 0 0; }
  /* 子技能条目：grid 分格对齐主表头（名称 | 分类 | 用途 | 启用 | 操作），分类/启用/操作留空占位 */
  .nest-item {
    display: grid;
    grid-template-columns: 18% 12% 1fr 13% 4%;
    align-items: center;
    min-width: 0;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .nest-item-name { grid-column: 1; padding-left: 36px; font-family: var(--mono); font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nest-item-desc { grid-column: 3; color: var(--muted); font-size: var(--fs-2xs); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nest-item-cat, .nest-item-state, .nest-item-ops { display: none; }
  .nest-hint { font-size: var(--fs-2xs); color: var(--faint); padding: 8px 0 0 36px; }
  .skill-table tbody tr.skill-row.nesting-open td { background: var(--bg-elev); }
  .skill-card .sk-name { display: flex; align-items: center; gap: 6px; }
  .skill-card .sk-name-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .skill-card.nesting-open { border-color: var(--accent-border); }
  .view-toggle { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elev); margin-left: auto; }
  .view-btn { border: none; background: transparent; color: var(--muted); width: 28px; height: 24px; display: grid; place-items: center; border-radius: 7px; box-shadow: none; padding: 0; }
  .view-btn svg { width: 14px; height: 14px; }
  .view-btn.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-card); }
  /* Skills 列表：与 Agent 列表同源的真表格布局（复用 .table-scroll 边框圆角容器） */
  .skill-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: var(--fs-sm); background: var(--panel); }
  .skill-table th {
    text-align: left; font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
  }
  .skill-table th.st-name { width: 18%; padding-left: 36px; }
  .skill-table th.st-cat { width: 12%; }
  .skill-table th.st-usage { width: auto; }
  .skill-table th.st-status { width: 13%; text-align: right; }
  .skill-table th.st-ops { width: 4%; text-align: right; }
