<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Skill MCP Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13px;
    color: #1d1d1f;
    padding: 6px;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    background: rgba(250, 250, 252, 0.84);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 12px;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14), 0 10px 34px rgba(0, 0, 0, 0.24);
    overflow: hidden;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
  }
  .title { font-size: 13px; font-weight: 600; }
  .refresh {
    border: none;
    background: transparent;
    color: #007aff;
    font-size: 12px;
    padding: 2px 5px;
    border-radius: 5px;
    cursor: pointer;
  }
  .refresh:hover { background: rgba(0, 0, 0, 0.06); }
  .rows { padding: 2px 0 4px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    font-size: 12.5px;
  }
  .row .label { color: #3a3a3c; }
  .row .num { font-variant-numeric: tabular-nums; color: #8e8e93; font-weight: 500; }
  .row .num.active { color: #007aff; font-weight: 600; }
  .sep { height: 1px; background: rgba(0, 0, 0, 0.08); margin: 5px 0; }
  .list { max-height: 168px; overflow-y: auto; padding-bottom: 5px; }
  .list::-webkit-scrollbar { width: 5px; }
  .list::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.18); border-radius: 3px; }
  .item {
    display: flex;
    gap: 7px;
    align-items: baseline;
    padding: 3px 12px;
    font-size: 12px;
    line-height: 1.45;
  }
  .dot {
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #8e8e93;
    position: relative;
    top: -1px;
  }
  .dot.added { background: #34c759; }
  .dot.removed { background: #ff3b30; }
  .dot.changed { background: #ff9500; }
  .item .nm { color: #1d1d1f; font-weight: 500; }
  .item .detail { color: #8e8e93; }
  .empty { padding: 12px; text-align: center; color: #8e8e93; font-size: 12px; }
  .foot { padding: 4px 10px 10px; }
  .btn {
    width: 100%;
    border: none;
    border-radius: 7px;
    padding: 6px 0;
    background: rgba(0, 0, 0, 0.06);
    color: #1d1d1f;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: rgba(0, 0, 0, 0.1); }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="title">变更摘要</span>
      <button class="refresh" id="refresh">刷新</button>
    </div>
    <div id="content"><div class="empty">加载中...</div></div>
    <div class="foot"><button class="btn" id="open-full">打开完整面板</button></div>
  </div>

<script>
const DIMS = [
  ["agents", "IDE/Agent"],
  ["mcp", "MCP"],
  ["skills", "Skill"],
  ["hooks", "Hook"],
];

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function fitWindow() {
  const panel = document.querySelector(".panel");
  if (!panel) return;
  // 等一帧让浏览器完成布局（backdrop-filter 等可能影响测量）
  await new Promise(function (r) {
    requestAnimationFrame(r);
  });
  const h = Math.ceil(panel.getBoundingClientRect().height) + 12;
  try {
    const tw = window.__TAURI__.window;
    await tw.getCurrentWindow().setSize(new tw.LogicalSize(320, Math.max(h, 200)));
  } catch (e) {
    /* 尺寸调整失败不影响内容展示 */
  }
}

async function render(body) {
  const content = document.getElementById("content");
  content.innerHTML = body;
  await fitWindow();
}

function renderDiff(diff) {
  if (!diff) {
    render('<div class="empty">无法获取快照</div>');
    return;
  }
  if (diff.is_first) {
    render('<div class="empty">首次快照，已保存基线</div>');
    return;
  }
  const summary = diff.summary || {};
  const dims = diff.dimensions || {};
  let total = 0;

  let html = '<div class="rows">';
  for (const pair of DIMS) {
    const n = summary[pair[0]] || 0;
    total += n;
    html +=
      '<div class="row"><span class="label">' +
      pair[1] +
      '</span><span class="num' +
      (n > 0 ? " active" : "") +
      '">' +
      n +
      "</span></div>";
  }
  html += "</div>";

  if (total === 0) {
    html += '<div class="sep"></div><div class="empty">无变更</div>';
    render(html);
    return;
  }

  const items = [];
  for (const dim of Object.keys(dims)) {
    const changes = dims[dim];
    if (!changes || !changes.length) continue;
    for (const c of changes) {
      const t = c.type || "";
      const cls = t.indexOf("added") >= 0 ? "added" : t.indexOf("removed") >= 0 ? "removed" : "changed";
      items.push(
        '<div class="item"><span class="dot ' +
          cls +
          '"></span><span><span class="nm">' +
          esc(c.name || "?") +
          '</span> <span class="detail">' +
          esc(c.detail || "") +
          "</span></span></div>"
      );
    }
  }
  if (items.length) {
    html += '<div class="sep"></div><div class="list">' + items.join("") + "</div>";
  }
  render(html);
}

async function loadSnapshot() {
  render('<div class="empty">检查中...</div>');
  try {
    const res = await window.__TAURI__.core.invoke("run_cli", {
      args: ["--snapshot", "--format", "json"],
    });
    const out = typeof res === "string" ? res : res && res.stdout ? res.stdout : "";
    // --snapshot --format json 只输出 diff 本身，直接解析整段
    let diff = null;
    try {
      diff = JSON.parse(out);
    } catch (e) {
      const lines = out.split("\n").filter(function (l) {
        return l.trim().charCodeAt(0) === 123;
      });
      diff = lines.length ? JSON.parse(lines[0]) : null;
    }
    renderDiff(diff);
  } catch (e) {
    render('<div class="empty">加载失败</div>');
  }
}

document.getElementById("refresh").addEventListener("click", loadSnapshot);
document.getElementById("open-full").addEventListener("click", async function () {
  try {
    await window.__TAURI__.core.invoke("show_main_window");
  } catch (e) {
    /* 主窗口打开失败时保持弹框 */
  }
});

window.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    try {
      window.__TAURI__.window.getCurrentWindow().hide();
    } catch (err) {
      /* 忽略 */
    }
  }
});

loadSnapshot();

// 供托盘点击时从 Rust 侧调用：弹框每次显示都取最新快照
window.__reloadPopover = loadSnapshot;
</script>
</body>
</html>
