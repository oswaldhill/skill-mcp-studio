<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Skill MCP Studio</title>
<style>
  /* ── Popover 自有 token 体系 ──────────────────────────────────
     规范说 popover 不复用管理台 token，但不等于不定义。
     此前所有取值裸写散落在样式里（14px/6px/8px/4px/2px 圆角、
     13/12/10/9/22px 字号、#1d1d1f/#34c759/#ff9500 等颜色），
     改一处要全文搜替换。现在集中定义，浅深两套同步。 */
  :root {
    color-scheme: light;
    /* 表面 */
    --pop-bg: rgba(248, 248, 250, 0.88);
    --pop-panel: rgba(255, 255, 255, 0.6);
    --pop-sep: rgba(0, 0, 0, 0.06);
    --pop-scrollbar: rgba(0, 0, 0, 0.15);
    --pop-btn-secondary-bg: rgba(0, 0, 0, 0.06);
    --pop-btn-secondary-hover: rgba(0, 0, 0, 0.1);
    --pop-refresh-hover: rgba(0, 122, 255, 0.08);
    /* 文字 */
    --pop-text: #1d1d1f;
    --pop-text-muted: #8e8e93;
    --pop-text-faint: #c0c0c5;
    --pop-text-zero: #c7c7cc;
    --pop-on-btn: #fff;
    /* 强调 */
    --pop-accent: #007aff;
    --pop-accent-strong: #0066d6;
    /* 语义 */
    --pop-ok: #34c759;
    --pop-warn: #ff9500;
    --pop-err: #ff3b30;
    --pop-gray: #c7c7cc;
    /* 阴影 */
    --pop-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 12px 40px rgba(0, 0, 0, 0.28);
    --pop-dot-glow-ok: 0 0 6px rgba(52, 199, 89, 0.4);
    --pop-dot-glow-warn: 0 0 6px rgba(255, 149, 0, 0.4);
    /* 字号 */
    --pop-fs-title: 13px;
    --pop-fs-body: 12px;
    --pop-fs-label: 10px;
    --pop-fs-badge: 9px;
    --pop-fs-value: 22px;
    /* 圆角 */
    --pop-r-panel: 14px;
    --pop-r-control: 8px;
    --pop-r-hair: 4px;
    --pop-r-pill: 50%;
    /* 间距 */
    --pop-gap-1: 4px;
    --pop-gap-2: 6px;
    --pop-gap-3: 8px;
    --pop-pad-body: 8px;
    --pop-pad-head: 12px 14px 8px;
    --pop-pad-grid: 0 10px 8px;
    --pop-pad-card: 8px 10px;
    --pop-pad-sep: 4px 14px;
    --pop-pad-item: 4px 14px;
    --pop-pad-empty: 10px 14px;
    --pop-pad-foot: 6px 12px 12px;
    /* 动效 */
    --pop-ease: ease-in-out;
  }
  html.dark {
    color-scheme: dark;
    --pop-bg: rgba(30, 30, 34, 0.88);
    --pop-panel: rgba(50, 50, 55, 0.6);
    --pop-sep: rgba(255, 255, 255, 0.08);
    --pop-scrollbar: rgba(255, 255, 255, 0.18);
    --pop-btn-secondary-bg: rgba(255, 255, 255, 0.08);
    --pop-btn-secondary-hover: rgba(255, 255, 255, 0.12);
    --pop-refresh-hover: rgba(0, 122, 255, 0.16);
    --pop-text: #f4f4f5;
    --pop-text-muted: #a1a1aa;
    --pop-text-faint: #71717a;
    --pop-text-zero: #3a3a3e;
    --pop-on-btn: #0a1220;
    --pop-accent: #60a5fa;
    --pop-accent-strong: #3b82f6;
    --pop-ok: #34c759;
    --pop-warn: #fbbf24;
    --pop-err: #f87171;
    --pop-gray: #52525b;
    --pop-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 12px 40px rgba(0, 0, 0, 0.5);
    --pop-dot-glow-ok: 0 0 6px rgba(52, 199, 89, 0.3);
    --pop-dot-glow-warn: 0 0 6px rgba(251, 191, 36, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: var(--pop-fs-title);
    color: var(--pop-text);
    padding: var(--pop-pad-body);
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    background: var(--pop-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-radius: var(--pop-r-panel);
    box-shadow: var(--pop-shadow);
    overflow: hidden;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--pop-pad-head);
  }
  .head-left { display: flex; align-items: center; gap: var(--pop-gap-3); }
  .status-dot {
    width: 8px; height: 8px; border-radius: var(--pop-r-pill);
    background: var(--pop-ok);
    box-shadow: var(--pop-dot-glow-ok);
  }
  .status-dot.alert { background: var(--pop-warn); box-shadow: var(--pop-dot-glow-warn); }
  /* 缓存态：灰点 + 轻微呼吸，表示「这是旧数据，正在刷新」 */
  .status-dot.stale { background: var(--pop-gray); box-shadow: none; animation: stalePulse 1.2s var(--pop-ease) infinite; }
  @keyframes stalePulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .title { font-size: var(--pop-fs-title); font-weight: 600; color: var(--pop-text); }
  .refresh {
    border: none; background: transparent; color: var(--pop-accent);
    font-size: var(--pop-fs-body); padding: 3px var(--pop-gap-3); border-radius: var(--pop-r-control); cursor: pointer;
  }
  .refresh:hover { background: var(--pop-refresh-hover); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--pop-gap-2);
    padding: var(--pop-pad-grid);
  }
  .card {
    background: var(--pop-panel);
    border-radius: var(--pop-r-control);
    padding: var(--pop-pad-card);
    display: flex;
    flex-direction: column;
    gap: var(--pop-gap-1);
  }
  .card-label {
    display: flex;
    align-items: center;
    gap: var(--pop-gap-1);
    font-size: var(--pop-fs-label);
    color: var(--pop-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 500;
  }
  .card-badge {
    font-size: var(--pop-fs-badge);
    font-weight: 700;
    color: var(--pop-on-btn);
    padding: 1px 4px;
    border-radius: var(--pop-r-hair);
    letter-spacing: 0;
  }
  .card-value {
    font-size: var(--pop-fs-value);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--pop-text);
    line-height: 1.2;
  }
  .card-value.zero { color: var(--pop-text-zero); }
  .sep { height: 1px; background: var(--pop-sep); margin: var(--pop-pad-sep); }
  .list { max-height: 140px; overflow-y: auto; padding: 2px 0 6px; }
  .list::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-thumb { background: var(--pop-scrollbar); border-radius: var(--pop-r-hair); }
  .item {
    display: flex; gap: var(--pop-gap-3); align-items: flex-start;
    padding: var(--pop-pad-item); font-size: var(--pop-fs-body); line-height: 1.4;
  }
  .dot {
    flex: 0 0 auto; width: 6px; height: 6px; border-radius: var(--pop-r-pill);
    background: var(--pop-text-muted); margin-top: 4px;
  }
  .dot.added { background: var(--pop-ok); }
  .dot.removed { background: var(--pop-err); }
  .dot.changed { background: var(--pop-warn); }
  .item .nm { color: var(--pop-text); font-weight: 500; }
  .item .detail { color: var(--pop-text-muted); }
  .empty-msg {
    padding: var(--pop-pad-empty);
    text-align: center;
    color: var(--pop-text-muted);
    font-size: var(--pop-fs-body);
  }
  .empty-msg .check {
    display: inline-flex; align-items: center; gap: 5px;
  }
  .empty-msg .check svg { width: 14px; height: 14px; }
  .meta {
    padding: var(--pop-pad-item);
    font-size: var(--pop-fs-label);
    color: var(--pop-text-faint);
    text-align: center;
  }
  .foot {
    padding: var(--pop-pad-foot);
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: var(--pop-r-control);
    padding: 7px 0;
    font-size: var(--pop-fs-body);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s var(--pop-ease);
  }
  .btn-primary {
    background: var(--pop-accent);
    color: var(--pop-on-btn);
  }
  .btn-primary:hover { background: var(--pop-accent-strong); }
  .btn-secondary {
    background: var(--pop-btn-secondary-bg);
    color: var(--pop-text);
  }
  .btn-secondary:hover { background: var(--pop-btn-secondary-hover); }

  /* 键盘可达性：无鼠标也能操作（UI 技能规范要求可见焦点环） */
  .refresh:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--pop-accent);
    outline-offset: 2px;
  }

  /* 尊重系统「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    .status-dot.stale { animation: none; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <div class="head-left">
        <span class="status-dot" id="status-dot"></span>
        <span class="title">Skill MCP Studio</span>
      </div>
      <button class="refresh" id="refresh">刷新</button>
    </div>
    <div id="content"><div class="empty-msg">加载中...</div></div>
    <div class="foot">
      <button class="btn btn-secondary" id="open-full">打开主面板</button>
    </div>
  </div>

<script>
const DIMS = [
  ["agents", "IDE/Agent", "var(--pop-accent)"],
  ["mcp", "MCP", "var(--pop-ok)"],
  ["skills", "Skill", "var(--pop-warn)"],
  ["hooks", "Hook", "var(--pop-accent)"],
];

// 供「打开主面板」决定落点：有变更 → 变更详情，无变更 → 概览。
// 声明在顶部：renderDiff 会写它，若留在文件末尾的 let 会触发 TDZ。
let LAST_HAD_CHANGES = false;

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function fitWindow() {
  const panel = document.querySelector(".panel");
  if (!panel) return;
  await new Promise(function (r) { requestAnimationFrame(r); });
  const h = Math.ceil(panel.getBoundingClientRect().height) + 16;
  try {
    const tw = window.__TAURI__.window;
    await tw.getCurrentWindow().setSize(new tw.LogicalSize(300, Math.max(h, 200)));
  } catch (e) { /* 忽略 */ }
}

async function render(body) {
  const content = document.getElementById("content");
  content.innerHTML = body;
  await fitWindow();
}

function renderDiff(diff, fromCache) {
  const dot = document.getElementById("status-dot");
  // 缓存渲染时状态点转灰并标记，避免用户把旧数据当成实时结果；
  // 非缓存路径先把 stale 类与提示清掉，否则提前 return 的分支
  // （!diff / is_first）会把「正在刷新」的提示残留下来。
  if (fromCache) {
    dot.className = "status-dot stale";
    dot.title = "显示的是上次结果，正在刷新";
  } else {
    dot.className = "status-dot";
    dot.title = "";
  }
  if (!diff) {
    dot.className = "status-dot alert";
    render('<div class="empty-msg">无法获取快照</div>');
    return;
  }
  if (diff.is_first) {
    dot.className = "status-dot";
    render('<div class="empty-msg">首次快照，已保存基线</div>');
    return;
  }
  const summary = diff.summary || {};
  const totals = diff.totals || {};
  const dims = diff.dimensions || {};
  let changed = 0;

  // 卡片主数字显示「当前数量」（totals），有变更时补一个变更数徽标。
  // 原因：无变更时 diff 的 summary 必然全为 0，只显示变更数会是一片 0，
  // 看不出系统规模。
  let html = '<div class="grid">';
  for (const pair of DIMS) {
    const key = pair[0];
    const n = totals[key] || 0;
    const delta = summary[key] || 0;
    changed += delta;
    const cls = n > 0 ? "" : "zero";
    let badge = "";
    if (delta > 0) {
      badge = '<span class="card-badge" style="background:' + pair[2] + '">+' + delta + "</span>";
    }
    html +=
      '<div class="card">' +
      '<span class="card-label">' + pair[1] + badge + '</span>' +
      '<span class="card-value ' + cls + '">' + n + '</span>' +
      "</div>";
  }
  html += "</div>";

  // 供「打开主面板」决定落点：有变更 → 变更详情，无变更 → 概览
  LAST_HAD_CHANGES = changed > 0;

  if (changed === 0) {
    dot.className = "status-dot";
    dot.title = "";
    html += '<div class="sep"></div>';
    html += '<div class="empty-msg"><span class="check">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="var(--pop-ok)" style="stroke: var(--pop-ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    html += ' 配置无变更</span></div>';
    render(html);
    return;
  }

  dot.className = "status-dot alert";
  dot.title = "";
  const items = [];
  for (const dim of Object.keys(dims)) {
    const changes = dims[dim];
    if (!changes || !changes.length) continue;
    for (const c of changes) {
      const t = c.type || "";
      const cls = t.indexOf("added") >= 0 ? "added" : t.indexOf("removed") >= 0 ? "removed" : "changed";
      items.push(
        '<div class="item"><span class="dot ' + cls + '"></span>' +
        '<span><span class="nm">' + esc(c.name || "?") + '</span> ' +
        '<span class="detail">' + esc(c.detail || "") + '</span></span></div>'
      );
    }
  }
  if (items.length) {
    html += '<div class="sep"></div><div class="list">' + items.join("") + "</div>";
  }
  render(html);
}

// 上次结果的本地缓存键。为什么要缓存：--snapshot 实测约 1.6 秒，
// 用户点开弹框若直接显示「检查中...」会有一段空等。改为先用上次结果
// 立即出图，再在后台刷新，感知延迟降到 0。
const CACHE_KEY = "sms.popover.lastDiff";

function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;   // 隐私模式/配额满时静默降级为无缓存
  }
}

function writeCache(diff) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(diff));
  } catch (e) {
    /* 写不进去不影响功能，只是下次仍需现算 */
  }
}

async function loadSnapshot(opts) {
  const showSpinner = opts && opts.spinner;
  const cached = readCache();
  // 有缓存就先渲染，用户立刻看到内容；没有才显示等待提示
  if (cached) {
    renderDiff(cached, true);
  } else if (showSpinner !== false) {
    render('<div class="empty-msg">检查中...</div>');
  }
  try {
    const res = await window.__TAURI__.core.invoke("run_cli", {
      args: ["--snapshot", "--format", "json"],
    });
    // run_cli 返回的是 JSON 字符串外壳 {code, stdout, stderr, cancelled}，
    // 真正的 diff 在 stdout 字段里（它是字符串，需要再解析一层）。
    let payload = res;
    if (typeof payload === "string") {
      try { payload = JSON.parse(payload); } catch (e) { payload = null; }
    }
    let out = "";
    if (payload && typeof payload.stdout === "string") {
      out = payload.stdout;
    } else if (typeof res === "string") {
      out = res;
    }
    let diff = null;
    try {
      diff = JSON.parse(out);
    } catch (e) {
      const lines = out.split("\n").filter(function (l) {
        return l.trim().charCodeAt(0) === 123;
      });
      diff = lines.length ? JSON.parse(lines[0]) : null;
    }
    if (diff) writeCache(diff);
    renderDiff(diff);
  } catch (e) {
    // 有缓存时保留旧内容而不是清空 —— 暂时拿不到新数据不该让界面变空
    if (!cached) render('<div class="empty-msg">加载失败</div>');
  }
}

document.getElementById("refresh").addEventListener("click", loadSnapshot);
// 有变更时直接落到「变更详情」并刷新那次对比，用户少点一次；
// 无变更时回概览，避免打开一个空页面。
document.getElementById("open-full").addEventListener("click", async function () {
  const page = LAST_HAD_CHANGES ? "changes" : "overview";
  try {
    await window.__TAURI__.core.invoke("show_main_window", { page: page });
  } catch (e) { /* 忽略 */ }
});

window.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    try { window.__TAURI__.window.getCurrentWindow().hide(); } catch (err) { /* 忽略 */ }
  }
});

loadSnapshot();
window.__reloadPopover = loadSnapshot;
</script>
</body>
</html>
