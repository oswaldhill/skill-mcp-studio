auto_discover:
  enabled: true
  exclude_paths:
  - ~/.skills-manager/skills
  - ~/.adal/skills
  - ~/.aider-desk/skills
  - ~/.augment/skills
  - ~/.bob/skills
  - ~/.cherrystudio/skills
  - ~/.clawdbot/skills
  - ~/.codeartsdoer/skills
  - ~/.codemaker/skills
  - ~/.codestudio/skills
  - ~/.commandcode/skills
  - ~/.config/crush/skills
  - ~/.config/devin/skills
  - ~/.config/goose/skills
  - ~/.factory/skills
  - ~/.forge/skills
  - ~/.iflow/skills
  - ~/.junie/skills
  - ~/.kilocode/skills
  - ~/.kimi/skills
  - ~/.kode/skills
  - ~/.mcpjam/skills
  - ~/.mux/skills
  - ~/.neovate/skills
  - ~/.openclaw/skills
  - ~/.openhands/skills
  - ~/.pochi/skills
  - ~/.qwen/skills
  - ~/.qwenworkcn/skills
  - ~/.roo/skills
  - ~/.rovodev/skills
  - ~/.trae-cn/builtin/*/skills
  - ~/.understand-anything-plugin/skills
  - ~/.vibe/skills
  - ~/.zencoder/skills
  - ~/.codebuddy/skills
  - ~/.gemini/skills
  - ~/.trae/skills
  - ~/.ghcp-appmod/skills
  - ~/.qoder/skills
  - ~/.continue/skills
  - ~/.kiro/skills
  - ~/.cline/skills
  - ~/.Trash/skills
  - ~/skills
  - ~/.qwencode/skills
  - ~/.qclaw/skills
  - ~/.hermes/skills
  - ~/.lingma/skills
  - ~/.dsh/skills
  scan_paths:
  - ~/.config/*/skills
  - ~/.*/skills
  - ~/.config/*/agent/skills
schema_version: 1
active_profile: generic-http

profile_sources:
- ~/.skills-manager/profiles.local.yaml
- data/local_overrides.yaml

profiles:
  # 占位端点 generic-http（https://example.internal/mcp）已于 2026-11-05 移除：
  #   · 端点库里它早已是 null（软删除标记），合并后根本不出现；
  #   · 但主干这份仍在，一旦本地覆盖层被清空，它就会**重新成为活动端点**，
  #     把所有客户端的 MCP 配置指向一个不存在的 example.internal 地址。
  # 现在真正的端点全部住在 ~/.skills-manager/profiles.local.yaml。
  #
  # 注意：``profiles:`` 在这里写 `{}` 而不是留空 —— 留空会解析成 null，
  # profile_loader 要求「非空映射」，null 与空映射都会让加载失败。
  # 写成 `{}` 后：主干不提供端点，端点全部由覆盖层提供，合并结果非空即可。
  {}
mcp_tools:
- name: Claude Code
  aliases: [claude, claude-code]
  install:
    app_bundles: [/Applications/Claude.app]
    commands: [claude]
    config_paths: [~/.claude.json, ~/.claude/settings.json]
  config_path: ~/.claude.json
  format: json
  mcp_key_path: [mcpServers]
  # 引用型凭据的注入位：~/.claude.json 支持根级 "env"，客户端启动时读取，
  # MCP server 子进程继承（--fix-mcp 写值，端点条目里仍只写引用）。
  mcp_root_env_style: env
  fix_supported: true
- name: Cursor
  aliases: [cursor]
  install:
    app_bundles: [/Applications/Cursor.app]
    commands: [cursor]
    config_paths: [~/.cursor/mcp.json]
  config_path: ~/.cursor/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  # 引用型凭据的注入位（同 Claude Code：根 "env" 块）。
  mcp_root_env_style: env
- name: WorkBuddy
  aliases: [workbuddy, codebuddy]
  install:
    app_bundles: [/Applications/WorkBuddy.app]
    commands: [workbuddy]
    config_paths: [~/.workbuddy/mcp.json]
  config_path: ~/.workbuddy/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  # 原生身份适配器管理凭据注入；5.9.3 不支持根 env 插值。
  native_identity_adapter: workbuddy
  fix_supported: true
- name: Codex
  aliases: [codex]
  install:
    # 新版 Codex 已并入 OpenAI ChatGPT 桌面应用（无独立 Codex.app，CLI 内嵌在
    # ChatGPT.app/Contents/Resources/codex）；同时保留旧独立安装形态的探测。
    app_bundles: [/Applications/Codex.app, /Applications/ChatGPT.app]
    commands: [codex, /Applications/ChatGPT.app/Contents/Resources/codex]
    config_paths: [~/.codex/config.toml]
  config_path: ~/.codex/config.toml
  format: toml
  mcp_key_path: [mcp_servers]
  # 全平台统一用端点自身的 name（hermes）作为 MCP key（2026-11-05 用户决定）。
  #
  # 这里曾声明 unified_name: hermes-unified。起因是该客户端当时有一条同名本地
  # stdio 桥（[mcp_servers.hermes] 指向 mcp_stdio_bridge.py），用独立 key 才能
  # 避免把它改写成 HTTP 形态。现已核实 Codex 中不再有该 stdio 桥，且
  # _render_toml / _render_json 遇到同名 stdio 条目会显式抛 McpEntryConflict
  # 并保持用户配置不动 —— 这层保护不再需要靠「换个名字」实现。
  #
  # 改名的副作用：先前写入的 hermes-unified 段会变成残留，切换必须按
  # 「先写新名字、再删旧名字」的顺序进行。
  fix_supported: true
- name: Reasonix
  aliases: [reasonix]
  install:
    app_bundles: [/Applications/Reasonix.app]
    commands: [reasonix]
    config_paths: [~/.reasonix/config.toml]
  config_path: ~/.reasonix/config.toml
  format: reasonix_toml
  mcp_key_path: [plugins]
  fix_supported: true
- name: OpenCode
  aliases: [opencode]
  install:
    commands: [opencode]
    config_paths: [~/.config/opencode/opencode.jsonc]
  config_path: ~/.config/opencode/opencode.jsonc
  format: jsonc
  mcp_key_path: [mcp]
  # OpenCode 的 MCP 条目是**判别联合**：官方 schema 里 McpRemoteConfig 要求
  # required [type, url]、McpLocalConfig 要求 [type, command]，缺 type 会让**整份
  # 配置**被判无效（实测 `opencode debug config` 报 "Expected { type: local } |
  # { type: remote }, got {"url": ...} / Missing key ...enabled"）。而 mcpServers 型
  # 客户端（Claude Code / Cursor / WorkBuddy）的条目只需 url，多写 type 反而多余。
  # 故连接类型按客户端声明，而不是在渲染层统一硬编码。
  mcp_entry_type: remote
  # 引用型凭据注入位：OpenCode 读配置根的 "env"，据此设置 MCP server 的环境。
  mcp_root_env_style: env
  # 全平台统一用端点自身的 name（hermes）作为 MCP key（2026-11-05）。
  #
  # 这里曾声明 unified_name: hermes-unified + legacy_names: [hermes]，起因是
  # 该客户端当时有一条名为 hermes 的本地 stdio 桥（hermes-bridge.py 指向 NAS
  # 网关）。2026-11-05 复核 opencode.json：条目只有 CodeGraphContext(stdio) /
  # hermes-unified / K8s-uat，**没有名为 hermes 的桥** —— 该桥从未接入本客户端，
  # 声明已过时。去掉后与其它客户端同名；若将来真的把 hermes 桥接进来，
  # 写入路径会显式抛 McpEntryConflict（不会静默覆盖）。
  fix_supported: true
- name: DeepSeek Harness
  type: AI Agent
  aliases: [dsh, DSH, deepseek-dsh, dsh-web, deepseek-harness, deepseek]
  install:
    # 桌面 app 现名 /Applications/DeepSeek Harness.app（bundle id
    # com.deepseek.harness.local）；旧名 DeepSeek AI Assistant.app 保留作兜底。
    # commands 除裸名外补 Homebrew 绝对路径：GUI 壳从 Finder 启动时继承 launchd
    # 最小 PATH（没有 /opt/homebrew/bin），只写裸名 dsh 会被误判成「仅配置」。
    app_bundles: [/Applications/DeepSeek Harness.app, /Applications/DeepSeek AI Assistant.app]
    commands: [dsh, /opt/homebrew/bin/dsh]
    config_paths: [~/.dsh/settings.yaml, ~/.dsh/profiles/desktop/cordis.patch.yml, ~/.dsh/profiles/web/cordis.patch.yml, ~/.dsh/mcp.json]
  config_path: ~/.dsh/profiles/desktop/cordis.patch.yml
  format: cordis_yaml
  mcp_key_path: [hermes]
  # 桌面原生配置为主；web 与旧 JSON 仅作为只读发现候选。
  # 原生身份写入由 native adapter 管理，不走通用 --fix-mcp。
  native_identity_adapter: deepseek-harness
  config_candidates:
    - path: ~/.dsh/profiles/web/cordis.patch.yml
      format: cordis_yaml
      key_path: [hermes]
    - path: ~/.dsh/mcp.json
      format: json
      key_path: [mcpServers]
  fix_supported: true
# 已知非技能消费客户端：其 skills 链接存在（同步脚本批量建立），但客户端本身
# 不按技能消费，审计不应报 UNMANAGED 判不合规。与 auto_discover.exclude_paths
# 的区别：豁免名单保留扫描可见性（L2 仍可报链接状态），仅不计入未纳管。
# - CC Switch：Claude Code/Codex 提供方切换器（CC Switch.app），非 AI Agent
# - ima.copilot：已注册于下方 tools 段（腾讯 ima，~/.copilot 目录，L2 管理其链接）
unmanaged_exempt:
- CC Switch
tools:
- backup_suffix: .bak
  name: OpenCode
  skills_paths:
  - ~/.config/opencode/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Cursor
  skills_paths:
  - ~/.cursor/skills
  type: AI IDE
- backup_suffix: .bak
  name: Claude Code
  skills_paths:
  - ~/.claude/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: WorkBuddy
  skills_paths:
  - ~/.workbuddy/skills
  type: AI Assistant
- backup_suffix: .bak
  name: TRAE
  skills_paths:
  - ~/.trae-cn/skills
  type: AI IDE
- backup_suffix: .bak
  name: DeepSeek Harness
  aliases: [dsh, DSH, deepseek-harness]
  skills_paths:
  - ~/.dsh/skills
  type: AI Agent
- backup_suffix: .bak
  name: Codex
  skills_paths:
  - ~/.codex/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Reasonix
  skills_paths:
  - ~/.reasonix/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: ima.copilot
  aliases: [copilot, .copilot, ima-copilot, github-copilot]
  install:
    app_bundles: [/Applications/ima.copilot.app]
    config_paths: [~/.copilot/config.json]
  skills_paths:
  - ~/.copilot/skills
  type: AI Assistant
# 非 IDE/Agent：供应商切换器 + 本地代理（com.ccswitch.desktop），给 Claude Code /
# Codex / Gemini / OpenCode 切换配置，自身不做推理、不跑 agent 循环，也不消费 MCP
# （它是把 MCP「注入」到别的客户端）。它同时带技能管理功能，故 ~/.cc-switch/skills
# 是统一技能库的挂载点。`non_agent: true` 的语义（见 management_snapshot）：只在
# 技能审计里可见，不进 IDE/Agent 列表与统计，也不进 MCP 面板。
# name 归一化后与自动发现写入的 `.cc-switch` 同名（都归一为 ccswitch），因此这里的
# 声明会与发现条目字段级合并，顺带修掉「显示成带点的目录名」那个问题。
- backup_suffix: .bak
  name: CC Switch
  aliases: [cc-switch, .cc-switch, ccswitch]
  non_agent: true
  install:
    app_bundles: [/Applications/CC Switch.app]
  skills_paths:
  - ~/.cc-switch/skills
  type: 配置工具
unified_skills_dir: ~/.skills-manager/skills

# ── 后台巡检设置（Phase D）──────────────────────────────────
# patrol_enabled：后台巡检总开关，默认关闭；启用后每隔 patrol_interval_minutes
#   自动运行一次 --snapshot，检测到变更时更新托盘图标状态。
# patrol_interval_minutes：巡检间隔（分钟），默认 15，最小 5。
settings:
  patrol_enabled: false
  patrol_interval_minutes: 15
