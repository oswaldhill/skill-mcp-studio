auto_discover:
  enabled: true
  exclude_paths:
  - ~/.skills-manager/skills
  - ~/.adal/skills
  - ~/.aider-desk/skills
  - ~/.augment/skills
  - ~/.bob/skills
  - ~/.cherrystudio/skills
  - ~/.clawdbot/skills
  - ~/.codeartsdoer/skills
  - ~/.codemaker/skills
  - ~/.codestudio/skills
  - ~/.commandcode/skills
  - ~/.config/crush/skills
  - ~/.config/devin/skills
  - ~/.config/goose/skills
  - ~/.factory/skills
  - ~/.forge/skills
  - ~/.iflow/skills
  - ~/.junie/skills
  - ~/.kilocode/skills
  - ~/.kimi/skills
  - ~/.kode/skills
  - ~/.mcpjam/skills
  - ~/.mux/skills
  - ~/.neovate/skills
  - ~/.openclaw/skills
  - ~/.openhands/skills
  - ~/.pochi/skills
  - ~/.qwen/skills
  - ~/.qwenworkcn/skills
  - ~/.roo/skills
  - ~/.rovodev/skills
  - ~/.trae-cn/builtin/*/skills
  - ~/.understand-anything-plugin/skills
  - ~/.vibe/skills
  - ~/.zencoder/skills
  - ~/.codebuddy/skills
  - ~/.gemini/skills
  - ~/.trae/skills
  - ~/.ghcp-appmod/skills
  - ~/.qoder/skills
  - ~/.continue/skills
  - ~/.kiro/skills
  - ~/.cline/skills
  - ~/.Trash/skills
  - ~/skills
  - ~/.qwencode/skills
  - ~/.qclaw/skills
  - ~/.hermes/skills
  - ~/.lingma/skills
  - ~/.dsh/skills
  scan_paths:
  - ~/.config/*/skills
  - ~/.*/skills
  - ~/.config/*/agent/skills
schema_version: 1
active_profile: generic-http

profile_sources:
- ~/.skills-manager/profiles.local.yaml
- data/local_overrides.yaml

profiles:
  generic-http:
    name: my-mcp
    url: https://example.internal/mcp
    transport: streamable-http
    url_policy: strict
    required_capabilities: {}
mcp_tools:
- name: Claude Code
  aliases: [claude, claude-code]
  install:
    app_bundles: [/Applications/Claude.app]
    commands: [claude]
    config_paths: [~/.claude.json, ~/.claude/settings.json]
  config_path: ~/.claude.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.claude/settings.json
- name: Cursor
  aliases: [cursor]
  install:
    app_bundles: [/Applications/Cursor.app]
    commands: [cursor]
    config_paths: [~/.cursor/mcp.json]
  config_path: ~/.cursor/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.cursor/hooks.json
- name: WorkBuddy
  aliases: [workbuddy, codebuddy]
  install:
    app_bundles: [/Applications/WorkBuddy.app]
    commands: [workbuddy]
    config_paths: [~/.workbuddy/mcp.json]
  config_path: ~/.workbuddy/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.workbuddy/settings.json
- name: Codex
  aliases: [codex]
  install:
    # 新版 Codex 已并入 OpenAI ChatGPT 桌面应用（无独立 Codex.app，CLI 内嵌在
    # ChatGPT.app/Contents/Resources/codex）；同时保留旧独立安装形态的探测。
    app_bundles: [/Applications/Codex.app, /Applications/ChatGPT.app]
    commands: [codex, /Applications/ChatGPT.app/Contents/Resources/codex]
    config_paths: [~/.codex/config.toml]
  config_path: ~/.codex/config.toml
  format: toml
  mcp_key_path: [mcp_servers]
  # Codex 已有本地 hermes stdio 桥（~/.codex/config.toml 的 [mcp_servers.hermes]
  # 指向 hermes 网关的 mcp_stdio_bridge.py）。统一端点必须用独立 key 写入，否则会
  # 命中同名桥并把它改写成 HTTP 形态 —— 那既破坏本地桥，又因改写后 url 校验不过
  # 而整条修复回滚（实测报 "validation failed; original configuration was rolled
  # back"）。与 OpenCode 同一处理。
  unified_name: hermes-unified
  fix_supported: true
  hooks_config_path: ~/.codex/hooks.json
- name: Reasonix
  aliases: [reasonix]
  install:
    app_bundles: [/Applications/Reasonix.app]
    commands: [reasonix]
    config_paths: [~/.reasonix/config.toml]
  config_path: ~/.reasonix/config.toml
  format: reasonix_toml
  mcp_key_path: [plugins]
  fix_supported: true
- name: OpenCode
  aliases: [opencode]
  install:
    commands: [opencode]
    config_paths: [~/.config/opencode/opencode.jsonc]
  config_path: ~/.config/opencode/opencode.jsonc
  format: jsonc
  mcp_key_path: [mcp]
  # OpenCode 的 MCP 条目是**判别联合**：官方 schema 里 McpRemoteConfig 要求
  # required [type, url]、McpLocalConfig 要求 [type, command]，缺 type 会让**整份
  # 配置**被判无效（实测 `opencode debug config` 报 "Expected { type: local } |
  # { type: remote }, got {"url": ...} / Missing key ...enabled"）。而 mcpServers 型
  # 客户端（Claude Code / Cursor / WorkBuddy）的条目只需 url，多写 type 反而多余。
  # 故连接类型按客户端声明，而不是在渲染层统一硬编码。
  mcp_entry_type: remote
  # OpenCode 已有本地 hermes stdio 桥（指向 NAS 网关），统一端点用独立 key 写入，避免覆盖本地桥
  unified_name: hermes-unified
  # 本地 stdio 桥条目名为 "hermes"（hermes-bridge.py 指向 NAS 网关），与统一端点
  # hermes-unified 并存属待收口遗留：声明为按工具 legacy 名，审计可见，
  # --remove-legacy-mcp（活体验证安全门）清理。该名与其它客户端的正典名冲突，
  # 故只能声明在工具级，不进 profile 的 legacy_names。
  legacy_names: [hermes]
  fix_supported: true
  hooks_config_path: ~/.config/opencode/opencode.jsonc
- name: DeepSeek Harness
  type: AI Agent
  aliases: [dsh, DSH, deepseek-dsh, dsh-web, deepseek-harness, deepseek]
  install:
    # 桌面 app 现名 /Applications/DeepSeek Harness.app（bundle id
    # com.deepseek.harness.local）；旧名 DeepSeek AI Assistant.app 保留作兜底。
    # commands 除裸名外补 Homebrew 绝对路径：GUI 壳从 Finder 启动时继承 launchd
    # 最小 PATH（没有 /opt/homebrew/bin），只写裸名 dsh 会被误判成「仅配置」。
    app_bundles: [/Applications/DeepSeek Harness.app, /Applications/DeepSeek AI Assistant.app]
    commands: [dsh, /opt/homebrew/bin/dsh]
    config_paths: [~/.dsh/settings.yaml, ~/.dsh/profiles/web/cordis.patch.yml, ~/.dsh/mcp.json]
  config_path: ~/.dsh/profiles/web/cordis.patch.yml
  format: cordis_yaml
  mcp_key_path: [hermes]
  # 多路径回退：本机实际统一端点写在 ~/.dsh/mcp.json（标准 json mcpServers），
  # 而远端 cordis 机器写在 cordis.patch.yml（cordis_yaml）。任一命中即判 configured，
  # 主路径仍是 cordis.patch.yml（--fix-mcp 写入目标不变）。
  config_candidates:
    - path: ~/.dsh/mcp.json
      format: json
      key_path: [mcpServers]
  fix_supported: true
# 已知非技能消费客户端：其 skills 链接存在（同步脚本批量建立），但客户端本身
# 不按技能消费，审计不应报 UNMANAGED 判不合规。与 auto_discover.exclude_paths
# 的区别：豁免名单保留扫描可见性（L2 仍可报链接状态），仅不计入未纳管。
# - CC Switch：Claude Code/Codex 提供方切换器（CC Switch.app），非 AI Agent
# - ima.copilot：已注册于下方 tools 段（腾讯 ima，~/.copilot 目录，L2 管理其链接）
unmanaged_exempt:
- CC Switch
tools:
- backup_suffix: .bak
  name: OpenCode
  skills_paths:
  - ~/.config/opencode/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Cursor
  skills_paths:
  - ~/.cursor/skills
  type: AI IDE
- backup_suffix: .bak
  name: Claude Code
  skills_paths:
  - ~/.claude/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: WorkBuddy
  skills_paths:
  - ~/.workbuddy/skills
  type: AI Assistant
- backup_suffix: .bak
  name: TRAE
  skills_paths:
  - ~/.trae-cn/skills
  type: AI IDE
- backup_suffix: .bak
  name: DeepSeek Harness
  aliases: [dsh, DSH, deepseek-harness]
  skills_paths:
  - ~/.dsh/skills
  type: AI Agent
- backup_suffix: .bak
  name: Codex
  skills_paths:
  - ~/.codex/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Reasonix
  skills_paths:
  - ~/.reasonix/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: ima.copilot
  aliases: [copilot, .copilot, ima-copilot, github-copilot]
  install:
    app_bundles: [/Applications/ima.copilot.app]
    config_paths: [~/.copilot/config.json]
  skills_paths:
  - ~/.copilot/skills
  type: AI Assistant
# 非 IDE/Agent：供应商切换器 + 本地代理（com.ccswitch.desktop），给 Claude Code /
# Codex / Gemini / OpenCode 切换配置，自身不做推理、不跑 agent 循环，也不消费 MCP
# （它是把 MCP「注入」到别的客户端）。它同时带技能管理功能，故 ~/.cc-switch/skills
# 是统一技能库的挂载点。`non_agent: true` 的语义（见 management_snapshot）：只在
# 技能审计里可见，不进 IDE/Agent 列表与统计，也不进 MCP 面板。
# name 归一化后与自动发现写入的 `.cc-switch` 同名（都归一为 ccswitch），因此这里的
# 声明会与发现条目字段级合并，顺带修掉「显示成带点的目录名」那个问题。
- backup_suffix: .bak
  name: CC Switch
  aliases: [cc-switch, .cc-switch, ccswitch]
  non_agent: true
  install:
    app_bundles: [/Applications/CC Switch.app]
  skills_paths:
  - ~/.cc-switch/skills
  type: 配置工具
unified_skills_dir: ~/.skills-manager/skills

# ── Hook 管理域（参照 mcp_tools / tools 范式）──────────────────────────
# 各 IDE/Agent 的生命周期 hook 配置位置、事件签名与标准注入模板。
# 此前 ai_memory_checker.AI_MEMORY_HOOKS_PATHS 是硬编码，现提升为声明式
# 配置：management_snapshot 优先读本段产出 hooks inventory，hooks_fixer
# 据此写入标准 hook 模板（backup → atomic-write → validate → rollback）。
# mcp_tools[].hooks_config_path 作为兼容字段保留，本段为权威来源。
hooks:
  # ── 规范事件词表（canonical）─────────────────────────────────────
  # GUI「Hook 事件」可勾选的**全集**：跨客户端归一的规范名（PascalCase）。
  # 各客户端用它自己的命名写在 hooks.clients[].events（该客户端**能力全集**）里；
  # 写入时按 event_format 转名 + 按能力过滤（core/hooks_fixer.py）—— 只写对方
  # 真正认的事件，不会把 Cursor 独有的 BeforeTabFileRead 写进 Claude Code。
  #
  # 取值来源（2026-10-12 调研，逐客户端以**官方文档**为准、本机配置为旁证）：
  #   Claude Code 33 / WorkBuddy 29 / Cursor 21 / Codex 12 / TRAE 6（官方）；
  #   本表是这些集合的并集。OpenCode 走 TS 插件（无 JSON hooks），其钩子不在此表。
  events:
  # — 会话生命周期 —
  - name: SessionStart
    group: 会话生命周期
    description: 会话开始 / 恢复
  - name: SessionEnd
    group: 会话生命周期
    description: 会话结束
  - name: Setup
    group: 会话生命周期
    description: 一次性初始化（--init-only 等）
  - name: Stop
    group: 会话生命周期
    description: 本轮响应结束
  - name: StopFailure
    group: 会话生命周期
    description: 本轮因 API 错误结束
  - name: FinalStop
    group: 会话生命周期
    description: 轮次到达最终终态（WorkBuddy 独有）
  - name: Interrupt
    group: 会话生命周期
    description: 用户中断进行中的回合
  # — 提示词 —
  - name: UserPromptSubmit
    group: 提示词
    description: 用户提交提示词
  - name: UserPromptExpansion
    group: 提示词
    description: 命令 / 斜杠命令展开为提示词
  - name: BeforeSubmitPrompt
    group: 提示词
    description: 提交提示词前（可拦截）
  # — 工具调用 —
  - name: PreToolUse
    group: 工具调用
    description: 工具调用前（可拦截 / 改写入参）
  - name: PostToolUse
    group: 工具调用
    description: 工具调用成功后
  - name: PostToolUseFailure
    group: 工具调用
    description: 工具调用失败后
  - name: PostToolBatch
    group: 工具调用
    description: 一批并行工具调用全部结束后
  - name: PermissionRequest
    group: 工具调用
    description: 需要权限决策时
  - name: PermissionDenied
    group: 工具调用
    description: 权限被自动拒绝后
  # — shell / MCP / 文件 —
  - name: BeforeShellExecution
    group: shell / MCP / 文件
    description: shell 命令执行前
  - name: AfterShellExecution
    group: shell / MCP / 文件
    description: shell 命令执行后
  - name: BeforeMCPExecution
    group: shell / MCP / 文件
    description: MCP 工具调用前
  - name: AfterMCPExecution
    group: shell / MCP / 文件
    description: MCP 工具调用后
  - name: BeforeReadFile
    group: shell / MCP / 文件
    description: 读取文件前（可拒绝）
  - name: AfterFileEdit
    group: shell / MCP / 文件
    description: 编辑文件后
  - name: BeforeTabFileRead
    group: shell / MCP / 文件
    description: 行内补全读取文件前（Cursor Tab）
  - name: AfterTabFileEdit
    group: shell / MCP / 文件
    description: 行内补全编辑文件后（Cursor Tab）
  - name: FileChanged
    group: shell / MCP / 文件
    description: 被监视的文件在磁盘上变更
  # — 子代理 / 任务 —
  - name: SubagentStart
    group: 子代理 / 任务
    description: 子代理启动
  - name: SubagentStop
    group: 子代理 / 任务
    description: 子代理结束
  - name: TaskCreated
    group: 子代理 / 任务
    description: 任务创建
  - name: TaskCompleted
    group: 子代理 / 任务
    description: 任务完成
  - name: TeammateIdle
    group: 子代理 / 任务
    description: 团队成员即将进入空闲
  # — 上下文压缩 / 模型 —
  - name: PreCompact
    group: 上下文压缩 / 模型
    description: 上下文压缩前
  - name: PostCompact
    group: 上下文压缩 / 模型
    description: 上下文压缩后
  - name: PreModelSwitch
    group: 上下文压缩 / 模型
    description: 模型切换前
  - name: PostModelSwitch
    group: 上下文压缩 / 模型
    description: 模型切换后
  # — 观察 / 通知 —
  - name: Notification
    group: 观察 / 通知
    description: 发送通知时
  - name: MessageDisplay
    group: 观察 / 通知
    description: 助手消息显示到界面时
  - name: AfterAgentResponse
    group: 观察 / 通知
    description: 助手完成一条消息
  - name: AfterAgentThought
    group: 观察 / 通知
    description: 完成一个思考块
  # — 指令 / 配置 / 目录 —
  - name: InstructionsLoaded
    group: 指令 / 配置 / 目录
    description: 指令文件（CLAUDE.md 等）加载
  - name: ConfigChange
    group: 指令 / 配置 / 目录
    description: 配置文件在会话期间变更
  - name: CwdChanged
    group: 指令 / 配置 / 目录
    description: 工作目录变更
  - name: DirectoryAdded
    group: 指令 / 配置 / 目录
    description: 会话中途新增工作目录
  - name: WorkspaceOpen
    group: 指令 / 配置 / 目录
    description: 打开工作区（Cursor App 生命周期）
  - name: WorktreeCreate
    group: 指令 / 配置 / 目录
    description: 创建工作树
  - name: WorktreeRemove
    group: 指令 / 配置 / 目录
    description: 移除工作树
  # — MCP 交互 —
  - name: Elicitation
    group: MCP 交互
    description: MCP 服务器请求用户输入
  - name: ElicitationResult
    group: MCP 交互
    description: 用户响应回传 MCP 服务器前

  # 各客户端的 hook 配置位置、事件命名规范与**能力全集**。
  # events  = 该客户端支持的全部事件（用它自己的命名）→ GUI 展示 + 写入校验
  # scopes  = 分层作用域目录（用户级 / 项目级 / 本地级 / 托管级）→ GUI 展示
  # entry_style = 事件条目的结构形态，两套**不可混用**（本机实测）：
  #   nested → {matcher, hooks: [{type, command}]}（Claude Code / TRAE / Codex / WorkBuddy）
  #   flat   → {type, command, matcher}（Cursor）
  clients:
  - name: Claude Code
    config_path: ~/.claude/settings.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    entry_style: nested
    fix_supported: true
    note: Claude Code 生命周期 hooks（settings.json；官方 33 个事件）
    scopes:
    - id: user
      label: 用户级
      config_path: ~/.claude/settings.json
    - id: project
      label: 项目级
      config_path: <项目根>/.claude/settings.json
    - id: local
      label: 项目本地级
      config_path: <项目根>/.claude/settings.local.json
    - id: managed
      label: 企业托管策略级
      config_path: /Library/Application Support/ClaudeCode/managed-settings.json
    events: [SessionStart, Setup, UserPromptSubmit, UserPromptExpansion, PreToolUse,
             PermissionRequest, PermissionDenied, PostToolUse, PostToolUseFailure,
             PostToolBatch, Notification, MessageDisplay, SubagentStart, SubagentStop,
             TaskCreated, TaskCompleted, Stop, StopFailure, TeammateIdle,
             InstructionsLoaded, ConfigChange, CwdChanged, DirectoryAdded, FileChanged,
             WorktreeCreate, WorktreeRemove, PreCompact, PostCompact, PreModelSwitch,
             PostModelSwitch, Elicitation, ElicitationResult, SessionEnd]
    template:
      SessionStart: ai-memory hook --event session_start
      SessionEnd: ai-memory hook --event session_end
      Stop: ai-memory hook --event stop
      UserPromptSubmit: ai-memory hook --event user_prompt_submit
      PreCompact: ai-memory hook --event pre_compact
      SubagentStop: ai-memory hook --event subagent_stop
  - name: Cursor
    config_path: ~/.cursor/hooks.json
    format: json
    hook_key_path: [hooks]
    event_format: camel_case
    entry_style: flat
    fix_supported: true
    note: Cursor 生命周期 hooks（hooks.json；官方 21 个事件，条目为扁平结构）
    scopes:
    - id: user
      label: 用户级
      config_path: ~/.cursor/hooks.json
    - id: project
      label: 项目级
      config_path: <项目根>/.cursor/hooks.json
    events: [sessionStart, sessionEnd, preToolUse, postToolUse, postToolUseFailure,
             subagentStart, subagentStop, beforeShellExecution, afterShellExecution,
             beforeMCPExecution, afterMCPExecution, beforeReadFile, afterFileEdit,
             beforeSubmitPrompt, preCompact, stop, afterAgentResponse,
             afterAgentThought, beforeTabFileRead, afterTabFileEdit, workspaceOpen]
    template:
      sessionStart: ai-memory hook --event session_start
      sessionEnd: ai-memory hook --event session_end
      stop: ai-memory hook --event stop
      beforeSubmitPrompt: ai-memory hook --event user_prompt_submit
      preCompact: ai-memory hook --event pre_compact
  - name: WorkBuddy
    config_path: ~/.workbuddy/settings.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    entry_style: nested
    fix_supported: true
    note: WorkBuddy / CodeBuddy 生命周期 hooks（settings.json；Claude 派生，29 个事件）
    scopes:
    - id: user
      label: 用户级（桌面产品）
      config_path: ~/.workbuddy/settings.json
    - id: user_legacy
      label: 用户级（CodeBuddy Code CLI）
      config_path: ~/.codebuddy/settings.json
    - id: project
      label: 项目级
      config_path: <项目根>/.codebuddy/settings.json
    - id: project_local
      label: 项目本地级
      config_path: <项目根>/.codebuddy/settings.local.json
    events: [SessionStart, Setup, UserPromptSubmit, UserPromptExpansion, PreToolUse,
             PermissionRequest, PermissionDenied, PostToolUse, PostToolUseFailure,
             Notification, SubagentStart, SubagentStop, TaskCreated, TaskCompleted,
             Stop, StopFailure, FinalStop, TeammateIdle, InstructionsLoaded,
             ConfigChange, CwdChanged, FileChanged, WorktreeCreate, WorktreeRemove,
             PreCompact, PostCompact, Elicitation, ElicitationResult, SessionEnd]
    template:
      SessionStart: ai-memory hook --event session_start
      SessionEnd: ai-memory hook --event session_end
      Stop: ai-memory hook --event stop
      UserPromptSubmit: ai-memory hook --event user_prompt_submit
      PreCompact: ai-memory hook --event pre_compact
      SubagentStop: ai-memory hook --event subagent_stop
  - name: Codex
    config_path: ~/.codex/hooks.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    entry_style: nested
    fix_supported: true
    note: Codex 生命周期 hooks（hooks.json；官方 12 个事件，需 [features].hooks = true）
    scopes:
    - id: user
      label: 用户级
      config_path: ~/.codex/hooks.json
    - id: user_inline
      label: 用户级（config.toml 内联 [hooks]）
      config_path: ~/.codex/config.toml
    - id: project
      label: 项目级
      config_path: <repo>/.codex/hooks.json
    events: [SessionStart, SessionEnd, SubagentStart, PreToolUse, PermissionRequest,
             PostToolUse, PreCompact, PostCompact, UserPromptSubmit, SubagentStop,
             Stop, Interrupt]
    template:
      SessionStart: ai-memory hook --event session_start
      Stop: ai-memory hook --event stop
      UserPromptSubmit: ai-memory hook --event user_prompt_submit
      PreCompact: ai-memory hook --event pre_compact
      PreToolUse: ai-memory hook --event pre_tool_use
      PostToolUse: ai-memory hook --event post_tool_use
      SubagentStop: ai-memory hook --event subagent_stop
  - name: TRAE
    config_path: ~/.trae-cn/hooks.json
    format: json
    hook_key_path: [hooks]
    # 官方规范为 PascalCase（docs.trae.cn 六类事件）。本机 ~/.trae-cn/hooks.json 里的
    # camelCase 键是第三方桥接工具写入的，不是 TRAE 的原生事件 ——
    # 故此处按官方规范写 pascal_case（2026-10-12 修正，此前误配为 camel_case）。
    event_format: pascal_case
    entry_style: nested
    fix_supported: true
    note: TRAE（国内版）生命周期 hooks（hooks.json；官方 6 个事件，PascalCase）
    scopes:
    - id: user
      label: 用户级（全局 Hook）
      config_path: ~/.trae-cn/hooks.json
    - id: project
      label: 项目级
      config_path: <项目根>/.trae/hooks.json
    events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop, Notification]
    template:
      SessionStart: ai-memory hook --event session_start
      Stop: ai-memory hook --event stop
      UserPromptSubmit: ai-memory hook --event user_prompt_submit
      PreToolUse: ai-memory hook --event pre_tool_use
      PostToolUse: ai-memory hook --event post_tool_use
      Notification: ai-memory hook --event notification
  - name: OpenCode
    config_path: ~/.config/opencode/plugins/ai-memory.ts
    format: plugin
    hook_key_path: []
    event_format: lowercase_dotted
    fix_supported: false
    plugin: true
    note: OpenCode 用 TS 插件（plugins/ai-memory.ts）而非 JSON hooks；下列为插件钩子，仅供查看，不支持模板注入
    scopes:
    - id: user
      label: 用户级（全局插件目录，自动加载）
      config_path: ~/.config/opencode/plugins/
    - id: project
      label: 项目级（插件目录，自动加载）
      config_path: .opencode/plugins/
    - id: user_config
      label: 用户级（全局配置的插件数组）
      config_path: ~/.config/opencode/opencode.json
    events: [event, config, dispose, chat.message, tool.execute.before,
             tool.execute.after, permission.ask, shell.env, command.execute.before,
             experimental.chat.system.transform, experimental.session.compacting]
# ── 后台巡检设置（Phase D）──────────────────────────────────
# patrol_enabled：后台巡检总开关，默认关闭；启用后每隔 patrol_interval_minutes
#   自动运行一次 --snapshot，检测到变更时更新托盘图标状态。
# patrol_interval_minutes：巡检间隔（分钟），默认 15，最小 5。
settings:
  patrol_enabled: false
  patrol_interval_minutes: 15
  hook_events:
  - SessionStart
  - SessionEnd
  - Setup
  - Stop
  - StopFailure
  - FinalStop
  - Interrupt
  - UserPromptSubmit
  - UserPromptExpansion
  - BeforeSubmitPrompt
  - PreToolUse
  - PostToolUse
  - PostToolUseFailure
  - PostToolBatch
  - PermissionRequest
  - PermissionDenied
  - BeforeShellExecution
  - AfterShellExecution
  - BeforeMCPExecution
  - AfterMCPExecution
  - BeforeReadFile
  - AfterFileEdit
  - BeforeTabFileRead
  - AfterTabFileEdit
  - FileChanged
  - SubagentStart
  - SubagentStop
  - TaskCreated
  - TaskCompleted
  - TeammateIdle
  - PreCompact
  - PostCompact
  - PreModelSwitch
  - PostModelSwitch
  - Notification
  - MessageDisplay
  - AfterAgentResponse
  - AfterAgentThought
  - InstructionsLoaded
  - ConfigChange
  - CwdChanged
  - DirectoryAdded
  - WorkspaceOpen
  - WorktreeCreate
  - WorktreeRemove
  - Elicitation
  - ElicitationResult
