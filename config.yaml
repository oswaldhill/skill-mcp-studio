auto_discover:
  enabled: true
  exclude_paths:
  - ~/.skills-manager/skills
  - ~/.adal/skills
  - ~/.aider-desk/skills
  - ~/.augment/skills
  - ~/.bob/skills
  - ~/.cherrystudio/skills
  - ~/.clawdbot/skills
  - ~/.codeartsdoer/skills
  - ~/.codemaker/skills
  - ~/.codestudio/skills
  - ~/.commandcode/skills
  - ~/.config/crush/skills
  - ~/.config/devin/skills
  - ~/.config/goose/skills
  - ~/.factory/skills
  - ~/.forge/skills
  - ~/.iflow/skills
  - ~/.junie/skills
  - ~/.kilocode/skills
  - ~/.kimi/skills
  - ~/.kode/skills
  - ~/.mcpjam/skills
  - ~/.mux/skills
  - ~/.neovate/skills
  - ~/.openclaw/skills
  - ~/.openhands/skills
  - ~/.pochi/skills
  - ~/.qwen/skills
  - ~/.qwenworkcn/skills
  - ~/.roo/skills
  - ~/.rovodev/skills
  - ~/.trae-cn/builtin/*/skills
  - ~/.understand-anything-plugin/skills
  - ~/.vibe/skills
  - ~/.zencoder/skills
  - ~/.codebuddy/skills
  - ~/.gemini/skills
  - ~/.trae/skills
  - ~/.ghcp-appmod/skills
  - ~/.qoder/skills
  - ~/.continue/skills
  - ~/.kiro/skills
  - ~/.cline/skills
  - ~/.Trash/skills
  - ~/skills
  - ~/.qwencode/skills
  - ~/.qclaw/skills
  - ~/.hermes/skills
  - ~/.lingma/skills
  - ~/.dsh/skills
  scan_paths:
  - ~/.config/*/skills
  - ~/.*/skills
  - ~/.config/*/agent/skills
schema_version: 1
active_profile: generic-http

profile_sources:
- ~/.skills-manager/profiles.local.yaml
- data/local_overrides.yaml

profiles:
  generic-http:
    name: my-mcp
    url: https://example.internal/mcp
    transport: streamable-http
    url_policy: strict
    required_capabilities: {}
mcp_tools:
- name: Claude Code
  aliases: [claude, claude-code]
  install:
    app_bundles: [/Applications/Claude.app]
    commands: [claude]
    config_paths: [~/.claude.json, ~/.claude/settings.json]
  config_path: ~/.claude.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.claude/settings.json
- name: Cursor
  aliases: [cursor]
  install:
    app_bundles: [/Applications/Cursor.app]
    commands: [cursor]
    config_paths: [~/.cursor/mcp.json]
  config_path: ~/.cursor/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.cursor/hooks.json
- name: WorkBuddy
  aliases: [workbuddy, codebuddy]
  install:
    app_bundles: [/Applications/WorkBuddy.app]
    commands: [workbuddy]
    config_paths: [~/.workbuddy/mcp.json]
  config_path: ~/.workbuddy/mcp.json
  format: json
  mcp_key_path: [mcpServers]
  fix_supported: true
  hooks_config_path: ~/.workbuddy/settings.json
- name: Codex
  aliases: [codex]
  install:
    # 新版 Codex 已并入 OpenAI ChatGPT 桌面应用（无独立 Codex.app，CLI 内嵌在
    # ChatGPT.app/Contents/Resources/codex）；同时保留旧独立安装形态的探测。
    app_bundles: [/Applications/Codex.app, /Applications/ChatGPT.app]
    commands: [codex, /Applications/ChatGPT.app/Contents/Resources/codex]
    config_paths: [~/.codex/config.toml]
  config_path: ~/.codex/config.toml
  format: toml
  mcp_key_path: [mcp_servers]
  # Codex 已有本地 hermes stdio 桥（~/.codex/config.toml 的 [mcp_servers.hermes]
  # 指向 hermes 网关的 mcp_stdio_bridge.py）。统一端点必须用独立 key 写入，否则会
  # 命中同名桥并把它改写成 HTTP 形态 —— 那既破坏本地桥，又因改写后 url 校验不过
  # 而整条修复回滚（实测报 "validation failed; original configuration was rolled
  # back"）。与 OpenCode 同一处理。
  unified_name: hermes-unified
  fix_supported: true
  hooks_config_path: ~/.codex/hooks.json
- name: Reasonix
  aliases: [reasonix]
  install:
    app_bundles: [/Applications/Reasonix.app]
    commands: [reasonix]
    config_paths: [~/.reasonix/config.toml]
  config_path: ~/.reasonix/config.toml
  format: reasonix_toml
  mcp_key_path: [plugins]
  fix_supported: true
- name: OpenCode
  aliases: [opencode]
  install:
    commands: [opencode]
    config_paths: [~/.config/opencode/opencode.jsonc]
  config_path: ~/.config/opencode/opencode.jsonc
  format: jsonc
  mcp_key_path: [mcp]
  # OpenCode 的 MCP 条目是**判别联合**：官方 schema 里 McpRemoteConfig 要求
  # required [type, url]、McpLocalConfig 要求 [type, command]，缺 type 会让**整份
  # 配置**被判无效（实测 `opencode debug config` 报 "Expected { type: local } |
  # { type: remote }, got {"url": ...} / Missing key ...enabled"）。而 mcpServers 型
  # 客户端（Claude Code / Cursor / WorkBuddy）的条目只需 url，多写 type 反而多余。
  # 故连接类型按客户端声明，而不是在渲染层统一硬编码。
  mcp_entry_type: remote
  # OpenCode 已有本地 hermes stdio 桥（指向 NAS 网关），统一端点用独立 key 写入，避免覆盖本地桥
  unified_name: hermes-unified
  # 本地 stdio 桥条目名为 "hermes"（hermes-bridge.py 指向 NAS 网关），与统一端点
  # hermes-unified 并存属待收口遗留：声明为按工具 legacy 名，审计可见，
  # --remove-legacy-mcp（活体验证安全门）清理。该名与其它客户端的正典名冲突，
  # 故只能声明在工具级，不进 profile 的 legacy_names。
  legacy_names: [hermes]
  fix_supported: true
  hooks_config_path: ~/.config/opencode/opencode.jsonc
- name: DeepSeek Harness
  type: AI Agent
  aliases: [dsh, DSH, deepseek-dsh, dsh-web, deepseek-harness, deepseek]
  install:
    # 桌面 app 现名 /Applications/DeepSeek Harness.app（bundle id
    # com.deepseek.harness.local）；旧名 DeepSeek AI Assistant.app 保留作兜底。
    # commands 除裸名外补 Homebrew 绝对路径：GUI 壳从 Finder 启动时继承 launchd
    # 最小 PATH（没有 /opt/homebrew/bin），只写裸名 dsh 会被误判成「仅配置」。
    app_bundles: [/Applications/DeepSeek Harness.app, /Applications/DeepSeek AI Assistant.app]
    commands: [dsh, /opt/homebrew/bin/dsh]
    config_paths: [~/.dsh/settings.yaml, ~/.dsh/profiles/web/cordis.patch.yml, ~/.dsh/mcp.json]
  config_path: ~/.dsh/profiles/web/cordis.patch.yml
  format: cordis_yaml
  mcp_key_path: [hermes]
  # 多路径回退：本机实际统一端点写在 ~/.dsh/mcp.json（标准 json mcpServers），
  # 而远端 cordis 机器写在 cordis.patch.yml（cordis_yaml）。任一命中即判 configured，
  # 主路径仍是 cordis.patch.yml（--fix-mcp 写入目标不变）。
  config_candidates:
    - path: ~/.dsh/mcp.json
      format: json
      key_path: [mcpServers]
  fix_supported: true
# 已知非技能消费客户端：其 skills 链接存在（同步脚本批量建立），但客户端本身
# 不按技能消费，审计不应报 UNMANAGED 判不合规。与 auto_discover.exclude_paths
# 的区别：豁免名单保留扫描可见性（L2 仍可报链接状态），仅不计入未纳管。
# - CC Switch：Claude Code/Codex 提供方切换器（CC Switch.app），非 AI Agent
# - ima.copilot：已注册于下方 tools 段（腾讯 ima，~/.copilot 目录，L2 管理其链接）
unmanaged_exempt:
- CC Switch
tools:
- backup_suffix: .bak
  name: OpenCode
  skills_paths:
  - ~/.config/opencode/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Cursor
  skills_paths:
  - ~/.cursor/skills
  type: AI IDE
- backup_suffix: .bak
  name: Claude Code
  skills_paths:
  - ~/.claude/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: WorkBuddy
  skills_paths:
  - ~/.workbuddy/skills
  type: AI Assistant
- backup_suffix: .bak
  name: TRAE
  skills_paths:
  - ~/.trae-cn/skills
  type: AI IDE
- backup_suffix: .bak
  name: DeepSeek Harness
  aliases: [dsh, DSH, deepseek-harness]
  skills_paths:
  - ~/.dsh/skills
  type: AI Agent
- backup_suffix: .bak
  name: Codex
  skills_paths:
  - ~/.codex/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: Reasonix
  skills_paths:
  - ~/.reasonix/skills
  type: AI Coding Assistant
- backup_suffix: .bak
  name: ima.copilot
  aliases: [copilot, .copilot, ima-copilot, github-copilot]
  install:
    app_bundles: [/Applications/ima.copilot.app]
    config_paths: [~/.copilot/config.json]
  skills_paths:
  - ~/.copilot/skills
  type: AI Assistant
# 非 IDE/Agent：供应商切换器 + 本地代理（com.ccswitch.desktop），给 Claude Code /
# Codex / Gemini / OpenCode 切换配置，自身不做推理、不跑 agent 循环，也不消费 MCP
# （它是把 MCP「注入」到别的客户端）。它同时带技能管理功能，故 ~/.cc-switch/skills
# 是统一技能库的挂载点。`non_agent: true` 的语义（见 management_snapshot）：只在
# 技能审计里可见，不进 IDE/Agent 列表与统计，也不进 MCP 面板。
# name 归一化后与自动发现写入的 `.cc-switch` 同名（都归一为 ccswitch），因此这里的
# 声明会与发现条目字段级合并，顺带修掉「显示成带点的目录名」那个问题。
- backup_suffix: .bak
  name: CC Switch
  aliases: [cc-switch, .cc-switch, ccswitch]
  non_agent: true
  install:
    app_bundles: [/Applications/CC Switch.app]
  skills_paths:
  - ~/.cc-switch/skills
  type: 配置工具
unified_skills_dir: ~/.skills-manager/skills

# ── Hook 管理域（参照 mcp_tools / tools 范式）──────────────────────────
# 各 IDE/Agent 的生命周期 hook 配置位置、事件签名与标准注入模板。
# 此前 ai_memory_checker.AI_MEMORY_HOOKS_PATHS 是硬编码，现提升为声明式
# 配置：management_snapshot 优先读本段产出 hooks inventory，hooks_fixer
# 据此写入标准 hook 模板（backup → atomic-write → validate → rollback）。
# mcp_tools[].hooks_config_path 作为兼容字段保留，本段为权威来源。
hooks:
  # 标准事件签名（跨客户端归一；写入时按各客户端 event_format 转大小写）
  events:
  - name: SessionStart
    description: 会话开始
  - name: UserPromptSubmit
    description: 用户提交提示
  - name: SessionEnd
    description: 会话结束
  - name: Stop
    description: 停止
  # 各客户端的 hook 配置位置与写入规范
  clients:
  - name: Claude Code
    config_path: ~/.claude/settings.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    events: [SessionStart, UserPromptSubmit, SessionEnd, Stop]
    fix_supported: true
    note: Claude Code 生命周期 hooks（settings.json）
    # 标准注入模板：事件 → ai-memory hook 命令
    template:
      SessionStart: ai-memory hook --event session_start
      SessionEnd: ai-memory hook --event session_end
      Stop: ai-memory hook --event stop
  - name: Cursor
    config_path: ~/.cursor/hooks.json
    format: json
    hook_key_path: [hooks]
    event_format: camel_case
    events: [sessionStart, sessionEnd, stop]
    fix_supported: true
    note: Cursor 生命周期 hooks（hooks.json；事件名为小写 camelCase）
    template:
      sessionStart: ai-memory hook --event session_start
      sessionEnd: ai-memory hook --event session_end
      stop: ai-memory hook --event stop
  - name: WorkBuddy
    config_path: ~/.workbuddy/settings.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    events: [PreToolUse, UserPromptSubmit, PostToolUse, SessionStart, Notification, SubagentStop, PreCompact, SubagentStart, SessionEnd, Stop]
    fix_supported: true
    note: WorkBuddy 生命周期 hooks（settings.json；Claude 派生架构）
    template:
      SessionStart: ai-memory hook --event session_start
      SessionEnd: ai-memory hook --event session_end
      Stop: ai-memory hook --event stop
  - name: Codex
    config_path: ~/.codex/hooks.json
    format: json
    hook_key_path: [hooks]
    event_format: pascal_case
    events: [SessionStart, UserPromptSubmit, Stop]
    fix_supported: true
    note: Codex 生命周期 hooks（hooks.json；无 true SessionEnd）
    template:
      SessionStart: ai-memory hook --event session_start
      Stop: ai-memory hook --event stop
  - name: OpenCode
    config_path: ~/.config/opencode/plugins/ai-memory.ts
    format: plugin
    hook_key_path: []
    events: []
    fix_supported: false
    plugin: true
    note: OpenCode 用 TS 插件（plugins/ai-memory.ts）而非 JSON hooks，不支持模板注入
