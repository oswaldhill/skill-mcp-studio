name: Build Linux App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
    paths-ignore:
      # Q1-3：文档/说明类改动不可能影响构建产物，却会拉起三平台全量打包
      # （macOS 那条 timeout 45 分钟）。tags 触发不受影响（发版必须构建）。
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# B-4: 同一 ref 的重复触发串行化，取消在途旧跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Q0-2：顶层收窄为只读。原来顶层就是 contents: write，而本 workflow 同时被
# pull_request 触发 —— PR 场景下这一步授权超出所需（最小权限原则）。
# 需要写权限的只有「上传 release 资产」，因此把它下放到发布 job（见文件末尾）。
permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux app (deb + rpm + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies (webkit2gtk)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1  # Q0-1: 钉具体版本；@stable 会在上游发版时无声切换编译器
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm 构建。
      # 用 --bundles 覆盖 config 里 macOS 专属的 "app"，产出 Linux 安装包：
      #   deb -> .deb；rpm -> .rpm；appimage -> .AppImage。
      - name: Build Tauri app (deb + rpm + AppImage)
        working-directory: src-tauri
        run: tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="src-tauri/target/release/bundle"
          find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          # B-6: 为发布产物生成 SHA256 校验和，供用户校验下载完整性。
          (cd dist && sha256sum *.deb *.rpm *.AppImage > SHA256SUMS)
          ls -la dist/

      # 非 tag 触发（push/PR/manual）：仅上传构建产物作为 artifact 校验
      - name: Upload artifacts (build validation)
        # 总是上传：tag 触发时由 release job 取用（Q0-2 拆 job 后必需）。
        uses: actions/upload-artifact@v6
        with:
          name: skill-mcp-studio-linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS

  release-linux:
    # Q0-2：发布单独成 job，只有它持有 contents: write。
    # 原来 build 与 release 同在一个 job，顶层就必须给 contents: write，
    # 而本 workflow 同时被 pull_request 触发 —— PR 场景下授权超出所需。
    name: Publish GitHub Release (Linux)
    needs: build-linux
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: skill-mcp-studio-linux
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
          # 正文由 release-notes.yml 统一写入。这里必须为 false：
          # 三个平台各自 generate_release_notes 会把正文重复追加三次
          # （v0.23.0 的 Release 正文即为三份重复内容）。
          generate_release_notes: false
          draft: false
          prerelease: false
