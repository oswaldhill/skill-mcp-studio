name: Build Linux App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux app (deb + rpm + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm 构建。
      # 用 --bundles 覆盖 config 里 macOS 专属的 "app"，产出 Linux 安装包：
      #   deb -> .deb；rpm -> .rpm；appimage -> .AppImage。
      - name: Build Tauri app (deb + rpm + AppImage)
        working-directory: src-tauri
        run: tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="src-tauri/target/release/bundle"
          find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist/

      # 非 tag 触发（push/PR/manual）：仅上传构建产物作为 artifact 校验
      - name: Upload artifacts (build validation)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-mcp-studio-linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

      # tag 触发（v*）：将 deb/rpm/AppImage 追加到 GitHub Release
      # （与 macOS/windows workflow 并存；action-gh-release 对已存在 release 做增量追加）
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false