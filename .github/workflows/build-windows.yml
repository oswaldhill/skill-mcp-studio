name: Build Windows App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 将 secret 提升为 job 级环境变量，供步骤 if 条件判断。
      # （GitHub Actions 的 secrets 上下文不可直接在 if 表达式中使用）
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm 构建。
      # 用 --bundles 覆盖 config 里 macOS 专属的 "app"，产出 Windows 安装包：
      #   nsis -> .exe 安装器；msi -> .msi（WiX）。
      # 注意：逗号分隔值必须加引号，否则 PowerShell 把 'nsis,msi' 当成数组拆开。
      - name: Build Tauri app (NSIS + MSI)
        working-directory: src-tauri
        run: tauri build --bundles "nsis,msi"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            Copy-Item -Destination dist -Force
          Get-ChildItem dist | Select-Object Name, Length

      # 仅当配置了 WINDOWS_CERTIFICATE（base64 .pfx）时用 signtool 签名；
      # 未配置时跳过，构建不中断（安装包仍可用，只是触发 SmartScreen 警告）。
      # 证书到位后：在仓库 Settings → Secrets 添加
      #   WINDOWS_CERTIFICATE_PASSWORD（.pfx 导出密码）
      #   WINDOWS_CERTIFICATE（PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))）
      # 即可自动启用签名，无需改代码。时间戳服务器默认 DigiCert，可用
      #   WINDOWS_TIMESTAMP_URL 覆盖（企业可能要求内网时间戳）。
      - name: Sign binaries (when certificate configured)
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          Write-Host "导入 .pfx 证书用于代码签名"
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          $files = Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse
          foreach ($f in $files) {
            Write-Host "签名: $($f.FullName)"
            & signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr $timestamp /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool 签名失败"; exit $LASTEXITCODE }
          }
          Remove-Item $pfx -Force
          Write-Host "签名完成，验证:"
          foreach ($f in $files) { & signtool verify /pa /v $f.FullName }

      # 非 tag 触发（push/PR/manual）：仅上传构建产物作为 artifact 校验
      - name: Upload artifacts (build validation)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-mcp-studio-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi

      # tag 触发（v*）：将 NSIS(.exe)/MSI(.msi) 追加到 GitHub Release
      # （与 macOS/linux workflow 并存；action-gh-release 对已存在 release 做增量追加）
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false