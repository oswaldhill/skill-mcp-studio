name: Build Windows App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
    paths-ignore:
      # Q1-3：文档/说明类改动不可能影响构建产物，却会拉起三平台全量打包
      # （macOS 那条 timeout 45 分钟）。tags 触发不受影响（发版必须构建）。
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# B-4: 同一 ref 的重复触发串行化，取消在途旧跑。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Q0-2：顶层收窄为只读。原来顶层就是 contents: write，而本 workflow 同时被
# pull_request 触发 —— PR 场景下这一步授权超出所需（最小权限原则）。
# 需要写权限的只有「上传 release 资产」，因此把它下放到发布 job（见文件末尾）。
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows app (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 将 secret 提升为 job 级环境变量，供步骤 if 条件判断。
      # （GitHub Actions 的 secrets 上下文不可直接在 if 表达式中使用）
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1  # Q0-1: 钉具体版本；@stable 会在上游发版时无声切换编译器
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm 构建。
      # 用 --bundles 覆盖 config 里 macOS 专属的 "app"，产出 Windows 安装包：
      #   nsis -> .exe 安装器；msi -> .msi（WiX）。
      # 注意：逗号分隔值必须加引号，否则 PowerShell 把 'nsis,msi' 当成数组拆开。
      - name: Build Tauri app (NSIS + MSI)
        working-directory: src-tauri
        run: tauri build --bundles "nsis,msi"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            Copy-Item -Destination dist -Force
          # B-6: 生成 SHA256 校验和，供用户校验下载完整性。
          $sums = Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse |
            ForEach-Object {
              $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            }
          Set-Content -Path "dist\SHA256SUMS" -Value $sums -Encoding ascii
          Get-ChildItem dist | Select-Object Name, Length

      # 仅当配置了 WINDOWS_CERTIFICATE（base64 .pfx）时用 signtool 签名；
      # 未配置时跳过，构建不中断（安装包仍可用，只是触发 SmartScreen 警告）。
      # 证书到位后：在仓库 Settings → Secrets 添加
      #   WINDOWS_CERTIFICATE_PASSWORD（.pfx 导出密码）
      #   WINDOWS_CERTIFICATE（PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))）
      # 即可自动启用签名，无需改代码。时间戳服务器默认 DigiCert，可用
      #   WINDOWS_TIMESTAMP_URL 覆盖（企业可能要求内网时间戳）。
      - name: Sign binaries (when certificate configured)
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL || 'https://timestamp.digicert.com' }}
        run: |
          Write-Host "导入 .pfx 证书用于代码签名"
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          $files = Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse
          foreach ($f in $files) {
            Write-Host "签名: $($f.FullName)"
            & signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr $timestamp /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool 签名失败"; exit $LASTEXITCODE }
          }
          Remove-Item $pfx -Force
          Write-Host "签名完成，验证:"
          foreach ($f in $files) { & signtool verify /pa /v $f.FullName }

      # 非 tag 触发（push/PR/manual）：仅上传构建产物作为 artifact 校验
      - name: Upload artifacts (build validation)
        # 总是上传：tag 触发时由 release job 取用（Q0-2 拆 job 后必需）。
        uses: actions/upload-artifact@v6
        with:
          name: skill-mcp-studio-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS
          # 正文由 release-notes.yml 统一写入。这里必须为 false：
          # 三个平台各自 generate_release_notes 会把正文重复追加三次
          # （v0.23.0 的 Release 正文即为三份重复内容）。
          generate_release_notes: false
          draft: false
          prerelease: false

  release-windows:
    # Q0-2：发布单独成 job，只有它持有 contents: write。
    # 原来 build 与 release 同在一个 job，顶层就必须给 contents: write，
    # 而本 workflow 同时被 pull_request 触发 —— PR 场景下授权超出所需。
    name: Publish GitHub Release (Windows)
    needs: build-windows
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: skill-mcp-studio-windows
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS
          # 正文由 release-notes.yml 统一写入。这里必须为 false：
          # 三个平台各自 generate_release_notes 会把正文重复追加三次
          # （v0.23.0 的 Release 正文即为三份重复内容）。
          generate_release_notes: false
          draft: false
          prerelease: false
