name: Build Windows App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm 构建。
      # 用 --bundles 覆盖 config 里 macOS 专属的 "app"，产出 Windows 安装包：
      #   nsis -> .exe 安装器；msi -> .msi（WiX）。
      # 注意：逗号分隔值必须加引号，否则 PowerShell 把 'nsis,msi' 当成数组拆开。
      - name: Build Tauri app (NSIS + MSI)
        working-directory: src-tauri
        run: tauri build --bundles "nsis,msi"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            Copy-Item -Destination dist -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifacts (build validation)
        uses: actions/upload-artifact@v4
        with:
          name: skill-mcp-studio-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi