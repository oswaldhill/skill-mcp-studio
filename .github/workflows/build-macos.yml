name: Build & Release macOS App

on:
  push:
    branches: [master, develop]
    tags: ['v*']
    paths-ignore:
      # Q1-3：文档/说明类改动不可能影响构建产物，却会拉起三平台全量打包
      # （macOS 那条 timeout 45 分钟）。tags 触发不受影响（发版必须构建）。
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# B-4: 同一 ref 的重复触发（push + PR 同步、连续 push）串行化，取消在途旧跑，避免一次发布 6 次并发构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Q0-2：顶层收窄为只读。原来顶层就是 contents: write，而本 workflow 同时被
# pull_request 触发 —— PR 场景下这一步授权超出所需（最小权限原则）。
# 需要写权限的只有「上传 release 资产」，因此把它下放到发布 job（见文件末尾）。
permissions:
  contents: read

jobs:
  build-macos:
    name: Build universal macOS app (Intel + Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # 将 secret 提升为 job 级环境变量，供步骤 if 条件判断。
      # （GitHub Actions 的 secrets 上下文不可直接在 if 表达式中使用）
      ACTIONS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      ACTIONS_APPLE_ID: ${{ secrets.APPLE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1  # Q0-1: 钉具体版本；@stable 会在上游发版时无声切换编译器
        with:
          # universal-apple-darwin 需要同时具备两个目标，Tauri 会自动 lipo 合并
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 仅当配置了 APPLE_CERTIFICATE（base64 .p12）时导入证书并启用正式签名 + 公证；
      # 未配置时跳过此步，Tauri 自动回退到 ad-hoc 签名（本机可运行，未公证）。
      - name: Import Apple signing certificate
        if: ${{ env.ACTIONS_APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-temp-keychain-password' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12
          # 将签名/公证凭据透传给后续构建步骤（值不会打印到日志）
          {
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}"
            echo "APPLE_ID=${APPLE_ID}"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
          } >> "$GITHUB_ENV"

      # 项目前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm
      # 构建步骤。universal-apple-darwin：Tauri 分别编译 arm64/x86_64 并 lipo 合并，
      # 产出单一 .app，原生运行于 Intel 与 Apple Silicon。
      - name: Build Tauri app (universal)
        working-directory: src-tauri
        run: tauri build --target universal-apple-darwin

      - name: Verify signature & notarization (when signed)
        if: ${{ env.ACTIONS_APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -type d -name 'skill-mcp-studio.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::warning::未找到 .app，跳过签名验证"
            exit 0
          fi
          # B-6: 补全签名/公证验证——结构签名校验 + Gatekeeper 评估 + 公证票校验。
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
          # Gatekeeper（spctl）评估：签名有效 + 未公证会返回 2（rejected）。
          # 未配置公证（无 APPLE_ID）时 spctl 只评估签名，不以失败阻断任一步骤。
          spctl -a -vv "$APP" 2>&1 || echo "::warning::spctl 评估未通过（可能未公证，仅签名）"
          # stapler 校验公证票是否已钉入 bundle（未钉票时返回非零，仅告警不阻断）。
          if xcrun stapler validate "$APP" 2>&1; then
            echo "公证票已钉入并通过校验"
          else
            echo "::warning::未检测到公证票（未公证或未 stapler staple）"
          fi

      - name: Package DMG + app.zip
        # B-10: CI 走确定性极简打包（UDZO + Applications 软链），不依赖
        # scripts/build_dmg.sh（开发机便利脚本，带 create-dmg 窗口布局 + 递归自包含
        # 缺陷修复，输出名不同）。两者目标不同、刻意并存：CI 与脚本产物的安装语义
        # 一致（都含 .app + Applications 拖拽快捷方式）。
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/skill-mcp-studio.app"
          [ -d "$APP" ] || APP=$(find src-tauri/target -type d -name 'skill-mcp-studio.app' | head -1)
          echo "App bundle: $APP"
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "Skill MCP Studio" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/Skill-MCP-Studio-universal.dmg"
          # 将 .app 打包为 zip 供直接下载（保留 bundle 结构与符号链接）
          ditto -c -k --keepParent "$APP" "dist/skill-mcp-studio-universal.app.zip"
          # B-6: 生成 SHA256 校验和，供用户校验下载完整性。
          (cd dist && shasum -a 256 Skill-MCP-Studio-universal.dmg skill-mcp-studio-universal.app.zip > SHA256SUMS)
          ls -la dist/

      # 非 tag 触发（push/PR/manual）：仅上传构建产物作为 artifact 校验
      - name: Upload artifacts (build validation)
        # 总是上传：tag 触发时由下面的 release job 取用（Q0-2 拆 job 后必需）。
        uses: actions/upload-artifact@v6
        with:
          name: skill-mcp-studio-macos-universal
          if-no-files-found: error
          path: |
            dist/Skill-MCP-Studio-universal.dmg
            dist/skill-mcp-studio-universal.app.zip
            dist/SHA256SUMS

  release-macos:
    # Q0-2：发布单独成 job，只有它持有 contents: write。
    # 原来 build 与 release 同在一个 job，顶层就必须给 contents: write，
    # 而本 workflow 同时被 pull_request 触发 —— PR 场景下授权超出所需。
    name: Publish GitHub Release (macOS)
    needs: build-macos
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: skill-mcp-studio-macos-universal
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Skill-MCP-Studio-universal.dmg
            dist/skill-mcp-studio-universal.app.zip
            dist/SHA256SUMS
          # 正文由 release-notes.yml 统一写入。这里必须为 false：
          # 三个平台各自 generate_release_notes 会把正文重复追加三次
          # （v0.23.0 的 Release 正文即为三份重复内容）。
          generate_release_notes: false
          draft: false
          prerelease: false
