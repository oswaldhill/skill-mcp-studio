name: Build macOS App

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.app + .dmg, arm64)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      # 本项目前端为纯静态单文件（gui/dashboard.html，frontendDist=../gui），无 npm
      # 构建步骤，故直接 tauri build（runner 为 arm64，产物默认落 target/release/）。
      # 无 Apple 证书时 Tauri 做 ad-hoc 签名（本机可运行，未公证）。
      - name: Build Tauri app
        working-directory: src-tauri
        run: tauri build

      - name: Build DMG
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/skill-mcp-studio.app"
          STAGE="dist/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Skill MCP Studio" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "dist/Skill-MCP-Studio.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skill-mcp-studio-macos-arm64
          path: |
            src-tauri/target/release/bundle/macos/*.app
            dist/*.dmg